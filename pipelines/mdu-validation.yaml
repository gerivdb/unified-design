name: mdu-validation
description: Pipeline de validation du Meta-Design Unifié (MDU)
version: "1.0.0"
status: active
intent_hash: 0xPIPELINE_MDU_VALIDATION_20260920
triggers:
  - pre-commit
  - pre-push
  - manual
steps:
  - name: validate_designs
    description: "Valider tous les designs YAML du MDU"
    command: "python scripts/validate_designs.py --strict"
    continue_on_error: false
    timeout: 120
  - name: validate_frontmatter
    description: "Valider le frontmatter des documents de gouvernance"
    command: "python scripts/validate_frontmatter.py"
    continue_on_error: false
    timeout: 60
  - name: validate_cross_references
    description: "Valider les références croisées entre designs/atoms/ADR"
    command: "python scripts/validate_cross_references.py"
    continue_on_error: false
    timeout: 120
  - name: validate_design_coverage
    description: "Valider que tous les designs requis sont présents"
    command: "python scripts/validate_design_coverage.py"
    continue_on_error: false
    timeout: 60
artifacts:
  - path: reports/mdu-validation-report.json
    format: json
  - path: reports/mdu-validation-report.md
    format: markdown
governance:
  adr: ADR-2026-09-19-SAFE-ACTION-PATTERN
  design: ecosystem-meta-coherence
  atom: ecosystem-meta-coherence-gate
