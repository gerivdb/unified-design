# PIPELINE — Windows Process Governance

## Contexte

L'incident du 2026-09-25 a révélé 11 processus `auto-dispatcher.ps1` orphelins dans `GeriCode/.kilo/orchestrator/`, consommant ~1,1 Go RAM sans aucune mission à traiter.

Ce pipeline couvre l'ensemble de la gouvernance des processus Windows :
- **P0** : `ProcessManager` KIX — singleton bind + PID registry + bail Swarm-Lease
- **P1** : Module partagé `win32_process` — extraction primitive NT Job Objects vers `libs/shared-clients/win32_process.py`
- **P1** : `WindowVisibilityManager` LOOPX — fenêtres cachées par défaut + HITL explicite
- **P2** : `AdminTaskCoordinator` LOOPX — coordination NSSM/schtasks/services avec bail
- **P3** : Repo dédié `SVC-MANAGER` si ≥3 consommateurs

## Architecture cible

```
┌─────────────────────────────────────────────────────┐
│  KIX ProcessManager (P0)                            │
│  - Singleton Bind Manager                           │
│  - PID Registry Manager                             │
│  - Swarm-Lease integration                          │
├─────────────────────────────────────────────────────┤
│  win32_process module partagé (P1)                  │
│  - OpenProcess / TerminateProcess / handles         │
│  - NT Job Objects (extrait TRIX)                    │
│  - Fingerprint d'instance                           │
├─────────────────────────────────────────────────────┤
│  LOOPX WindowVisibilityManager (P1)                 │
│  - Fenêtres cachées par défaut                      │
│  - HITL explicite pour affichage visible            │
├─────────────────────────────────────────────────────┤
│  LOOPX AdminTaskCoordinator (P2)                    │
│  - NSSM / schtasks / services coordination          │
│  - Bail Swarm-Lease sur admin tasks                 │
└─────────────────────────────────────────────────────┘
```

## Intégration Swarm-Lease

| Composant | Rôle |
|-----------|------|
| **KIX** (`L2-PLATFORM`) | Hôte du `ProcessManager` (P0) + endpoint `/process/*` |
| **LOOPX** (`L3-CITIZENS`) | Hôte du `WindowVisibilityManager` + `AdminTaskCoordinator` (P1/P2) |
| **TRIX** (`L4-TOOLS`) | Source de l'extraction NT Job Objects → module partagé `libs/shared-clients/win32_process.py` |
| **PULSE** (`L2-PLATFORM`) | Alignement sur `ntjob.zig` (Zig) pour les limites RAM/CPU |
| **GOVERNANCE-HUB** (`L0-CANON`) | SOT `known_repositories.yaml` + ADR-106 backing + ADR-2026-09-25 backing |
| **GeriCode** (`L2-PLATFORM`) | Implémentation P0 daemon registry PowerShell : `auto-dispatcher.ps1` + `dispatcherctl.ps1` + `daemon-registry.ps1` |
| **Swarm-Lease** (GEN-013) | Intégration baux territoire sur PID registry et admin tasks |

