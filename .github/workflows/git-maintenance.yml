name: Git Maintenance Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  git-maintenance:
    name: Git Maintenance
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify main sync with origin
        run: |
          git fetch origin
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::main is not synced with origin/main"
            echo "Local: $LOCAL_SHA"
            echo "Remote: $REMOTE_SHA"
            exit 1
          fi
          echo "✓ main is synced with origin/main"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -q jsonschema pyyaml
      
      - name: Validate meta-design.yaml schema
        run: python scripts/validate_meta_design.py --schema schemas/meta-design.schema.json meta-design.yaml
      
      - name: Cleanup merged branches (local)
        run: python scripts/cleanup_merged_branches.py
      
      - name: Report status
        run: |
          echo "## Git Maintenance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Completed Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ main sync verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ meta-design.yaml schema validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ merged branches cleaned" >> $GITHUB_STEP_SUMMARY