name: Design Validation

on:
  push:
    branches: [main]
    paths:
      - "designs/**"
      - "schemas/**"
      - "engine/**"
      - "atoms/**"
  pull_request:
    branches: [main]
    paths:
      - "designs/**"
      - "schemas/**"
      - "engine/**"
      - "atoms/**"

jobs:
  validate-designs:
    name: Validate Designs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate design schemas
        run: |
          python -c "
          import json, yaml, jsonschema, pathlib, sys
          root = pathlib.Path('.')
          schema_path = root / 'schemas' / 'design.schema.json'
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          errors = []
          for design_file in sorted((root / 'designs').glob('*.yaml')):
              try:
                  content = design_file.read_text(encoding='utf-8')
                  docs = list(yaml.safe_load_all(content))
                  validated = False
                  for doc in docs:
                      if not isinstance(doc, dict):
                          continue
                      jsonschema.validate(instance=doc, schema=schema)
                      validated = True
                  if validated:
                      print(f'[OK] {design_file}')
                  else:
                      errors.append(f'{design_file}: no mapping document found')
              except jsonschema.ValidationError as e:
                  errors.append(f'{design_file}: {e.message}')
              except yaml.YAMLError as e:
                  errors.append(f'{design_file}: YAML parse error: {e}')
              except Exception as e:
                  errors.append(f'{design_file}: {e}')
          if errors:
              print('---')
              print('VALIDATION FAILED')
              for err in errors:
                  print(err)
              sys.exit(1)
          print('All designs passed schema validation.')
          "

      - name: Validate design contracts
        run: |
          python -c "
          import re, yaml, pathlib, sys
          root = pathlib.Path('.')
          atoms_dir = root / 'atoms'
          errors = []
          for design_file in sorted((root / 'designs').glob('*.yaml')):
              try:
                  content = design_file.read_text(encoding='utf-8')
                  docs = list(yaml.safe_load_all(content))
                  data = None
                  for doc in docs:
                      if isinstance(doc, dict):
                          data = doc
                          break
                  if data is None:
                      errors.append(f'{design_file}: no mapping document found')
                      continue
                  name = data.get('name', '')
                  if name and not re.fullmatch(r'[a-z0-9-]+', name):
                      errors.append(f'{design_file}: non-universal name \"{name}\"')
                  depends = data.get('depends_on', [])
                  if isinstance(depends, list):
                      for dep in depends:
                          if not re.fullmatch(r'ATOM-[0-9]+-[a-z0-9-]+', dep):
                              errors.append(f'{design_file}: invalid depends_on \"{dep}\"')
                              if not list(atoms_dir.rglob(f'{dep}.md')) and not list(atoms_dir.rglob(f'{dep}.yaml')):
                                  errors.append(f'{design_file}: depends_on atom missing: {dep}')
                  bridges = data.get('bridges', [])
                  if isinstance(bridges, list):
                      for bridge in bridges:
                          if not isinstance(bridge, dict):
                              errors.append(f'{design_file}: invalid bridge entry')
                              continue
                          role = bridge.get('role', '')
                          if role and role not in ('consumer', 'provider', 'bidirectional'):
                              errors.append(f'{design_file}: invalid bridge role \"{role}\"')
              except yaml.YAMLError as e:
                  errors.append(f'{design_file}: YAML parse error: {e}')
              except Exception as e:
                  errors.append(f'{design_file}: {e}')
          if errors:
              print('---')
              print('CONTRACT VALIDATION FAILED')
              for err in errors:
                  print(err)
              sys.exit(1)
          print('All designs passed contract validation.')
          "

      - name: Validate atoms registry references
        run: |
          python -c "
          import re, yaml, pathlib, sys
          root = pathlib.Path('.')
          atoms_dir = root / 'atoms'
          errors = []
          for design_file in sorted((root / 'designs').glob('*.yaml')):
              try:
                  content = design_file.read_text(encoding='utf-8')
                  docs = list(yaml.safe_load_all(content))
                  data = None
                  for doc in docs:
                      if isinstance(doc, dict):
                          data = doc
                          break
                  if data is None:
                      errors.append(f'{design_file}: no mapping document found')
                      continue
                  for atom_id in data.get('depends_on', []):
                      if not list(atoms_dir.rglob(f'{atom_id}.md')) and not list(atoms_dir.rglob(f'{atom_id}.yaml')):
                          errors.append(f'{design_file}: atom {atom_id} missing')
              except yaml.YAMLError as e:
                  errors.append(f'{design_file}: YAML parse error: {e}')
              except Exception as e:
                  errors.append(f'{design_file}: {e}')
          if errors:
              print('---')
              print('ATOM REFERENCE VALIDATION FAILED')
              for err in errors:
                  print(err)
              sys.exit(1)
          print('All atom references are valid.')
          "
