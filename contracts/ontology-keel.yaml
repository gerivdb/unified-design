# CONTRACT-ONTOLOGY-KEEL — Premier contrat d'interface Déclaratif/Opératif

## Périmètre

Ce contrat définit l'interface explicite entre `ONTOLOGY` (déclaratif) et `KEEL` (opératif) :
- **ONTOLOGY** expose les concepts métier canoniques.
- **KEEL** consomme ces concepts comme mots-clés dans ses fichiers sources, configurations et tests.

## Règles d'interface

1. Tout concept utilisé dans KEEL DOIT être référencé dans `ONTOLOGY.yaml`.
2. Tout nouveau concept métier découvert dans KEEL DOIT faire l'objet d'une PR vers `ONTOLOGY` avant d'être utilisé en production.
3. Le mapping `ontology-keel-mapping.yaml` est la source de vérité des mots-clés KEEL ↔ concepts ONTOLOGY.
4. Le script `scripts/validate-ontology-concepts.py` est le hook de validation pré-compile obligatoire.

## Validation

- Hook : `scripts/validate-ontology-concepts.py`
- Exit 0 : tous les concepts référencés existent dans ONTOLOGY.
- Exit 1 : concept absent ou fichier erroné → bloquant.
- Test d'intégration : `tests/test_ontology_validation.py`.

## Governance

- Owner : `GOVERNANCE-HUB`
- Audit : traçabilité via WAZAA topic `ontology.contract.validation`
- Versionnement : tout changement du mapping nécessite un ADR de mise à jour.

