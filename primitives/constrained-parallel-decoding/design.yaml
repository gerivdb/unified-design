# Primitive : Constrained Parallel Decoding

## Description

Pattern de décodage parallèle contraint pour LLM local. Permet d'évaluer
plusieurs champs de décision en une seule passe, réduisant la latence
sub-seconde sur CPU.

## Contexte

Issu de `jevmlx` (KV cache broadcast) et transposé pour `llama.cpp` CPU
via `llama_batch` + logits biaisés.

## Architecture

```
+-------------------+     +---------------------+     +-------------------+
|   Question        | --> |  Constrained        | --> |  Decision Fields  |
|   Compiler        |     |  Parallel Decoder   |     |  (noul/choice/score)|
+-------------------+     +---------------------+     +-------------------+
                                   |
                                   v
                          +-------------------+
                          |  KV Cache         |
                          |  Broadcast        |
                          +-------------------+
                                   |
                                   v
                          +-------------------+
                          |  Logit Bias       |
                          |  Per Field        |
                          +-------------------+
                                   |
                                   v
                          +-------------------+
                          |  Batch Eval       |
                          |  (single pass)    |
                          +-------------------+
```

## Mécanisme

1. **Prefill unique** : Le prompt de contexte est prérempli une fois dans le KV cache
2. **Broadcast** : Le KV cache est réutilisé pour tous les champs de décision
3. **Logit bias** : Pour chaque champ, les logits sont biaisés sur les tokens autorisés
4. **Batch evaluation** : Tous les champs sont évalués dans un seul batch `llama_batch`

## Contraintes

- `max_batch_size` : 16 champs par batch
- `logit_bias_per_field` : true
- `kv_cache_reuse` : true
- `expected_latency_ms` : < 1000 ms sur Z600/ENV2

