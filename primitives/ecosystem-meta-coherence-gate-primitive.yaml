description: >
  Primitive de gate d'écosystème méta-cohérente pour le MDU.
  Garantit que toute mutation du MDU respecte les invariants Think/Do/Check
  et les cross-références canoniques avant autorisation.
inherits:
  - ecosystem-meta-coherence
  - safe-action-pattern
  - design-ops-loop-primitive
depends_on:
  - ATOM-GATE-LAYERS
  - ATOM-EXTERNAL-VERIFICATION-MANDATORY
