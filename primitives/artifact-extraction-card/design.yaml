# Primitive : Artifact Extraction Card

> **IntentHash** : `0xPRIMITIVE_ARTIFACT_EXTRACTION_CARD_20260920`  
> **Statut** : active  
> **Dépôt** : `gerivdb/unified-design`  
> **Màj requise si** : statut ADR passe à deprecated ou superseded  

---

## Description

Grille 16 champs pour fiche tout artefact détecté lors d'une extraction conversationnelle ou d'une analyse de design.

## Grille 16 champs (complète)

| # | Champ | Type | Obligatoire |
|---|-------|------|-------------|
| 1 | Nom / ID | string | ✅ |
| 2 | Type | enum | ✅ |
| 3 | Statut | enum | ✅ |
| 4 | Description synthétique | string | ✅ |
| 5 | Problème résolu / fonction principale | string | ✅ |
| 6 | Structure causale : cause -> mécanisme -> effet | string | ✅ |
| 7 | Dépendances amont / aval | list | ✅ |
| 8 | Entrées, sorties, invariants, déclencheurs | object | ✅ |
| 9 | Workflow ou pipeline associé, étape par étape | list | ✅ |
| 10 | Bénéfices attendus | list | ✅ |
| 11 | Coût, complexité, risques, dette éventuelle | string | ✅ |
| 12 | Indicateurs de succès / métriques | list | ✅ |
| 13 | Priorité (P0-P2), impact, effort | string | ✅ |
| 14 | Ancrage conversationnel : citations ou passages justifiant | string | ✅ |
| 15 | Niveau de confiance : certain \| probable \| hypothèse | enum | ✅ |
| 16 | Prochaine action recommandée | string | ✅ |

## Variante courte (8 champs)

| # | Champ |
|---|-------|
| 1 | Nom / ID |
| 2 | Type |
| 3 | Statut |
| 4 | Description |
| 5 | Dépendances |
| 6 | Bénéfices |
| 7 | Priorité |
| 8 | Confiance |

## Usage

```yaml
# Exemple de fiche complète
nom_id: "artifact-extraction-card"
type: "primitive"
statut: "actif"
description: "Grille 16 champs pour extraction d'artefacts."
structure_causale: "Conversation -> Extraction -> Fiche -> Validation"
dependances: ["ATOM-CONFIDENCE-THRESHOLD", "ATOM-CONVERSATION-ANCHORING"]
priorite: "P0"
confiance: "certain"
```

## Intégration MDU

- Utilisé par `meta-designer-role` pour toute extraction
- Couplé à `ATOM-ARTIFACT-EXTRACTION-STATUS` pour le champ 3
- Couplé à `ATOM-CONVERSATION-ANCHORING` pour le champ 14
- Couplé à `ATOM-CONFIDENCE-THRESHOLD` pour le champ 15

