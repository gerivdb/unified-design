# Primitive : Sovereign Adapter Pattern

## Description

Pattern d'adaptateur souverain pour JEVX. Traduit l'état Jev en prompt
de classification, valide JSON, normalise les probabilités. Transposition
Python de l'adaptateur TypeScript `localjev`.

## Contexte

`localjev` (githubnext) implémente un adaptateur TypeScript qui :
- Traduit l'état Jev en prompt de classification
- Valide le JSON de sortie
- Normalise les probabilités

Ce pattern est transposé en Python pour WSL1/ENV2.

## Architecture

```
+-------------------+     +---------------------+     +-------------------+
|   JEVX API        | --> |  Sovereign Adapter  | --> |  llama.cpp /      |
|   (/v1/systemone) |     |  Pattern            |     |  Backend LLM      |
+-------------------+     +---------------------+     +-------------------+
                                   |
                                   v
                          +-------------------+
                          |  State Compiler   |
                          |  (Jev -> Prompt)  |
                          +-------------------+
                                   |
                                   v
                          +-------------------+
                          |  JSON Validator   |
                          |  (schema strict)  |
                          +-------------------+
                                   |
                                   v
                          +-------------------+
                          |  Probability      |
                          |  Normalizer       |
                          +-------------------+
```

## Mécanisme

1. **State Compiler** : Traduit l'état Jev (noul/choice/score) en prompt de classification
2. **LLM Inference** : Appelle le backend via llama.cpp / OpenAI-compatible API
3. **JSON Validator** : Valide la sortie selon le schéma JSON strict
4. **Probability Normalizer** : Normalise les probabilités, calcule la confiance entropique
5. **Retry Loop** : Si JSON invalide, injection du message d'erreur + retry (max 2)

## Contraintes

- `response_format` : json_schema strict
- `temperature` : 0
- `seed_offset` : 7919
- `correction_strategy` : context_injection
- `max_retries` : 2
- WSL1 compatible : Python 3.12 + llama.cpp AVX1

