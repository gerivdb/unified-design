    - L1_manual
    - L2_assisted
    - L3_autonomous
    - L4_self_healing
    - L5_autonomic
    metrics:
    - success_rate
    - mttr
    - error_handling_coverage
- name: autonomy-axis
  description: "Axe Autonomie : capacit\xE9 \xE0 op\xE9rer sans HITL, \xE0 escalader,\
    \ \xE0 d\xE9cider"
  parameters:
    levels:
    - L1_manual
    - L2_assisted
    - L3_autonomous
    - L4_self_healing
    - L5_autonomic
