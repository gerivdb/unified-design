    - pol_compliance
    - pre_commit_pass_rate
principles:
- P0_FIVE_AXES: "\xE9valuation sur 5 axes obligatoires"
- P0_LEVELS: "chaque axe a 5 niveaux de maturit\xE9"
- P0_MEASURABLE: "chaque niveau est mesur\xE9 par des m\xE9triques objectives"
- P0_GOVERNANCE: "l'axe gouvernance est obligatoire et pr\xE9pond\xE9rant"
