name: kix
version: 1.0.0
status: active
profile: STANDARD
layer: L2-PLATFORM
intent_hash: 0xKIX_ORCHESTRATOR_20260828
inherits:
  - fractal-engineering-strata
  - meta-coherence
description: >
  KIX — Orchestrateur système de l'écosystème gerivdb.
  Gère tous les exécutables, PID, services Windows et processus
  (Python, Node, Zig, .exe), ainsi que les runners RLM et services
  de mesure. Responsable du cycle de vie complet :
  discover, boot, run, verify, shutdown. Logical layers: N1, N3.
consumers:
  - RLM-243
  - LLUX
  - TLM
  - TIMX
  - TALEX
  - RADX
  - RLM-METRICS
  - DevTools
  - ECOS-CLI
  - KIVA-CLI
  - CTULU
  - WAZAA
  - BRAIN
capabilities:
  - name: runner-lifecycle
    description: Orchestrer le cycle de vie complet des runners RLM cognitifs
    parameters:
      phases:
        - discover
        - boot
        - run
        - verify
        - shutdown
      validation_backend: RLM-243
  - name: tlm-runner
    description: Execution de scripts TLM-LANG via the TLM runner
    parameters:
      port: 8801
      validation_port: 8793
  - name: parallel-runner-manager
    description: Manage multiple runner instances with semaphore-based concurrency
    parameters:
      max_concurrency: 6
      memory_guard: true
  - name: metrics-lifecycle
    description: Orchestrer le cycle de vie du service RLM-METRICS (baseline, collecte, rapport)
    parameters:
      service: RLM-METRICS
      port: 8802
      endpoints:
        - /health
        - /collect
      validation_backend: RLM-243
  - name: process-manager
    description: Gestion de tous les processus (exe, py, js, zig, services Windows)
    parameters:
      track_pids: true
      restart_policy: auto
      max_concurrency: 6
      memory_guard: true
  - name: pid-tracker
    description: Suivi PID, fingerprint, health check
    parameters:
      preflight_singleton: true
      fingerprint_build: true
  - name: exe-launcher
    description: Lancement d'exécutables système et utilisateur
    parameters:
      allowed_paths:
        - C:\DevTools
        - D:\DO\WEB\TOOLS\L4-TOOLS
        - D:\DO\WEB\TOOLS\L1-INFRA
        - C:\Program Files
        - C:\Users\GG\AppData\Local\Programs\Python
components:
  - type: orchestrator
    repo: gerivdb/KIX
    path: KIX/
  - type: runner-dispatcher
    repo: gerivdb/KIX
    path: KIX/src/
  - type: validation
    repo: gerivdb/RLM-243
    protocol: http
    port: 8793
  - type: metrics-service
    repo: gerivdb/RLM-METRICS
    protocol: http
    port: 8802
  - type: process-supervisor
    repo: gerivdb/KIX
    path: KIX/src/
  - type: pid-registry
    repo: gerivdb/KIX
    path: KIX/src/
bridges:
  - target: repo:RLM-243
    role: consumer
    protocol: http
    port: 8793
  - target: repo:LLUX
    role: consumer
    protocol: wazaa-channel
  - target: repo:TLM-LANG
    role: consumer
    protocol: cli
  - target: repo:TALEX
    role: consumer
    protocol: wazaa-bus
  - target: repo:RLM-METRICS
    role: consumer
    protocol: http
    port: 8802
  - target: repo:DevTools
    role: system
    protocol: local
    path: C:\DevTools
  - target: repo:ECOS-CLI
    role: system
    protocol: cli
    path: D:\DO\WEB\TOOLS\L1-INFRA\ECOS-CLI
  - target: repo:KIVA-CLI
    role: system
    protocol: cli
    path: D:\DO\WEB\TOOLS\L1-INFRA\KIVA-CLI
dependencies:
  - repo: gerivdb/RLM-243
  - repo: gerivdb/LLUX
  - repo: gerivdb/TLM-LANG
  - repo: gerivdb/TIMX-FEATURE-STORE
  - repo: gerivdb/TALEX
  - repo: gerivdb/RADX
  - repo: gerivdb/RLM-METRICS
  - repo: gerivdb/DevTools
  - repo: gerivdb/ECOS-CLI
  - repo: gerivdb/KIVA-CLI
constraints:
  - cpu_only: true
  - ram_limit_mb: 24576
  - system_services: allowed
  - max_processes: 64
