name: kix
version: 1.0.0
status: active
profile: STANDARD
layer: L2-PLATFORM
intent_hash: 0xKIX_ORCHESTRATOR_20260828
adr_refs:
  - ADR-2026-07-27-016-kix-orchestrator
  - ADR-2026-08-18-002-KIX-GENERIC-RUNNER-WRAPPER
  - ADR-2026-09-24-ECOSYSTEM-INTEGRATION
  - ADR-2026-09-24-KIX-MULTI-LANG-RUNNERS
inherits:
  - fractal-engineering-strata
  - meta-coherence
description: >
  KIX — Orchestrateur système de l'écosystème gerivdb.
  Gère tous les exécutables, PID, services Windows et processus
  (Python, Node, Zig, .exe), ainsi que les runners RLM et services
  de mesure. Responsable du cycle de vie complet :
  discover, boot, run, verify, shutdown. Logical layers: N1, N3.
  Modèle de rôle/fonction : RBAC (admin/operator/viewer) + rôles fonctionnels runners + modèle de capacité + dual-role pattern + ActorSpec.
roles:
  - name: admin
    description: Accès complet à tous les endpoints KIX, gestion des runners, configuration, audit.
    permissions:
      - "runner:start"
      - "runner:stop"
      - "runner:restart"
      - "config:read"
      - "config:write"
      - "audit:read"
      - "audit:write"
      - "remediation:trigger"
  - name: operator
    description: "Opérations courantes : démarrage/arrêt de runners, consultation d'état, logs."
    permissions:
      - "runner:start"
      - "runner:stop"
      - "runner:status"
      - "logs:read"
  - name: viewer
    description: "Consultation seule : état des runners, métriques, santé."
    permissions:
      - "runner:status"
      - "metrics:read"
      - "health:read"
functional_roles:
  - name: orchestrator
    description: Orchestration centrale du cycle de vie des runners.
    runners:
      - kix
      - kix-ecosystem
      - agent-manager
  - name: bootstrap orchestrator
    description: Orchestration du bootstrap initial (gateway-manager, dépendances).
    runners:
      - bootstrap
  - name: metrics collector
    description: Collecte et exposition des métriques RLM.
    runners:
      - rlm-metrics
  - name: configuration service
    description: Service de configuration centralisée.
    runners:
      - rlm-config
  - name: deployment service
    description: Service de déploiement et release.
    runners:
      - rlm-deploy
  - name: graph service
    description: Service de graphe et knowledge graph.
    runners:
      - rlm-graph
  - name: security service
    description: Service de sécurité et authentification.
    runners:
      - rlm-secure
  - name: incident service
    description: Service de gestion d'incidents.
    runners:
      - rlm-incident
  - name: release service
    description: Service de gestion des releases.
    runners:
      - rlm-release
  - name: knowledge-graph service
    description: Service KG-L standalone.
    runners:
      - kg-l
  - name: decision-engine
    description: Moteur de décision JEVX.
    runners:
      - jevx
  - name: event-bus
    description: Bus d'événements WAZAA.
    runners:
      - wazaa-bus
  - name: zig-runtime
    description: Runtime Zig (TRIX dispatch).
    runners:
      - trixd
  - name: governance
    description: Runners de gouvernance (gitex, repoxt, syncx, referex, kglx, harnex, nexus).
    runners:
      - gitex
      - repoxt
      - syncx
      - referex
      - kglx
      - harnex
      - nexus
  - name: cognitive
    description: Runners cognitifs (TALEX, LLUX, TIMX, conversation, anamorphoser, etc.).
    runners:
      - talex
      - telox
      - timx
      - causex
      - morphex
      - identx
      - topex
      - chronox
      - llux-match
      - llux-index
      - prognex
      - llux-learn
      - llux-replay
      - deployex
      - flowx
      - conversation-cognitive
      - anamorphoser
      - tlm-lang
      - friction-analyzer
      - nodex
      - rootx
  - name: operational
    description: Runners opérationnels (RLM-243, TIMX-FS, MDU, piano, trix, kg-l-coherence-watchdog).
    runners:
      - rlm243
      - timx-feature-store
      - rlm-mdu
      - piano
      - trix
      - kg-l-coherence-watchdog
  - name: infrastructure
    description: Runners d'infrastructure (FLEX, codedb-e5620, llm-gateway, flex-rust, go-service, node-service).
    runners:
      - flex
      - codedb-e5620
      - llm-gateway
      - flex-rust
      - go-service
      - node-service
  - name: llm
    description: Runners LLM core.
    runners:
      - llm-core
  - name: dashboard
    description: Tableaux de bord WAZAA.
    runners:
      - wazaa
  - name: api
    description: APIs exposées (flex-api, batmcp).
    runners:
      - flex-api
      - batmcp
  - name: citizen
    description: Runners citoyens.
    runners:
      - infx
capability_model:
  - name: runner-lifecycle
    description: Orchestrer le cycle de vie complet des runners RLM cognitifs
    parameters:
      phases:
        - discover
        - boot
        - run
        - verify
        - shutdown
      validation_backend: RLM-243
    required_capabilities:
      - "runner:start"
      - "runner:stop"
      - "runner:restart"
  - name: tlm-runner
    description: Execution de scripts TLM-LANG via the TLM runner
    parameters:
      port: 8801
      validation_port: 8793
    required_capabilities:
      - "runner:start"
      - "tlm:execute"
  - name: parallel-runner-manager
    description: Manage multiple runner instances with semaphore-based concurrency
    parameters:
      max_concurrency: 6
      memory_guard: true
    required_capabilities:
      - "runner:start"
      - "runner:stop"
      - "concurrency:manage"
  - name: metrics-lifecycle
    description: Orchestrer le cycle de vie du service RLM-METRICS (baseline, collecte, rapport)
    parameters:
      service: RLM-METRICS
      port: 8802
      endpoints:
        - /health
        - /collect
      validation_backend: RLM-243
    required_capabilities:
      - "metrics:read"
      - "runner:start"
  - name: process-manager
    description: Gestion de tous les processus (exe, py, js, zig, services Windows)
    parameters:
      track_pids: true
      restart_policy: auto
      max_concurrency: 6
      memory_guard: true
    required_capabilities:
      - "process:track"
      - "process:restart"
  - name: pid-tracker
    description: Suivi PID, fingerprint, health check
    parameters:
      preflight_singleton: true
      fingerprint_build: true
    required_capabilities:
      - "pid:track"
      - "health:check"
  - name: exe-launcher
    description: Lancement d'exécutables système et utilisateur
    parameters:
      allowed_paths:
        - C:\DevTools
        - D:\DO\WEB\TOOLS\L4-TOOLS
        - D:\DO\WEB\TOOLS\L1-INFRA
        - C:\Program Files
        - C:\Users\GG\AppData\Local\Programs\Python
    required_capabilities:
      - "exe:launch"
dual_role_pattern:
  description: Services qui appartiennent à la fois aux familles RLM et TLM (TRIX, PLIX).
  runners:
    - name: trixd
      port: 7243
      families:
        - RLM
        - TLM
      role: zig-runtime
    - name: trix
      port: 0
      families:
        - RLM
        - TLM
      role: operational
    - name: plix
      port: 8788
      families:
        - RLM
        - TLM
      role: knowledge-graph service
actor_model:
  description: Modèle ActorSpec pour intégration base_orchestrator.
  source: base_orchestrator.ActorSpec
  fields:
    - name: id
      type: str
      description: Identifiant unique de l'acteur (runner name).
    - name: command
      type: str
      description: Commande de lancement.
    - name: working_dir
      type: str
      description: Répertoire de travail.
    - name: auto_restart
      type: bool
      description: Redémarrage automatique.
    - name: restart_delay
      type: int
      description: Délai de redémarrage en secondes.
    - name: deployment
      type: dict
      description: Métadonnées de déploiement (meta.role, repo, etc.).
  adapter: KIXProcessManagerAdapter
  mapping:
    actor_id: name
    role: role
    started_at: started_at
    last_seen: last_seen
consumers:
  - RLM-243
  - LLUX
  - TLM
  - TIMX
  - TALEX
  - RADX
  - RLM-METRICS
  - DevTools
  - ECOS-CLI
  - KIVA-CLI
  - CTULU
  - WAZAA
  - BRAIN
capabilities:
  - name: runner-lifecycle
    description: Orchestrer le cycle de vie complet des runners RLM cognitifs
    parameters:
      phases:
        - discover
        - boot
        - run
        - verify
        - shutdown
      validation_backend: RLM-243
  - name: tlm-runner
    description: Execution de scripts TLM-LANG via the TLM runner
    parameters:
      port: 8801
      validation_port: 8793
  - name: parallel-runner-manager
    description: Manage multiple runner instances with semaphore-based concurrency
    parameters:
      max_concurrency: 6
      memory_guard: true
  - name: metrics-lifecycle
    description: Orchestrer le cycle de vie du service RLM-METRICS (baseline, collecte, rapport)
    parameters:
      service: RLM-METRICS
      port: 8802
      endpoints:
        - /health
        - /collect
      validation_backend: RLM-243
  - name: process-manager
    description: Gestion de tous les processus (exe, py, js, zig, services Windows)
    parameters:
      track_pids: true
      restart_policy: auto
      max_concurrency: 6
      memory_guard: true
  - name: pid-tracker
    description: Suivi PID, fingerprint, health check
    parameters:
      preflight_singleton: true
      fingerprint_build: true
  - name: exe-launcher
    description: Lancement d'exécutables système et utilisateur
    parameters:
      allowed_paths:
        - C:\DevTools
        - D:\DO\WEB\TOOLS\L4-TOOLS
        - D:\DO\WEB\TOOLS\L1-INFRA
        - C:\Program Files
        - C:\Users\GG\AppData\Local\Programs\Python
components:
  - type: orchestrator
    repo: gerivdb/KIX
    path: KIX/
  - type: runner-dispatcher
    repo: gerivdb/KIX
    path: KIX/src/
  - type: validation
    repo: gerivdb/RLM-243
    protocol: http
    port: 8793
  - type: metrics-service
    repo: gerivdb/RLM-METRICS
    protocol: http
    port: 8802
  - type: process-supervisor
    repo: gerivdb/KIX
    path: KIX/src/
  - type: pid-registry
    repo: gerivdb/KIX
    path: KIX/src/
bridges:
  - target: repo:RLM-243
    role: consumer
    protocol: http
    port: 8793
  - target: repo:LLUX
    role: consumer
    protocol: wazaa-channel
  - target: repo:TLM-LANG
    role: consumer
    protocol: cli
  - target: repo:TALEX
    role: consumer
    protocol: wazaa-bus
  - target: repo:RLM-METRICS
    role: consumer
    protocol: http
    port: 8802
  - target: repo:DevTools
    role: system
    protocol: local
    path: C:\DevTools
  - target: repo:ECOS-CLI
    role: system
    protocol: cli
    path: D:\DO\WEB\TOOLS\L1-INFRA\ECOS-CLI
  - target: repo:KIVA-CLI
    role: system
    protocol: cli
    path: D:\DO\WEB\TOOLS\L1-INFRA\KIVA-CLI
dependencies:
  - repo: gerivdb/RLM-243
  - repo: gerivdb/LLUX
  - repo: gerivdb/TLM-LANG
  - repo: gerivdb/TIMX-FEATURE-STORE
  - repo: gerivdb/TALEX
  - repo: gerivdb/RADX
  - repo: gerivdb/RLM-METRICS
  - repo: gerivdb/DevTools
  - repo: gerivdb/ECOS-CLI
  - repo: gerivdb/KIVA-CLI
constraints:
  - cpu_only: true
  - ram_limit_mb: 24576
  - system_services: allowed
  - max_processes: 64
