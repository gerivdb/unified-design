## Contexte

VEX expose un serveur HTTP optionnel pour permettre des health checks agrégés L3 accessibles depuis d'autres services de l'écosystème (KIX, CTULU, etc.).

## Problème

Besoin d'un endpoint standardisé pour interroger la santé de tous les daemons L3 gérés par VEX, sans avoir à utiliser la CLI.

## Solution

Serveur HTTP minimaliste basé sur `http.server` standard library, exposant `GET /health` qui retourne le health check agrégé de tous les citizens/daemons.

## Architecture

```
VEX HTTP Server (port 8060 par défaut)
├── GET /health → health check agrégé L3
│   └── Retourne JSON : { citizen: { daemon_id: { status, pid, key } } }
└── GET /unknown → 404
```

## Critères d'acceptation

- [x] Serveur HTTP démarre sans erreur
- [x] `GET /health` retourne 200 avec JSON valide
- [x] `GET /unknown` retourne 404
- [x] Serveur s'arrête proprement
- [x] Tests passent

