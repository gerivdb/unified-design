  \ \xE0 valeur -penser une probl\xE9matique.md. Transforme les inputs (probl\xE8\
  mes, id\xE9es, intentions) en outputs (designs, atoms, code, tests) via un pipeline\
  \ de valeur ajout\xE9e. Chaque \xE9tape du pipeline ajoute de la valeur mesurable."
