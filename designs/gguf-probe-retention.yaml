name: gguf-probe-retention
description: Gestion des artefacts GGUF et binaires lourds - probes metadata sans chargement des tenseurs, manifestes reproducibles, validation e2e aller-retour, politique de retention gitignore au-dela du seuil.
version: 1.0.0
status: active
layer: L4
intent_hash: 0xDESIGN_GGUF_PROBE_RETENTION_20260823
inherits:
- fractal-engineering-strata
depends_on:
- ATOM-053-workspace-draft-convention
bridges:
- target: PIANO
  role: implementation_host
  protocol: markdown-link
  path: PRD/PRD-GGUF-PROBES-RETENTION-2026-08-23.md
- target: PLIX
  role: transport_consumer

capabilities:
- name: probe_gguf
  description: lecture header + KV + N premiers tenseurs metadata, sans charger les data tensors
  implementation: PIANO/scripts/probe_real_gguf.py
- name: manifest_generation
  description: manifeste reproducible read-only sha256 chunked, tables/tensores inventories
  implementation: pattern kilo_snapshot_manifest.py transpose aux modeles
- name: e2e_validation
  description: test aller-retour compress_gguf_to_kbin / decompress_kbin_to_gguf
  implementation: PIANO/scripts/real_e2e.py
- name: retention_policy
  parameters:
    gitignore_threshold_mb: 100
    rules:
      - "models/*.gguf -> gitignore (cas vecu 1.1 GB)"
      - "scripts/probe_*.py -> conserves dans le repo"
      - "scripts/*e2e*.py -> conserves dans le repo"
      - "scripts/*snapshot*.py -> evaluer ; outil gouvernance -> GOVERNANCE-HUB"

constraints:
  aucun_binaire_lourd_en_git: true
  stockage_modeles_hors_git: true
