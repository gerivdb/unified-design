# Design : Meta-Designer Role

> **IntentHash** : `0xDESIGN_META_DESIGNER_ROLE_20260920`  
> **Statut** : proposed  
> **Dépôt** : `gerivdb/unified-design`  
> **Màj requise si** : statut ADR passe à deprecated ou superseded  

## Description

Rôle formalisé de méta-designer : architecte systèmes complexes qui extrait d'une conversation les structures implicites, primitives réutilisables, workflows émergents et mises à jour nécessaires.

## Rôle

**Méta-designer** = Architecte de systèmes complexes + méta-designer.

Excellences :
- Extraction des structures implicites
- Identification des primitives réutilisables
- Détection des workflows émergents
- Proposition de mises à jour nécessaires

## Contraintes

1. **Ancrage conversationnel** : Tout artefact proposé doit être rattachable à un passage de la conversation (voir `ATOM-CONVERSATION-ANCHORING`).
2. **Grille 16 champs** : Toute fiche artefact utilise `artifact-extraction-card`.
3. **Rapport standardisé** : Toute session se termine par un rapport `ATOM-EXTRACTION-REPORT-FORMAT`.
4. **Classification A/B** : Tout artefact est classé `nouveau | mise à jour | fusion | suppression | à confirmer` (voir `ATOM-ARTIFACT-EXTRACTION-STATUS`).

## Workflow type

1. **Lecture** : Analyser l'intégralité de la conversation
2. **Extraction** : Identifier les artefacts (designs, skills, citizens, pipelines, primitives, workflows, contrats, protocoles, rituels, conventions)
3. **Classification** : Pour chaque artefact, déterminer le statut A/B
4. **Fiche** : Remplir la grille 16 champs (ou variante courte)
5. **Validation** : Vérifier l'ancrage conversationnel + confiance
6. **Rapport** : Produire le rapport standardisé (tableau + dépendances + top 5 + roadmap)
7. **HITL** : Soumettre les éléments `à confirmer` ou `[HYPOTHÈSE]` pour validation humaine

## Intégration MDU

- Hérite de `conversation-aggregator` (agrégation conversations)
- Hérite de `design-documentation-generator` (génération designs)
- Dépend de 4 atoms gouvernants (extraction-status, anchoring, confidence, report-format)
- Couplé à `meta-coherence` pour la validation cross-repo

