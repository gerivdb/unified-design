name: process-zombie-proliferation
parent_pattern: zombie-symptom
intent_hash: 0xPROCESS_ZOMBIE_PROLIFERATION_20260809
repos_target:
  - GeriCode/L2
  - KIX/L2
  - TRIX/L4
  - KIVA-CLI/L1
status: proposed

symptom: |
  After KiloCode sessions / worktrees / KIVA-CLI runs, system processes proliferate:
  - git.exe : orphan worktrees, interrupted git gc, git hooks
  - node.exe : KiloCode/VS Code extension scanning .kilo/worktrees
  - python.exe : KIX/TRIX/diagnostics scripts
  - zig.exe : TRIX compilation
  - cargo.exe : Rust builds
  - bun.exe : JS scripts
  - pwsh.exe : PowerShell scripts waiting

indicators:
  - name: git_zombie_count
    type: process
    detector: KIX:/health/zombies
    threshold: 0
    severity: warning
  - name: node_zombie_count
    type: process
    detector: KIX:/health/zombies
    threshold: 0
    severity: warning
  - name: worktree_lock_count
    type: handle
    detector: powershell_script
    threshold: 0
    severity: critical

impact:
  - Blocking .kilo/worktrees/* removal
  - RAM/CPU leak
  - Cross-repo conflicts undetected
  - phi-CPS metrics falsified

implementation_mapping:
  - component: KIX
    path: src/zombie_monitor.py
    role: /health/zombies, /health/zombies/purge
  - component: GeriCode
    path: scripts/verify-agent-manager-env.ps1
    role: check_process_zombies()
  - component: GeriCode
    path: .kilo/skills/process-hygiene/SKILL.md
    role: skill
  - component: TRIX
    path: tools/trix_preflight.zig
    role: extended preflight
  - component: KIVA-CLI
    path: docs/KIVACLI-GIT-ZOMBIE-HOOKS.md
    role: hooks documentation
  - component: Governance
    path: ONTOLOGY/ONTOLOGY.yaml
    role: process_zombie_proliferation concept
