name: context-engineering
description: "Ing\xE9nierie de contexte inspir\xE9e de GG-knox/engineering-ideas/300-kimi-k3/16.md.\
  \ Conception et maintenance du contexte d'ex\xE9cution des agents : fen\xEAtres\
  \ glissantes, fra\xEEcheur, embedding, compression, s\xE9lection pertinente. Garantit\
  \ que chaque agent dispose du contexte optimal pour sa t\xE2che."
version: 1.0.0
status: active
layer: L0
intent_hash: 0xDESIGN_CONTEXT_ENGINEERING_20260917
inherits:
- ecosystem-feedback-loop
depends_on:
- ecosystem-feedback-loop
bridges:
- target: repo:BRAIN
  role: cognitive-layer
  protocol: wazaa-channel
  channel: L4-TOOLS/BRAIN/context-engineering/cognitive
- target: repo:KG-L
  role: causal-engine
  protocol: wazaa-channel
  channel: L4-TOOLS/KG-L/context-engineering/causal
- target: repo:VOLTX
  role: narrative-vault
  protocol: wazaa-channel
  channel: L0-CANON/VOLTX/context-engineering/narrative
capabilities:
- name: context-window-management
  description: "Gestion des fen\xEAtres de contexte : sliding window, compression,\
    \ s\xE9lection"
  parameters:
    window_size: 8192
    compression_ratio: 0.7
    selection_strategy: relevance_scores
- name: freshness-management
  description: "Gestion de la fra\xEEcheur du contexte : TTL, invalidation, refresh"
  parameters:
    ttl_seconds: 3600
    freshness_check_interval: 60
    auto_refresh: true
- name: embedding-strategy
  description: "Strat\xE9gie d'embedding pour la s\xE9lection de contexte"
  parameters:
    model: text-embedding-3-small
    dimension: 1536
    similarity_metric: cosine
    top_k: 10
- name: context-selection
  description: "S\xE9lection du contexte pertinent pour une t\xE2che donn\xE9e"
  parameters:
    algorithm: MMR (Maximal Marginal Relevance)
    diversity_weight: 0.3
    max_tokens: 4096
principles:
- P0_FRESHNESS: "le contexte doit \xEAtre frais (TTL, invalidation, refresh)"
- P0_RELEVANCE: "le contexte s\xE9lectionn\xE9 est le plus pertinent pour la t\xE2\
    che"
- P0_DIVERSITY: "le contexte est diversifi\xE9 pour \xE9viter la myopie"
- P0_COMPRESSION: "le contexte est compress\xE9 sans perte d'information critique"
adr: ADR-015-unified-design-v2
