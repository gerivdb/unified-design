name: seven-turns-reflection
description: "M\xE9ta-design super-amont : \"tourne ta langue 7 fois dans ta bouche\
  \ avant de parler\". Formalise la r\xE9flexion pr\xE9alable comme PHASE OBLIGATOIRE\
  \ de tout acte de design, nommage ou introduction de concept. N\xE9 de l'\xE9pisode\
  \ CJ-008/bus-yaml : deux concepts distincts ont partag\xE9 le m\xEAme mot parce\
  \ que personne n'avait consult\xE9 ONTOLOGY avant de nommer. Chaque \"tour\" est\
  \ une question bloquante pos\xE9e AVANT l'acte, pas apr\xE8s."
version: 1.0.0
status: active
inherits:
- incremental-growth
- capability-awareness
parameters:
  turns: 7
  enforcement: blocking
  gate_implementation: gerivdb/KG-L@kilocode/semantics/naming_gate.py
  consult_targets:
  - ONTOLOGY.yaml#concepts
  - known_repositories.yaml
  - "canaux WAZAA d\xE9clar\xE9s (MEMORY_CHANNELS + wazaa-channels.yaml par repo)"
  - modules/fichiers existants du repo porteur
constraints:
- "Tour 1 EXISTENCE : le nom existe-t-il d\xE9j\xE0 (ontologie, registres, disque)\
  \ ? Consultation OBLIGATOIRE avant cr\xE9ation."
- "Tour 2 COLLISION : est-il \xE0 distance lexicale dangereuse dun terme vivant (ex.\
  \ bus.yaml vs BusCore) ?"
- "Tour 3 REGISTRE : dans quel registre s\xE9mantique vit-il (technique/ethique/systemique)\
  \ \u2014 d\xE9clar\xE9, pas sous-entendu."
- "Tour 4 AMBIGUIT\xC9 FUTURE : pourra-t-il \xEAtre confondu demain avec un concept\
  \ voisin non encore n\xE9 ?"
- "Tour 5 ALTERNATIVES : quelles options consid\xE9r\xE9es, pourquoi rejet\xE9es \u2014\
  \ consign\xE9, pas oubli\xE9."
- "Tour 6 R\xC9VERSIBILIT\xC9 : si je me trompe, combien co\xFBte le retour arri\xE8\
  re ?"
- "Tour 7 SILENCE : ai-je vraiment besoin de nommer MAINTENANT ? Ne pas nommer est\
  \ une r\xE9ponse valide."
