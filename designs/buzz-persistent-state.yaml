version: 1.0.0
intent_hash: 0xbps_20260801
status: active
description: "Buzz@block comme infrastructure de persistance pour l'\xE9tat syst\xE8\
  me.\nTout \xE9v\xE9nement est sign\xE9, loggu\xE9, et devient une ancre de v\xE9\
  rit\xE9.\n"
architecture: "+---------------------------------------------------------------------+\n\
  |                    BUZZ@BLOCK (Upstream)                           |\n|  +-------------------------------------------------------------+\
  \   |\n|  |  buzZ-relay  |  buzz-acp  |  buzz-workflow  |  buzz-audit  |   |\n|\
  \  |  (Nostr)     |  (ACP)     |  (YAML)         |  (hash-chain)|   |\n|  +-------------------------------------------------------------+\
  \   |\n+---------------------------------------------------------------------+\n\
  \                                  |\n       +--------------------------+--------------------------+\n\
  \       v                          v                          v\n+-----------------+\
  \    +---------------------+    +---------------------+\n|   BUZZ-X (L4)   |   \
  \ |    N243 (L4)        |    |   WAZAA Bridge      |\n|  Overlay Nostr  |    | \
  \ Meta-orchestrateur |    |  (pont Python)      |\n|  sur Buzz@block |    |  ternaire\
  \ Rust      |    |  -> consomme BUZZ-X  |\n+-----------------+    +---------------------+\
  \    +---------------------+\n"
storage_layers:
- layer: events
  component: buzz-relay
  format: "Nostr \xE9v\xE9nement sign\xE9"
  persistence: Postgres + Redis
- layer: workflows
  component: buzz-workflow
  format: YAML
  persistence: Postgres
- layer: audit
  component: buzz-audit
  format: hash-chain log
  persistence: Postgres + WAL
- layer: ternary_wal
  component: N243 / wal.rs
  format: Ternary WAL (Convergence/Divergence/Oscillation)
  persistence: local file + buzz-audit
rules:
- id: BPS-001
  name: Single Source of Truth
  description: "Le relais Buzz est l'unique source de v\xE9rit\xE9 pour les \xE9v\xE9\
    nements"
  enforcement: design
- id: BPS-002
  name: "\xC9v\xE9nement Sign\xE9"
  description: "Tout \xE9v\xE9nement est sign\xE9 par une cl\xE9 Schnorr (humain ou\
    \ agent)"
  enforcement: auto
- id: BPS-003
  name: "Persistance imm\xE9diate"
  description: "Toute information captur\xE9e est persist\xE9e dans le relais avant\
    \ traitement"
  enforcement: auto
  pattern: First-Right Capture
- id: BPS-004
  name: WAL ternaire
  description: "Les transitions d'\xE9tat sont logg\xE9es dans un WAL ternaire"
  enforcement: auto
  states:
  - Convergence
  - Divergence
  - Oscillation
name: buzz-persistent-state
layer: L1
adr: ADR-015-unified-design-v2
