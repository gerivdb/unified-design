## Matrice de responsabilité

| Artefact | Créé dans | Stocké dans | Consommé depuis |
|----------|-----------|-------------|-----------------|
| Skill | Workspace | SKILLS/native/<domain>/<skill>/ | Tous repos |
| Design | Workspace | unified-design/designs/ | Tous repos |
| Citizen | Workspace | GOVERNANCE-HUB/act-protocol/citizens.yaml | Tous repos |
| Bridge | Workspace | TOPOS/BRIDGES.yaml | Tous repos |
| Config KiloCode | Local | <repo>/.kilo/ | Local uniquement |
