# pr-review-resolver - Design Document

## Overview
The `pr-review-resolver` skill is a universal cross-repo skill that orchestrates PR review, CI validation, conflict resolution, and cleanup across all repositories in the gerivdb ecosystem.

## Architecture

### Pipeline Flow
```
User Command: "review resoud PR"
  -> Pattern Router (pattern-router.md)
  -> pr-review-resolver skill
  -> Sub-skills:
     1. diffscope-review (inline comments)
     2. pr-lifecycle-gate (CI checks + merge)
     3. merge-conflict-resolver (if blocked)
     4. session-closeout (D5 cleanup)
```

### Guards Applied
1. `agent-budget-check` - RAM/CPU verification before delegation
2. `adr-governance-gate` - Blocks cross-repo merges without ADR
3. `checkout-canonicality` - Validates clone path (CTULU/ECOYSTEM)

### Scope
- **Provider**: SKILLS (L4-TOOLS)
- **Consumers**: Kilo Agent, CTULU
- **Execution**: All repos in `D:\DO\WEB`

