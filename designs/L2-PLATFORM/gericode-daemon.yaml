# DESIGN — GeriCode Daemon Registry

## Contexte

L'incident du 2026-09-25 a révélé 11 processus `auto-dispatcher.ps1` orphelins dans `GeriCode/.kilo/orchestrator/`, consommant ~1,1 Go RAM sans aucune mission à traiter. La cause racine est l'absence de mécanismes de singleton OS, de PID file, et d'arrêt propre dans les daemons PowerShell long-running.

Ce design couvre le **triplet daemon PowerShell** manquant dans unified-design :
- `auto-dispatcher.ps1` (daemon principal)
- `dispatcherctl.ps1` (contrôleur)
- `daemon-registry.ps1` (registry centralisé)
- `daemon-health-monitor.ps1` (wrapper compatible)

## Architecture cible

```
GeriCode/.kilo/orchestrator/
├── auto-dispatcher.ps1          # Daemon singletonisé
├── dispatcherctl.ps1            # Contrôleur start/stop/status/restart
├── daemon-registry.ps1          # Registry centralisé
├── daemon-health-monitor.ps1    # Wrapper compatible
├── .lock/
│   └── instance.pid             # PID file du dispatcher
└── daemon-health.json           # État agrégé
```

## Mécanismes

| Mécanisme | Objectif |
|-----------|----------|
| **Mutex `Global\GeriCode-AutoDispatcher-V1`** | Garantit un seul instance OS |
| **PID file `.lock/instance.pid`** | Monitoring externe + détection orphelins |
| **EventWaitHandle `Global\GeriCode-AutoDispatcher-Stop`** | Arrêt propre inter-processus |
| **daemon-health.json** | Heartbeat consommé par `daemon-health-monitor.ps1` |
| **WaitOne(timeout)** | Boucle interruptible, 0 CPU en idle |

## Intégration Swarm-Lease

| Composant | Rôle |
|-----------|------|
| **GeriCode** (`L2-PLATFORM`) | Hôte du daemon `auto-dispatcher.ps1` + contrôleur `dispatcherctl.ps1` |
| **GOVERNANCE-HUB** (`L0-CANON`) | PRD-MOC GEN-041 backing + règles `daemon-health-monitor.ps1` |
| **KIX** (`L2-PLATFORM`) | `ProcessManager` P0 — endpoint `/process/*` pour PID registry |
| **LOOPX** (`L3-CITIZENS`) | `WindowVisibilityManager` + `AdminTaskCoordinator` (P1/P2) |
| **Swarm-Lease** (GEN-013) | Bail sur `.lock/` directory avant start/stop |

## Proof-of-Life

- [x] `2026-09-25T07:04:34+02:00` — 11 processus `auto-dispatcher.ps1` tués ; RAM libérée ~1,1 Go
- [x] `2026-09-25T07:04:34+02:00` — `auto-dispatcher.ps1` singletonisé : mutex + PID file + stop event + WaitOne(timeout)
- [x] `2026-09-25T07:04:34+02:00` — `dispatcherctl.ps1` créé : start/stop/status/restart fonctionnels
- [x] `2026-09-25T07:04:34+02:00` — `daemon-registry.ps1` validé en mode read/prune
- [x] `2026-09-25T07:04:34+02:00` — 9/9 tests passants (`verification/test-daemon-registry.ps1`)

