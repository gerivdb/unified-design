1. Créer `src/vex/primitives/` avec `base_client.py`, `response.py`, `registry.py`, `retry.py`
2. Refactorer 1 client exemple (`wazaa_bus_client.py`) pour valider le pattern
3. Générer les 18 autres clients via `vex-client-generator` skill
