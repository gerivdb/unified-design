---
name: deepmind-co-scientist-reliability
description: "Protocole de fiabilité des agents inspiré de DeepMind Co-Scientist (arXiv:2608.26701). Vérification déterministe par capture des logs d'exécution (Deterministic Execution-Log Clipping), réduction des résultats fabriqués de 90% à 4%, élimination fabrication complète 0.0%, refus 98.7% des directions dangereuses. Capteurs déterministes obligatoires, évaluateurs LLM interdits en isolation."
version: "1.0.0"
status: active
layer: L1
intent_hash: 0xDESIGN_DEEPMIND_CO_SCIENTIST_RELIABILITY_20260918
inherits:
  - agent-observability-architecture
  - deterministic-execution-log-clipping
  - consciousness
depends_on:
  - agent-observability-architecture
  - deterministic-execution-log-clipping
  - consciousness
  - meta-coherence
capabilities:
  - name: deterministic-execution-log-clipping
    description: "Comparer l'affirmation de l'agent contre les logs d'exécution bruts et la télémétrie enregistrée dans la trace DAG"
    parameters:
      source: execution_log_dag
      action_on_mismatch: [reject, rewrite]
      fabrication_rate_target: 4%
      complete_fabrication_target: 0.0%
  - name: deterministic-span-sensor
    description: "Capteur de trace déterministe : interroger le DAG pour un span execute_tool:<tool>"
    parameters:
      example: pytest_span
      false_positive_risk: zero
      llm_judge_alone: forbidden
  - name: cross-family-evaluator
    description: "Évaluateur de familles croisées : éviter les biais de préférence en utilisant des évaluateurs de familles différentes"
    parameters:
      pattern: claude-verifies-gemini
      deterministic_sensor: required
  - name: anomaly-circuit-breaker
    description: "Coupe-circuit automatique : MAD du nombre d'étapes > 3.5 ou variance entropie tokens < 0.02 sur 4 spans consécutifs"
    parameters:
      mad_threshold: 3.5
      entropy_variance_threshold: 0.02
      consecutive_spans: 4
  - name: dangerous-direction-refusal
    description: "Refuser les directions de recherche jugées dangereuses"
    parameters:
      refusal_rate_target: 98.7%
      criteria: safety_policy_violation
principles:
  - P0_DETERMINISTIC_VERIFICATION: la trace elle-même sert de capteur de vérification actif, pas un évaluateur LLM
  - P0_NO_LLM_JUDGE_ALONE: un juge LLM seul est vulnérable au piratage de récompense ; toujours coupler à un capteur déterministe
  - P0_EXECUTION_LOG_CLIPPING: toute affirmation non ancrée dans un span d'exécution concret est rejetée ou réécrite
  - P0_FABRICATION_RATE_ZERO: la fabrication complète de données doit être éliminée (0.0%)
  - P0_SAFETY_REFUSAL: les directions dangereuses sont refusées automatiquement, pas soumises à débat LLM
