name: agent-observability-architecture
description: "Architecture d'observabilit\xE9 pour agents autonomes : UModel (graphe\
  \ s\xE9mantique orient\xE9-objet, U-SPL), Trace Engineering (DAG causal, rejouabilit\xE9\
  \ d\xE9terministe, Event Sourcing), taxonomie Log/Trajectoire/Trace, pipeline de\
  \ distillation multi-niveaux, d\xE9tection d'anomalies MAD/entropie, triple magasin\
  \ de donn\xE9es."
version: 1.0.0
status: active
layer: L1
intent_hash: 0xDESIGN_AGENT_OBSERVABILITY_20260918
inherits:
- meta-coherence
- consciousness
depends_on:
- meta-coherence
- consciousness
- kg-causal
capabilities:
- name: umodel-semantic-graph
  description: "Graphe s\xE9mantique orient\xE9-objet pour standardiser microservices,\
    \ signaux et playbooks"
  parameters:
    pillars:
    - semantically-rich
    - contextualized
    - actionable
    - structured-standardized
    query_interface: U-SPL
- name: trace-engineering
  description: "Trace Engineering : DAG causal, rejouabilit\xE9 d\xE9terministe, Event\
    \ Sourcing"
  parameters:
    replay:
    - mocked-replay
    - live-state-resumption
    causal_localization: true
    deterministic_verification: true
- name: taxonomy-log-trajectory-trace
  description: "Taxonomie : Log (texte brut), Trajectoire (s\xE9quence \xC9tat-Action-Observation),\
    \ Trace (DAG causal)"
  parameters:
    replay_fidelity:
    - extremely-low
    - medium
    - complete
    causal_traceability:
    - none
    - linear
    - explicit
- name: distillation-pipeline
  description: "Pipeline de distillation multi-niveaux : \xE9lision AST/stdout, d\xE9\
    duplication s\xE9mantique, \xE9lagage graphe causal"
  parameters:
    compression:
    - 60-85%
    - 30-50%
    - 70-90%
    output: reasoning-bank
- name: anomaly-detection
  description: "D\xE9tection d'anomalies : MAD du nombre d'\xE9tapes, variance de\
    \ l'entropie des tokens"
  parameters:
    mad_threshold: 3.5
    entropy_variance_threshold: 0.02
    consecutive_spans: 4
- name: triple-datastore
  description: "Triple magasin de donn\xE9es : s\xE9ries temporelles (Prometheus/M3),\
    \ OLAP columnar (ClickHouse), graphe/vecteurs (RAG)"
  parameters:
    timeseries: Prometheus/M3
    olap: ClickHouse
    graph_vector: RAG
principles:
- P0_AGENT_READY: "les donn\xE9es doivent \xEAtre s\xE9mantiquement riches, contextualis\xE9\
    es, actionnables, structur\xE9es"
- P0_TRACE_CAUSAL: la trace est un DAG causal, pas un arbre ni un log plat
- P0_DETERMINISTIC_REPLAY: "toute ex\xE9cution doit \xEAtre rejouable d\xE9terministiquement\
    \ depuis un ledger append-only"
- P0_DISTILLATION: ne jamais injecter de traces brutes dans le contexte LLM ; toujours
    distiller
- P0_ANTI_HALLUCINATION: "v\xE9rification par capteurs d\xE9terministes sur les spans,\
    \ pas par \xE9valuateur LLM seul"
- P0_PERFORMANCE: "\xE9mission de spans asynchrone, d\xE9couplage registre de rejeu\
    \ / magasin d'analyse"
- P0_OBSERVABILITY_IS_FUNDAMENTAL: "l'observabilit\xE9 n'est pas un afterthought,\
    \ c'est une infrastructure active"
adr: ADR-015-unified-design-v2
