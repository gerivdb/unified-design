name: thought-commit-pipeline
description: Design de continuite pensee -> commit. Chaine canonique vibe -> INTENT -> PRD-MOC -> PRD subalternes -> ADR/EPIC -> issues -> execution -> boucle retour imprévus -> cloture. Gates G0-G3, huit cas de cascade, traceabilite intent_hash descendante, propagation statuts ascendante.
version: 1.0.0
status: active
layer: L0
intent_hash: 0xDESIGN_THOUGHT_COMMIT_PIPELINE_20260823
inherits:
- moc-governance
- prd-moc-progress-sync
- fractal-recursion
depends_on:
- unforeseen-lifecycle
- ATOM-053-workspace-draft-convention
bridges:
- target: GOVERNANCE-HUB
  role: moc_adr_epics_host
  protocol: markdown-link
- target: REPO-STANDARDS
  role: template_and_standard
  protocol: markdown-link
  path: templates/PRD-MOC-from-INTENT.template.md

canonical_chain:
  - step: VIBE
    input: conversation, intuition, incident, serendipite
  - gate: G0
    checks: [friction-sensor, pertinence, GATE-1 SOT pas de doublon]
  - step: INTENT
    artifact: resume + perimetre + intent_hash
  - gate: G1
    check: impact architectural transverse ? oui -> ADR oblige AVANT suite (adr-governance-gate)
  - step: PRD-MOC
    location: GOVERNANCE-HUB/PRD-MOC/<axe>/
  - gate: G2
    check: validation MOC satisfaisante (revue HITL + MOX P-106/P-107)
  - step: PRD_SUBALTERNES
    location: "<repo-cible>/PRD/"
    rule: un par repo implique, hash racine propage
  - gate: G3
    check: collision-check par repo (pas de doublon avec PRD existant)
  - steps_optional: [ADR, EPIC]
    decomposition: taches atomiques Patterns A-E (regle SLM)
  - step: EXECUTION
    constraint: commits atomiques <= 3 fichiers
  - gate: G4
    name: MDU Compliance Gate
    description: "Valide conformité MDU (design, atom, citizen, ADR index, checkpoint) avant commit merge"
    depends_on: [G3]
    checks:
      - mdu-design-coverage: "python unified-design/scripts/design_coverage_scanner.py --strict --source discovery"
      - mdu-compliance-scan: "python citizens/mdu-compliance-scanner/mdu_compliance_scanner.py --repo $(git remote get-url origin | sed 's/.*\///' | sed 's/.git$//') --strict"
    on_fail: BLOCK_COMMIT
    timeout_sec: 30
  - feedback_loop:
    r_sup_2: unforeseen-lifecycle conversion obligatoire
    r_egal_1: IMPENSES/
  - step: CLOTURE
    rule: progress-sync remonte statuts ; index regenere ; done conditionnel aux subalternes

cascade_cases:
  mono_repo: 1 subalterne dans le repo cible ; MOC garde le plan
  bi_repo: 2 subalternes + section Coordination dans le MOC
  n_repo_transverse: N subalternes + matrice dependances + ordre cascade + owner unique
  architectural_impact: ADR obligatoire AVANT les subalternes
  no_clear_target: IMPENSES/ ou GOVERNANCE-HUB/PRD/general/
  existing_prd_conflict: G3 bloque ; arbitrage N+4 ; fusion ou renommage documente
  moc_rejected_at_g2: archive avec motif ; parties pertinentes -> IMPENSES ; aucun subalterne ne survit au rejet
  repo_without_prd_dir: creation PRD/ + index conforme artifact-structure-standard

traceability_descending:
  - intent_hash racine identique sur toute la chaine
  - source_repo / source_path pointent vers le parent
  - lien croise inverse dans la section Livrables du parent
validated: "GEN-010 -> KG-L + PIANO + GOVERNANCE-HUB, session 2026-08-23"

status_propagation_ascending:
  statuses: [draft, proposed, accepted, executing, done, archived]
  invariant: MOC non done tant qu'un subalterne est non done
  triggers: tout commit touchant un livrable (prd-moc-progress-sync)

enforcement:
- verifier: check-prd-structure.ps1 existence subalternes declares
- ghost_check: design-coverage-scanner (subalterne declare sans fichier = DESIGN_GHOST)
- template: REPO-STANDARDS/templates/PRD-MOC-from-INTENT.template.md etendu G0-G3
intent_hash_note: adosse PF2 - proprietaire GOVERNANCE-HUB N+4
