# Design: fractal-engineering-strata

> Fractal engineering auto-similaire sur les strates L0-L5

## Universal Principles

1. **Self-similarity** -- chaque strate réplique la même structure fractal
2. **Short-circuit NEUTRE** -- pas de court-circuit entre strates
3. **Max depth 6** -- limitation de profondeur pour éviter la récursion infinie
4. **Strata registry** -- chaque strate est enregistrée dans un registre canonique

## Architecture

```
L0-CANON (GOVERNANCE)
+-- L1-INFRA (CAUSALITE)
    +-- L2-PLATFORM (KERNEL)
        +-- L3-CITIZENS (COGNITION)
            +-- L4-TOOLS (SERVICES)
                +-- L5-ARCHIVE (PERSISTANCE)
```

## Contracts

### Strata contract

- Input: strate identifier + configuration
- Output: registered stratum with validated boundaries
- Side effect: updates `atoms/strate-registry.yaml`

### Fractal recursion contract

- Each stratum must implement the same interface:
  - `register()`
  - `validate()`
  - `propagate()`

## Implementation Notes

- Use `stratum-relay.yaml` atom for cross-strata communication
- Use `stratified-abstraction.yaml` atom for abstraction boundaries
- Maximum recursion depth: 6 levels

## Rollout

1. Define stratum in `atoms/strate-registry.yaml`
2. Implement `register/validate/propagate` interface
3. Validate with `engine/validator.py`
4. Test with `scripts/validate_strata.py`

