name: atomic-fragmentation
version: 1.0.0
description: "D\xE9composition atomique obligatoire pour tout LLM/SLM \xE0 capacit\xE9\
  \ limit\xE9e. Une t\xE2che = une action = un outil = un r\xE9sultat v\xE9rifiable.\
  \ \xC9vite les d\xE9passements de contexte, timeouts upstream, crashs silencieux.\n"
status: active
owner: gerivdb
intent_hash: 0xATOMIC_FRAGMENTATION_20260826
layer: L0
inherits:
- incremental-growth
- script-file-over-inline
- graceful-degradation-fallback
parameters:
  max_tokens_per_action: 4000
  max_files_per_session: 3
  max_minutes_per_commit: 30
  atomic_unit: single_file_single_tool
  native_tools_priority:
  - read
  - write
  - edit
  - glob
  - grep
  bash_max_lines: 3
  task_agent_max_context_lines: 100
  delegation_criterion: atomic_subproblem_only
constraints:
- "Une op\xE9ration = un fichier cibl\xE9, un outil natif (read/write/edit/glob/grep)"
- "Jamais de scan r\xE9cursif multi-repo en une commande"
- Jamais de regex Unicode complexes (utiliser emoji_cleaner.py)
- "Task agents uniquement pour sous-probl\xE8mes atomiques (1 fichier, 1 question)"
- "Agent Manager : mode local par d\xE9faut, max 3 sessions simultan\xE9es (RAM 24\
  \ Go)"
- 'Commit atomique : max 3 fichiers, max 30 min entre commits'
- Pattern Router obligatoire avant toute action (table de routage A-E)
- "Preuve d'ex\xE9cution horodat\xE9e pour tout [x] (clause GEN-012 DESIGN-E)"
performance:
  latency_p99: 45.0
  success_rate_target: 0.99
mitigates:
