version: 1.0.0
intent_hash: 0xadmg_20260801
status: active
description: "ADMG (Array Dependence Matrix Graph) comme mod\xE8le de d\xE9pendances\n\
  pour les syst\xE8mes multi-agents avec variables latentes.\n"
admg_illustration: "+----------+       +------------+       +-----------+\n|   A \
  \     | ----> |    B       | <---- |    C      |\n| (obs)    |       | (latent)\
  \   |       | (obs)     |\n+----------+       +------------+       +-----------+\n\
  \    |                    ^                    |\n    |                    |   \
  \                 |\n    v                    |                    v\n+----------+\
  \       +------------+       +-----------+\n|   D      | ----> |    E       | <----\
  \ |    F      |\n| (obs)    |       | (latent)   |       | (obs)     |\n+----------+\
  \       +------------+       +-----------+\n     |                   ^         \
  \          |\n     +---------+---------+---------+---------+\n               | \
  \                |\n               v                 v\n         +------------+\
  \    +------------+\n         |     G      |    |     H      |\n         |  (outcome)\
  \ |    |  (proxy)   |\n         +------------+    +------------+\n"
mapping:
- node_type: observed
  examples:
  - "\xE9v\xE9nement sign\xE9"
  - "r\xE9action agent"
  - "r\xE9sultat CI"
  storage: Buzz@block / WAL
  persistent: true
- node_type: latent
  examples:
  - "inf\xE9rence neuronale"
  - "intention non formul\xE9e"
  - contexte tacite
  storage: N243 / TLM-CORE
  persistent: false
- node_type: outcome
  examples:
  - merge decision
  - release
  - "d\xE9cision ternaire"
  storage: RLM-243 / N243 workflow
  persistent: true
- node_type: proxy
  examples:
  - hash-chain log
  - WAL ternaire
  - metrics
  storage: buzz-audit / wal.rs
  persistent: true
rules:
- id: ADMG-001
  name: "Ar\xEAtes Dirig\xE9es"
  description: "Les relations causales directes sont repr\xE9sent\xE9es par ->"
  enforcement: design
- id: ADMG-002
  name: Confounding
  description: "Les d\xE9pendances non causales entre latents sont repr\xE9sent\xE9\
    es par <->"
  enforcement: design
- id: ADMG-003
  name: DAG-3
  description: "Pas de cycles dirig\xE9s - le graphe est acyclique"
  enforcement: design
- id: ADMG-004
  name: "Observ\xE9 -> Persistant"
  description: "Toute variable observ\xE9e est persist\xE9e dans Buzz@block ou WAL"
  enforcement: auto
name: admg-state-model
layer: L0
adr: ADR-015-unified-design-v2
