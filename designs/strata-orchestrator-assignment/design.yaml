## Anti-patterns

| Anti-pattern | Description |
|---|---|
| `monolithic-orchestrator` | Un seul orchestrateur pour toutes les strates |
| `cross-strate-control` | Un orchestrateur N+1 contrôle la strate N |
| `orphan-stratum` | Une strate sans orchestrateur déclaré |
| `manager-sprawl` | Trop de managers (> 4 par orchestrateur) créent de la complexité |
| `recursive-infinite` | Récursivité sans limite, cascade de managers |
| `load-unchecked` | Orchestrateur sans métriques de charge |
| `domain-overlap` | Deux managers gèrent le même domaine |
| `single-point-of-failure` | Un manager sans fallback ni réplica |

## Exemples d'application

### Exemple 1 — VEX actuel (score estimé)

```
VEX: 19 clients, ~50 RPM, ~10 chemins, ~10 MB
load_score = (19/20)*0.3 + (50/100)*0.3 + (10/15)*0.25 + (10/50)*0.15
           = 0.285 + 0.15 + 0.167 + 0.03
           = 0.632 → LÉGER
```

→ Aucun manager nécessaire. Orchestrateur monolithique acceptable.

### Exemple 2 — VEX futur (si 40 clients)

```
VEX: 40 clients, ~120 RPM, ~18 chemins, ~40 MB
load_score = (40/20)*0.3 + (120/100)*0.3 + (18/15)*0.25 + (40/50)*0.15
           = 0.6 + 0.36 + 0.3 + 0.12
           = 1.38 → CRITIQUE
```

→ Déclencher fragmentation :
- Créer `VEXClientManagerA` (clients A-M)
- Créer `VEXClientManagerB` (clients N-Z)
- VEX devient router

### Exemple 3 — N243 méta-orchestrateur

```
N243: 5 strates, ~80 RPM, ~20 chemins, ~30 MB
load_score = (5/20)*0.3 + (80/100)*0.3 + (20/15)*0.25 + (30/50)*0.15
           = 0.075 + 0.24 + 0.333 + 0.09
           = 0.738 → MODÉRÉ
```

→ Surveillance. Si ajout de L5/L6 :
```
N243: 7 strates, ~150 RPM, ~28 chemins, ~45 MB
load_score = (7/20)*0.3 + (150/100)*0.3 + (28/15)*0.25 + (45/50)*0.15
           = 0.105 + 0.45 + 0.467 + 0.135
           = 1.157 → CRITIQUE
```

→ Déclencher fragmentation :
- Créer `N243L0Manager`, `N243L1Manager`, `N243L2Manager`, `N243L3Manager`
- N243 agrège les 4 managers
