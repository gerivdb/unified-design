---
name: jevx-engineering
description: "Pattern d'ingénierie Jevx : surcouche décisionnelle souveraine sur upstream LLM local. Définit le contrat entre un service de décision typé (noul/choice/score) et un backend d'inférence OpenAI-compatible. Applicable à tout wrapper souverain de modèle local."
version: "1.0.0"
status: active
layer: L4
type: pattern
profile: STANDARD
intent_hash: 0xDESIGN_JEVX_ENGINEERING_20260920
adr: ADR-0111-JEVX-SOVEREIGN-OVERLAY
inherits:
  - fractal-engineering-strata
  - meta-coherence
  - dev-tool-wrapper
  - safe-action-pattern
depends_on:
  - jevx
  - kg-causal
  - kix
components:
  - type: typed-question-compiler
    description: "Compile les questions typées (noul/choice/score) en prompts de classification + schéma JSON"
  - type: upstream-adapter
    description: "Adaptateur OpenAI-compatible ; traduit les appels Jev en chat completions"
    protocol: openai-chat-completions
  - type: probability-normalizer
    description: "Normalise les vecteurs de probabilité, calcule la confiance entropique"
  - type: malformed-retry-loop
    description: "Boucle de retry avec correction contextuelle pour sorties JSON invalides"
  - type: semaphore-backpressure
    description: "Backpressure par sémaphore pour limiter les appels upstream"
  - type: decision-telemetry
    description: "Télémétrie des décisions : input_tokens, output_tokens, confiance, retries"
    sink: kix-wal
  - type: constrained-parallel-decoding
    description: "Décodage parallèle contraint : préremplir le contexte une fois, diffuser le KV cache par champ, évaluer tous les champs dans un seul batch. Pattern issu de jevmlx, transposé pour llama.cpp CPU."
    mechanism: "llama_batch + logits biaisés sur tokens autorisés par champ + batch unique"
    reference: jevmlx (KV cache broadcast), mini-jev / jev_local (llama.cpp CPU)
    constraints:
      max_batch_size: 16
      logit_bias_per_field: true
      kv_cache_reuse: true
  - type: sovereign-adapter-pattern
    description: "Pattern d'adaptateur souverain : traduit l'état Jev en prompt de classification, valide JSON, normalise probabilités. Transposition Python de l'adaptateur TypeScript localjev."
    reference: githubnext/localjev (pattern adaptateur TypeScript)
    implementation: "script Python avec llama.cpp backend + FastAPI minimal"
    wsl1_compat: true
bridges:
  - target: repo:JEVX
    role: implementation
    protocol: http
    channel: L4-TOOLS/JEVX/v1/systemone
  - target: repo:KG-CAUSAL
    role: observation-source
    protocol: http
    channel: L4-TOOLS/KG-CAUSAL/causal/observation
  - target: repo:ROOTX
    role: effect-sink
    protocol: http
    channel: L4-TOOLS/ROOTX/causal/effect
  - target: repo:KIX
    role: service-discovery
    protocol: kix-discovery
    channel: L1-INFRA/KIX/services/jevx
  - target: repo:VOLTX
    role: vault-orchestrator
    protocol: wazaa-channel
    channel: L0-CANON/VOLTX/decisions
capabilities:
  - name: typed-decision-api
    description: "API de décision typée : noul (yes/no), choice (classification), score (échelle)"
    parameters:
      wire_protocol: jev-type-safe
      local_protocol: openai-chat-completions
      semantic_equivalence: partial
      calibration_required: true
  - name: probability-inference
    description: "Inférence probabiliste via prompt de classification + JSON schema strict"
    parameters:
      backend: openai-chat-completions
      response_format: json_schema
      seed_offset: 7919
      temperature: 0
  - name: entropy-confidence
    description: "Calcul de confiance entropique : 1 - H / log(n)"
    parameters:
      formula: "1 - (sum(p * log(p))) / log(n)"
      range: [0, 1]
      interpretation: "1 = confiance maximale, 0 = uniforme (ignorance)"
  - name: malformed-retry
    description: "Retry automatique avec injection du message d'erreur pour correction"
    parameters:
      max_retries: 2
      correction_strategy: context_injection
      error_feedback: true
  - name: semaphore-backpressure
    description: "Backpressure par sémaphore pour protéger le backend upstream"
    parameters:
      max_inflight: 2
      max_queue: 64
      overflow_strategy: http_529_retry_after
  - name: deterministic-seed
    description: "Graine déterministe par requête : SHA256(state + questions)"
    parameters:
      hash: sha256
      seed_offset: 7919
      purpose: "reproductibilité des décisions"
principles:
  - P0_SOVEREIGN_OVERLAY: JEVX est une surcouche souveraine ; l'upstream LocalJev est un détail d'implémentation remplaçable
  - P0_WIRE_COMPATIBILITY: compatibilité wire avec TypeSafe SDK, mais non-équivalence mathématique avec OpenJev logit read
  - P0_PROBABILITY_CALIBRATION: les probabilités sont auto-rapportées par le modèle ; calibration externe requise avant usage décisionnel conséquent
  - P0_DETERMINISTIC_SEED: chaque requête a une graine déterministe pour reproductibilité
  - P0_BRIDGE_TRACEABILITY: chaque décision est tracée dans WAL via KIX → VOLTX
  - P0_CPU_ONLY: exécution CPU-only ; GPU interdit
  - P0_MALFORMED_RETRY: toute sortie JSON invalide déclenche une correction contextuelle, pas un échec silencieux
  - P0_SECURITY_GUARDRAILS: toute décision automatisée sur action risquée nécessite un consensus minimum + seuil de confiance + possibilité d'escalade HITL
  - P0_DATA_SOVEREIGNTY: aucun backend ne doit envoyer de données hors ENV sans médiation JEVX
  - P0_SYNTHETIC_DATA_ONLY: tous les clones connus sont entraînés sur données 100% synthétiques ; calibration externe obligatoire avant usage décisionnel conséquent
constraints:
  - cpu_only: true
  - gpu_forbidden: true
  - runtime: bun
  - upstream_required: true
  - max_inflight: 2
  - questions_per_call: 16
  - outcomes_per_call: 128
  - temperature: 0
  - response_format: json_schema
  - calibration_required: true
  - semantic_equivalence: partial
  - synthetic_data_only: true
architecture_hypotheses:
  - name: ModernBERT
    status: consensus_stable
    evidence:
      - "Laya : ModernBERT-large 421M + tête PPO atteint 0.595 vs 0.480 sur DAIR Emotion"
      - "typed-decisions (kotoba-lang) teste ModernBERT, DeBERTa-v3, RoBERTa, LLaDA-MoE"
    pros:
      - "Attention bidirectionnelle naturelle pour lire état + confronter options"
      - "Stable et facile à reproduire sur CPU"
    cons:
      - "Fenêtre contexte limitée (512–1024 tokens) vs 32k–64k revendiqués par Jev"
      - "Confiance basée sur entropie, pas calibrée"
    implication: "JEVX peut implémenter un encodeur ModernBERT-like comme backbone souverain"
  - name: diffusion
    status: consensus_elegant
    evidence:
      - "DiffusionGemmaJev : 88.4% vs 90.8% Jev en 1 passe (H100)"
      - "Canvas fixe + lecture logits sur positions = parallélisme natif"
    pros:
      - "Évalue tous les champs d'une décision structurée en une seule passe"
      - "Pattern canvas transposable à llama.cpp via logit_bias"
    cons:
      - "Architecture gourmande en VRAM ; 26B-A4B hors de portée Z600"
      - "Implémentation CPU non triviale"
    implication: "JEVX transpose le pattern diffusion via constrained-parallel-decoding sur CPU"
security_gaps:
  - finding: "Aucun clone n'intègre de guardrails de décision"
    source: "Rapport veille 15-20 sept 2026 §7"
    impact: "Risque de faux négatifs sur actions risquées"
    mitigation: "JEVX ajoute consensus minimum + seuil de confiance + escalation HITL"
  - finding: "Données 100% synthétiques pour tous les clones"
    source: "Rapport veille 15-20 sept 2026 §7"
    impact: "Calibration hors distribution non vérifiée"
    mitigation: "Calibration externe obligatoire avant usage décisionnel conséquent"