name: generate-then-syntax-validate
description: >-
  Toute generation de code (templates, scaffold) est suivie
  IMMEDIATEMENT d'une validation syntaxique (py_compile/import) avant
  tout test fonctionnel. Incidents couverts : doubles accolades non
  dechappees (axes), \n litteraux (guards), indentation aplatie.
version: 1.0.0
status: active
inherits:
  - incremental-growth
  - schema-lint
parameters:
  validate_step: mandatory
  validate_target: import_or_compile_all
constraints:
- Aucun fichier genere n'est consomme sans avoir ete compile
- Le generateur nettoie ses propres artefacts defaillants
performance:
  latency_p99: 45.0
intent_hash: 0xgenerate_then_syntax_validate_20260825
layer: L0
