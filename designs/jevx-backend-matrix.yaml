---
name: jevx-backend-matrix
description: "Matrice de sélection de backend pour JEVX : mapping cas d'usage → backend recommandé selon contraintes matérielles (Z600/ENV2), latence, précision et souveraineté. Documente les compromis et les chemins de migration."
version: "1.0.0"
status: active
layer: L4
type: citizen
profile: STANDARD
intent_hash: 0xDESIGN_JEVX_BACKEND_MATRIX_20260920
adr: ADR-0111-JEVX-SOVEREIGN-OVERLAY
inherits:
  - jevx
  - jevx-engineering
  - typed-decision-api
depends_on:
  - jevx
  - jevx-engineering
hardware_profile:
  cpu: "E5620 Westmere, SSE4.2 / AVX1"
  gpu: "FORBIDDEN"
  ram_max_gb: 24
  execution_mode: "CPU-only"
backends:
  - id: minojev
    repo: zeredy879/minojev
    license: MIT
    model: 547k params (scalaire pur)
    ram_gb: <0.1
    cpu_req: "tout x86_64"
    avx_req: aucun
    wsl1_compat: true
    docker_req: false
    patch_effort: 0
    expected_latency_ms: 13-23
    token_output: 0
    confidence: 90
    legacy_fit: LEGACY_FIT
    use_case: "décision minimale < 100ms, routing, garde-fous"
  - id: nanojev
    repo: TianyuCodings/NanoJev
    license: MIT
    model: Qwen3-0.6B + 3 têtes de décision
    params: 0.6B
    ram_gb: ~1.2
    cpu_req: AVX1
    avx_req: AVX1
    wsl1_compat: true
    docker_req: false
    patch_effort: 0
    expected_latency_ms: 50-200
    token_output: variable
    confidence: 85
    legacy_fit: LEGACY_FIT
    use_case: "décision standard (noul/choice/score), équilibre vitesse/précision"
  - id: jevlike
    repo: vinnylarouge/jevlike
    license: MIT
    model: scorer entraîné from scratch
    params: "< 1 Go RAM"
    ram_gb: <1.0
    cpu_req: AVX1
    avx_req: AVX1
    wsl1_compat: true
    docker_req: false
    patch_effort: 0
    expected_latency_ms: variable
    token_output: variable
    confidence: 80
    legacy_fit: LEGACY_FIT
    use_case: "scorer custom, calibration souveraine, entraînement CPU"
  - id: jev_local
    repo: Argos1111/jev_local
    license: MIT (présumé)
    model: LFM2.5-1.2B Q8_0
    params: 1.2B
    ram_gb: ~1.3
    cpu_req: AVX1 (llama.cpp recompilé -mavx)
    avx_req: AVX1
    wsl1_compat: patchable
    docker_req: false
    patch_effort: moyen (1-2 jours)
    expected_latency_ms: 200-500
    token_output: variable
    confidence: 70
    legacy_fit: LEGACY_PATCHABLE
    use_case: "API compatible LocalJev, bridge upstream existant"
    patches_required:
      - "Remplacer appels wsl.exe par Bash direct sous WSL1"
      - "Recompiler llama.cpp avec -mavx (AVX1) sans -mavx2"
      - "Tester setup.sh sous WSL1"
  - id: localjev
    repo: githubnext/localjev
    license: MIT
    model: DiffusionGemma-26B-A4B-it-4bit
    params: 26B (A4B actifs)
    ram_gb: >16 (probablement ~20)
    cpu_req: non testé
    avx_req: inconnu
    wsl1_compat: partiel
    docker_req: false
    patch_effort: élevé
    expected_latency_ms: non mesuré
    token_output: variable
    confidence: 30
    legacy_fit: LEGACY_INSPIRE
    use_case: "référence architecturale uniquement — pattern adaptateur TypeScript"
    verdict: INCOMPATIBLE_Z600
    reason: "26B params hors de portée RAM sur Z600 (24 Go total)"
selection_matrix:
  - use_case: "décision minimale < 100ms"
    backend: minojev
    priority: 1
  - use_case: "décision standard (noul/choice/score)"
    backend: nanojev
    priority: 2
  - use_case: "scorer custom, calibration souveraine"
    backend: jevlike
    priority: 3
  - use_case: "API compatible LocalJev existante"
    backend: jev_local
    priority: 4
    condition: "patch WSL1 appliqué"
  - use_case: "référence architecturale / inspiration"
    backend: localjev
    priority: 5
    condition: "uniquement pour pattern, jamais pour exécution sur Z600"
principles:
  - P0_BACKEND_SOVEREIGNTY: aucun backend ne nécessite de clé API cloud ou trafic sortant non médié
  - P0_Z600_COMPATIBILITY: tous les backends LEGACY_FIT/PATCHABLE doivent fonctionner sur Z600/ENV2 (24 Go, AVX1, CPU-only)
  - P0_WSL1_FIRST: privilégier les backends compatibles WSL1 sans modification
  - P0_CALIBRATION_REQUIRED: tout backend auto-reporte ses probabilités ; calibration externe requise avant usage décisionnel conséquent
constraints:
  - ram_max_gb: 24
  - gpu_forbidden: true
  - cpu_only: true
  - wsl1_preferred: true
  - docker_forbidden: true
  - calibration_required: true
  - semantic_equivalence: partial
