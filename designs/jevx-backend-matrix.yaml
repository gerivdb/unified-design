principles:
  - P0_BACKEND_SOVEREIGNTY: aucun backend ne nécessite de clé API cloud ou trafic sortant non médié
  - P0_Z600_COMPATIBILITY: tous les backends LEGACY_FIT/PATCHABLE doivent fonctionner sur Z600/ENV2 (24 Go, AVX1, CPU-only)
  - P0_WSL1_FIRST: privilégier les backends compatibles WSL1 sans modification
  - P0_CALIBRATION_REQUIRED: tout backend auto-reporte ses probabilités ; calibration externe requise avant usage décisionnel conséquent
  - P0_DATA_SOVEREIGNTY: aucun backend ne doit envoyer de données hors ENV sans médiation JEVX
