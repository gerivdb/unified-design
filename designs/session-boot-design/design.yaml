---
name: session-boot-design
version: "1.0.0"
status: active
layer: L0
intent_hash: 0xDESIGN_SESSION_BOOT_20260920
description: >
  Design des checks BOOT/CLOSEOUT de session.
  Garantit que toute session multi-repo passe par BOOT (TALEX, WAZAA, 5sexter)
  et CLOSEOUT (auto-commit, push optionnel).
inherits:
  - ecosystem-meta-coherence
  - session-boot-sequence
depends_on:
  - ATOM-GATE-LAYERS
  - ATOM-EXTERNAL-VERIFICATION-MANDATORY
  - ATOM-STOP-CONDITION
capabilities:
  - name: boot-checks
    description: "Exécute les checks BOOT"
  - name: closeout
    description: "Clôture de session"
  - name: auto-commit
    description: "Auto-commit des changements valides"
states:
  - name: IDLE
    gate_to_next: SESSION_STARTED
  - name: BOOT
    gate_to_next: BOOT_OK
  - name: WORK
    gate_to_next: WORK_DONE
  - name: CLOSEOUT
    gate_to_next: CLOSEOUT_OK
functions:
  - id: F1
    name: BOOT_CHECKS
    state: IDLE→BOOT
    description: "Exécute les checks BOOT"
  - id: F2
    name: WORK_SESSION
    state: BOOT→WORK
    description: "Travail de session"
  - id: F3
    name: CLOSEOUT_SESSION
    state: WORK→CLOSEOUT
    description: "Clôture la session"
invariant: "Toute session multi-repo passe par BOOT et CLOSEOUT."
genes:
  - id: G1
    name: boot-first
    description: "Toujours boot avant de travailler"
  - id: G2
    name: closeout-last
    description: "Toujours closeout après le travail"
anti_patterns:
  - missing_gene: boot-first
    pathology: "Session sans boot → frictions non détectées"
  - missing_gene: closeout-last
    pathology: "Session sans closeout → working tree sale"
cross_references:
  - repo: gerivdb/GOVERNANCE-HUB
    relation: uses
  - repo: gerivdb/unified-design
    relation: documents
  - design: ecosystem-meta-coherence
  - primitive: session-boot-primitive
  - skill: session-boot-skill
  - citizen: session-boot-citizen
  - workflow: workflow-session-boot-closeout
  - pipeline: pipeline-session-boot-closeout
