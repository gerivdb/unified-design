---
name: jevx
description: "Decision-engine souverain JEVX : surcouche locale sur upstream LocalJev (githubnext/localjev). API Jev-compatible POST /v1/systemone, questions typées (noul/choice/score), probabilités normalisées, confiance entropique, retry malformed. Composant CLM TIMX → KG-CAUSAL → JEVX → ROOTX → TALEX → VOLTX."
version: "1.0.0"
status: active
layer: L4
type: citizen
profile: STANDARD
intent_hash: 0xINTENT_JEVX_SOVEREIGN_OVERLAY_20260919
adr: ADR-0111-JEVX-SOVEREIGN-OVERLAY
inherits:
  - fractal-engineering-strata
  - meta-coherence
  - dev-tool-wrapper
depends_on:
  - kg-causal
  - kix
  - rootx
  - talex
hardware_profile:
  cpu: "E5620 Westmere, SSE4.2"
  gpu: "FORBIDDEN"
  ram_max_gb: 24
  execution_mode: "CPU-only"
  runtime: "Python 3.12 + llama.cpp / Bun 1.2+ optionnel"
  deployment_wsl1:
    preferred_runtime: "Python 3.12"
    alternative_runtime: "Bun 1.2+"
    inference_backend: "llama.cpp compilé en statique avec fallback AVX1"
    isolation: "chroot ou proot pour dépendances Python si nécessaire"
    notes: |
      WSL1 n'est pas supporté nativement par tous les backends.
      - NanoJev / jevlike / minojev : compatibles WSL1 directs (Python pur).
      - jev_local : nécessite patch WSL1 (remplacer appels wsl.exe par Bash direct).
      - llama.cpp doit être compilé avec -mavx (AVX1) sans -mavx2.
    upstream_adapter:
      pattern: "script Python qui traduit état Jev → prompt de classification → JSON valide → probabilités normalisées"
      reference: githubnext/localjev (pattern adaptateur TypeScript, transposé en Python)
components:
  - type: decision-engine
    repo: gerivdb/JEVX
    path: D:\DO\WEB\TOOLS\L4-TOOLS\JEVX
    entrypoint: src/server.ts
    runtime: bun
  - type: typed-api
    protocol: http
    endpoint: /v1/systemone
    port: 8080
  - type: probability-normalizer
    description: "Normalisation des vecteurs de probabilité, calcul de confiance entropique"
  - type: upstream-adapter
    description: "Adaptateur OpenAI-compatible vers LocalJev wire protocol"
    upstream: githubnext/localjev
dependencies:
  - repo: gerivdb/KG-CAUSAL
  - repo: gerivdb/KIX
  - repo: gerivdb/ROOTX
  - repo: gerivdb/TALEX
  - repo: gerivdb/VOLTX
  - repo: githubnext/localjev
bridges:
  - target: repo:KG-CAUSAL
    role: consumer
    protocol: http
    channel: L4-TOOLS/JEVX/clm/observation
  - target: repo:KIX
    role: service-registry
    protocol: kix-discovery
    channel: L1-INFRA/KIX/services/jevx
  - target: repo:ROOTX
    role: effect-sink
    protocol: http
    channel: L4-TOOLS/JEVX/clm/effect
  - target: repo:TALEX
    role: narrative-engine
    protocol: wazaa-channel
    channel: L4-TOOLS/TALEX/causal/narrative
  - target: repo:VOLTX
    role: vault-orchestrator
    protocol: wazaa-channel
    channel: L0-CANON/VOLTX/decisions
  - target: repo:localjev-upstream
    role: upstream-backend
    protocol: openai-chat-completions
    channel: L5-ARCHIVE/localjev-upstream
capabilities:
  - name: typed-decisions
    description: "Questions typées Jev : noul (yes/no), choice (classification), score (échelle)"
    parameters:
      question_types: [noul, choice, score]
      max_questions_per_call: 16
      max_outcomes_per_call: 128
  - name: probability-inference
    description: "Inférence probabiliste via prompt classification + JSON schema strict"
    parameters:
      backend_selector: true
      backends:
        - id: nanojev
          repo: TianyuCodings/NanoJev
          model: Qwen3-0.6B + 3 têtes de décision
          params: 0.6B
          ram_gb: ~1.2
          cpu_req: AVX1
          wsl1_compat: true
          confidence: 85
        - id: jevlike
          repo: vinnylarouge/jevlike
          model: scorer from scratch
          params: <1 GB RAM
          ram_gb: <1.0
          cpu_req: AVX1
          wsl1_compat: true
          confidence: 80
        - id: minojev
          repo: zeredy879/minojev
          model: 547k params
          params: 547k
          ram_gb: <0.1
          cpu_req: scalaire
          wsl1_compat: true
          confidence: 90
        - id: jev_local
          repo: Argos1111/jev_local
          model: LFM2.5-1.2B Q8_0
          params: 1.2B
          ram_gb: ~1.3
          cpu_req: AVX1 (llama.cpp recompilé)
          wsl1_compat: patchable
          confidence: 70
      default_backend: minojev
      fallback_backend: nanojev
      response_format: json_schema
      seed_canvas: true
  - name: entropy-confidence
    description: "Calcul de confiance basé sur l'entropie du vecteur de probabilités"
    parameters:
      formula: "1 - entropy / log(n)"
      range: [0, 1]
  - name: malformed-retry
    description: "Retry automatique avec correction contextuelle pour sorties JSON invalides"
    parameters:
      max_retries: 2
      correction_prompt: true
  - name: semaphore-backpressure
    description: "Backpressure par sémaphore pour limiter les appels upstream concurrents"
    parameters:
      max_inflight: 2
      max_queue: 64
principles:
  - P0_SOVEREIGNTY: JEVX est une surcouche souveraine sur upstream LocalJev ; aucun trafic ne quitte l'ENV sans mediation JEVX
  - P0_WIRE_COMPATIBILITY: compatibilité wire avec Jev TypeSafe SDK, mais non-équivalence mathématique avec OpenJev logit read
  - P0_PROBABILITY_CALIBRATION: les probabilités sont auto-rapportées par le modèle ; calibration requise avant usage décisionnel conséquent
  - P0_BRIDGE_TRACEABILITY: chaque décision est tracée dans WAL via KIX → VOLTX
  - P0_CPU_ONLY: exécution CPU-only ; GPU interdit
constraints:
  - cpu_only: true
  - gpu_forbidden: true
  - runtime: bun
  - upstream_required: true
  - max_inflight: 2
  - questions_per_call: 16
  - outcomes_per_call: 128
  - temperature: 0
  - response_format: json_schema
  - calibration_required: true
  - semantic_equivalence: partial
security_guardrails:
  - id: decision_safety_filter
    description: "Filtre de sécurité sur les décisions à haut risque (actions irréversibles, accès privilégiés)"
    mechanism: "schema_validation + confidence_threshold + human_escalation"
    confidence_threshold: 0.85
    action_risk_levels: [low, medium, high, critical]
    critical_actions_require_hitl: true
  - id: false_negative_prevention
    description: "Prévention des faux négatifs sur les actions risquées (inverse de false positive)"
    mechanism: "consensus_minimum + entropy_upper_bound + fallback_human"
    consensus_minimum: 2
    entropy_upper_bound: 0.3
  - id: audit_trail
    description: "Trail d'audit complet pour toute décision automatisée"
    sink: kix-wal
    includes: [input_hash, backend_id, model_id, seed, probabilities, confidence, retry_count, latency_ms]
