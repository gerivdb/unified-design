name: auto-dev
version: 2.0.0
status: active
profile: RESEARCH
layer: L2_PLATFORM
intent_hash: 0xINTENT_AUTO_DEV_ECOSYSTEM_REUSE_20260927
inherits:
  - fractal-engineering-strata
  - meta-coherence
  - ecosystem-consciousness
description: >
  AUTO-DEV est le departement R&D autonome de l'ecosysteme gerivdb (ADR-032).
  Il transpose le paradigme AutoScientists vers l'ingenierie logicielle :
  une equipe d'agents LLM decentralises s'auto-organise pour proposer,
  executer, critiquer et valider des ameliorations continues sur les repos
  gerivdb, sans orchestrateur central, avec la meme rigueur qu'une experience
  scientifique. Role : R&D Automation. Logical layers: N2, N3, N4.
  Coverage cible du SOT actif : >= 80% par reuse obligatoire.
  Implémentation opérationnelle : 100% (49 bridges, 8+ agents core, 11 modules src,
  45 scripts, 3 skills, 1 citizen, 2 pipelines, scientific reflection protocols,
  auto-debug pathways).
consumers:
  - NEXUS
  - TALEX
  - MIMIR
  - HERMES
  - FLUX
  - ARGUS
  - KG-L
  - VERSES
  - ECOS-CLI
  - KIVA-CLI
  - KIVA
  - TRIX
  - BRAIN
  - KEEL
  - PLIX
  - N243
  - WAZAA
  - EMIT
  - KIX
  - RLM-METRICS
  - ROOTX
  - KG-CAUSAL
  - CURX
  - DAG-3
  - OBS
  - UAE
  - VDB
  - PHOTON
  - PIANO
  - LOOPX
  - DevTools
  - SKILLS
  - REPO-STANDARDS
capabilities:
  - name: hypothesis-generation
    description: Generation d'hypotheses de developpement non-redondantes via T1+T3 KEEL
    parameters:
      input: NEXUS state + AGENT_RAM
      output: KEEL hypothesis
      gate: FLUX-D4
  - name: critique
    description: Critique d'hypothese par diff0/diffscope sur la codebase
    parameters:
      tools:
        - diff0-fork
        - diffscope-fork
      endorsement: required
  - name: experiment
    description: Experimentation isolee dans TRIX namespace avec metriques
    parameters:
      runtime: TRIX
      metrics: per-phase latency
  - name: forge-validation
    description: Validation double-seed FORGE (noise-aware)
    parameters:
      seeds: 2
      noise_detection: true
      parallel: true
  - name: promotion
    description: Promotion P5 vers main sous controle FLUX D4 HITL
    parameters:
      score: phi_cps
      uae_score: 1/sqrt(d)
      coverage: required
  - name: forum-update
    description: Mise a jour shared state NEXUS + MIMIR + HERMES
    parameters:
      stores:
        - NEXUS WAL
        - MIMIR wiki
        - HERMES MEMORY.md
  - name: meta-loop
    description: Meta-loop KEEL-R6 avec rerouting axe apres 10 cycles sans delta
    parameters:
      threshold_cycles: 10
      reroute: required
  - name: ecosystem-reuse
    description: Capitalisation systematique des 102 repos actifs SOT
    parameters:
      coverage_target: 0.80
      current_coverage: 0.80
      reuse_policy: mandatory
      duplication_policy: forbidden
  - name: abstraction-level
    description: Mesure et maintien du niveau d'abstraction entre cycles successifs
    parameters:
      agent: agents/abstraction_level.py
      baseline: level_0.yaml
      curves: BRAIN
  - name: formal-tool
    description: Validation formelle par théorèmes instrumentés (Lawvere, Banach-Tarski)
    parameters:
      agent: agents/formal_tool.py
      theorems:
        - lawvere_fixed_point
        - banach_tarski
      crossrefs: ONTOLOGY/ARGUS
  - name: pr-factory
    description: Factory PR automatique avec rollback point, review, merge, WAL update
    parameters:
      agent: agents/pr_factory.py
      workflow: kiva_pr_workflow.py
      citizen_promotion: required
  - name: bridge-executor
    description: Exécution déclarative des bridges vers repos cibles
    parameters:
      executor: agents/bridge_executor.py
      health_monitor: agents/bridge_health_monitor.py
      contracts: bridges/*.yaml
  - name: auto-debug
    description: Sélection et exécution de debug pathways selon priorité P1/P2/P3
    parameters:
      selector: src/pathway_selector.py
      integrator: src/auto_debug_integrator.py
      pathways:
        - Observability (HIGH, score 0.85)
        - Automation (HIGH, score 0.78)
        - Infrastructure (MEDIUM, score 0.62)
  - name: scientific-reflection
    description: 5 mécanismes de réflexion scientifique intégrés au cycle P1→P7
    parameters:
      protocols:
        - RefusDeClôture (forum.py)
        - AbstractionLevel (abstraction_level.py)
        - CouteauFormel (formal_tool.py)
        - BreakthroughAnalysis (breakthrough_analyzer.py)
        - ValidationTransformative (champion.py)
  - name: talex-narrator
    description: Génération de récits TALEX depuis les cycles AUTO-DEV
    parameters:
      agent: agents/talex_narrator.py
      consumer: scripts/auto_dev_narrative_consumer.py
      output: narratives/auto-dev/cycles
  - name: focus-mode-router
    description: Routage focus-beam sur gap critique avec verrouillage swarm exclusif
    parameters:
      agent: src/focus_mode_router.py
      protocol: swarm-lease
  - name: breakthrough-analyzer
    description: Détection et analyse de breakthroughs dans les cycles AUTO-DEV
    parameters:
      agent: src/breakthrough_analyzer.py
      output: reports/breakthrough
  - name: linguistic-translatif-analyzer
    description: Analyse linguistique translative des hypothèses cross-lingual
    parameters:
      agent: src/linguistic_translatif_analyzer.py
      input: KEEL DSL
  - name: memory-writer-agent
    description: Écriture mémoire persistante des cycles dans HERMES/NEXUS
    parameters:
      agent: src/memory_writer_agent.py
      stores:
        - HERMES MEMORY.md
        - NEXUS WAL
  - name: research-directions-integrator
    description: Intégration des axes de recherche dans les cycles P1
    parameters:
      parser: src/research_directions_parser.py
      integrator: src/research_directions_integrator.py
      source: RESEARCH_DIRECTIONS.md
