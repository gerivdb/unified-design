scientific_reflection:
  mechanisms:
    - name: RefusDeClôture
      agent: forum.py
      protocol: RefusDeClôture
    - name: AbstractionLevel
      agent: abstraction_level.py
      protocol: AbstractionLevel
    - name: CouteauFormel
      agent: formal_tool.py
      theorems:
        - lawvere_fixed_point
        - banach_tarski
    - name: BreakthroughAnalysis
      agent: breakthrough_analyzer.py
      protocol: breakthrough_detector
    - name: ValidationTransformative
      agent: champion.py
      verdicts:
        - KEPT
        - TRANSFORMED
        - REJECTED
research_directions:
  axes:
    - id: RD1
      name: Auto-Développement Autonome (Cœur)
      vibe: le moteur se développe lui-même
      sub_axes:
        - Génération d'hypothèses
        - Sélection de champion
        - Double-seed FORGE
        - Méta-loop
    - id: RD2
      name: Réflexion Scientifique
      vibe: tout développement passe par la réfutation et la montée en abstraction
      sub_axes:
        - Refus de clôture
        - Montée en abstraction
        - Outils formels
        - Validation transformative
  source: RESEARCH_DIRECTIONS.md
