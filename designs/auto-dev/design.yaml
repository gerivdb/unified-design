        - VOLTX
        - VERSES
    - name: Automation
      priority: HIGH
      score: 0.78
      kgs:
        - KIVA
        - TRIX
        - ECOS-CLI
    - name: Infrastructure
      priority: MEDIUM
      score: 0.62
      kgs:
        - NEXUS
        - TOPOS
