# Citizen — PRD Status Auditor

## Mission

Auditer les PRD/MOC de `unified-design` et détecter les incohérences :
- Statut `proposed` avec livrables présents
- Statut `draft` avec livrables présents
- Statut `approved` avec livrables manquants

## Fréquence

- À chaque fin de session
- Sur déclenchement `dry_run_causal.py`

## Sortie

- Rapport JSON `reports/prd-status-audit.json`
- Journal `[PRD_STATUS_AUDIT]`

## Validation

- `python scripts/verify_prd_status.py --check-all`
