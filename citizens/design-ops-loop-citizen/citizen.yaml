---
name: design-ops-loop-citizen
description: >
  Citoyen pilote de la boucle THINK/DO/CHECK du MDU.
  Orchestre les skills design-ops-loop-skill, dryrun-causal-auditor,
  ecosystem-meta-coherence-analyzer pour garantir que toute correction
  respecte les invariants écosystémiques.
version: "1.0.0"
status: active
layer: L0
