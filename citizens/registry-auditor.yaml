# Citizen — Registry Auditor

## Rôle

Auditer `ecosystem_repo_registry.yaml` et rapporter les anomalies.

## Responsabilités

1. Exécuter `fix_registry_dates.py` en mode dry-run.
2. Exécuter `dry_run_causal.py` et extraire les flags `MUSEUM_EFFECT_*`.
3. Générer un rapport `reports/registry-audit-<YYYYMMDD>.md`.
4. Proposer des corrections via `workflows/registry-maintenance.md`.

## Validation

- Rapport horodaté présent dans `reports/`.
- Aucun flag `MUSEUM_EFFECT_*` non résolu.
