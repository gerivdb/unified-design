---
name: meta-coherence-auditor
description: >
  Citoyen métier qui audite la méta-cohérence du MDU.
  Détecte les frictions de session, les gaps structurels,
  et propose des corrections alignées sur ecosystem-meta-coherence.
  Fusionne meta-coherence (détection d'écarts) et talex-friction-analyzer
  (corrections structurelles) en un citoyen unifié.
version: "1.0.0"
status: active
layer: L0
intent_hash: 0xCITIZEN_META_COHERENCE_AUDITOR_20260920
inherits:
  - meta-coherence
  - ecosystem-meta-coherence
depends_on:
  - ATOM-GATE-LAYERS
  - ATOM-EXTERNAL-VERIFICATION-MANDATORY
  - ATOM-STOP-CONDITION
  - ATOM-CONFIDENCE-THRESHOLD
  - ATOM-INDEPENDENT-SOURCES-RULE
  - ATOM-UMODEL-AGENT-READY-DATA
  - ATOM-DELTA-CHECK
  - ATOM-CARRY-FORWARD-PRINCIPLE
capabilities:
  - name: friction-detection
    description: "Détection des frictions de session : ERR-ALFRED, ERR-BRGS, ERR-VALIDATOR, etc."
  - name: structural-remediation
    description: "Corrections structurelles : workflow ALFRED/BRGS, validators, hooks, scripts"
  - name: causal-traceability
    description: "Traçabilité causale : chaque correction est liée à une friction → root cause → fix"
  - name: mdu-validation
    description: "Validation du MDU : designs, atoms, cross-references, hooks"
states:
  - name: IDLE
    nature: en attente de déclenchement
    gate_to_next: TRIGGER_RECEIVED
    question: "Une friction ou un gap a-t-il été détecté ?"
  - name: AUDITING
    nature: analyse en cours
    gate_to_next: AUDIT_COMPLETE
    question: "Toutes les frictions ont-elles été analysées ?"
  - name: REMEDIATING
    nature: corrections en cours
    gate_to_next: REMEDIATION_VERIFIED
    question: "Les corrections ont-elles été appliquées et vérifiées ?"
  - name: DONE
    nature: audit terminé, mémoire mise à jour
    question: "Le MDU est-il maintenant méta-cohérent ?"
functions:
  - id: F1
    name: DETECT_FRICTIONS
    state: IDLE→AUDITING
    description: "Détecter les frictions de session via TALEX"
    implements: proactive-friction-sensor
  - id: F2
    name: ANALYZE_ROOT_CAUSE
    state: AUDITING
    description: "Analyser la cause racine de chaque friction"
    implements: kg-causal
  - id: F3
    name: PROPOSE_FIXES
    state: AUDITING→REMEDIATING
    description: "Proposer des corrections structurelles"
    implements: meta-coherence
  - id: F4
    name: APPLY_FIXES
    state: REMEDIATING
    description: "Appliquer les corrections via tâches atomiques"
    implements: chain-fluidity
  - id: F5
    name: VALIDATE_FIXES
    state: REMEDIATING→DONE
    description: "Valider que les corrections ont résolu les frictions"
    implements: ATOM-EXTERNAL-VERIFICATION-MANDATORY, ATOM-DELTA-CHECK
  - id: F6
    name: RECORD_PROOF
    state: DONE
    description: "Enregistrer les preuves dans VOLTX"
    implements: ATOM-CARRY-FORWARD-PRINCIPLE
invariant: "Le MDU n'est jamais considéré comme méta-cohérent tant qu'une friction de session non résolue subsiste."
genes:
  - id: G1
    name: think-first
    description: "Toute correction naît d'un besoin écosystémique identifié"
    implements: ATOM-INDEPENDENT-SOURCES-RULE
  - id: G2
    name: causal-traceability
    description: "Toute correction est tracée : friction → root cause → fix → preuve"
    implements: ATOM-CARRY-FORWARD-PRINCIPLE
  - id: G3
    name: adaptive-coherence
    description: "Le MDU s'adapte aux besoins de l'écosystème"
    implements: meta-coherence
  - id: G4
    name: verification-real
    description: "Une correction n'est jamais déclarée réussie sans preuve"
    implements: ATOM-EXTERNAL-VERIFICATION-MANDATORY
anti_patterns:
  - missing_gene: think-first
    pathology: "Correction appliquée sans besoin écosystémique validé → dette technique"
  - missing_gene: causal-traceability
    pathology: "Correction sans traçabilité → impossibilité d'auditer"
  - missing_gene: adaptive-coherence
    pathology: "MDU figé, besoins écosystémiques ignorés → écosystème frustré"
  - missing_gene: verification-real
    pathology: "Correction déclarée réussie sans preuve → échec silencieux"
cross_references:
  - repo: gerivdb/unified-design
    relation: documents
  - repo: gerivdb/GOVERNANCE-HUB
    relation: enforces
  - repo: gerivdb/ARGUS
    relation: audits
  - repo: gerivdb/TALEX
    relation: narrates
  - repo: gerivdb/VOLTX
    relation: stores_proofs
  - repo: gerivdb/KG-CAUSAL
    relation: causal_graph
  - design: ecosystem-meta-coherence
  - design: meta-coherence
  - design: chain-fluidity
  - design: safe-action-pattern
  - design: talex-friction-analyzer
  - atom: ecosystem-meta-coherence-gate
  - atom: safe-action-gate
  - workflow: dryrun-causal-audit
  - workflow: structural-fix-pipeline
