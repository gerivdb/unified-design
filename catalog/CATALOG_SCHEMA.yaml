# CATALOG_SCHEMA.yaml - Contrat commun des index miroirs (PRD-MOC-GEN-014 DESIGN-B)
# Regénéré par les scanners ; édition manuelle = HAND_EDIT_DETECTED.
version: "1.0"
entry:
  required: [type, id, source_repo, source_path, status, updated]
  optional: [intent_hash]
  types: [design, adr, skill, citizen, primitive]
  status_vocabulary: "hérité du canal source (actif/archivé/proposé/draft/...)"
rules:
  - id unique par canal ; type+id unique globalement
  - source_repo + source_path doivent résoudre vers un fichier existant au scan
  - index régénéré uniquement par catalog_sync_scanner (jamais édité à la main)
channels:
  designs:    {source: "unified-design/designs/**",            owner: unified-design}
  adrs:       {source: "GOVERNANCE-HUB/ADR/*.md",              owner: GOVERNANCE-HUB}
  skills:     {source: "SKILL.md découverts sous racines déclarées", owner: hôtes multiples}
  citizens:   {source: "citizen_registration.json + citizens.yaml",  owner: BDCP-CORE (post-ARB-2)}
  primitives: {source: "ONTOLOGY/primitives/**",               owner: ONTOLOGY}

# --- Enveloppe v1 (PRD-MOC-GEN-015 DESIGN-A) : contrat des événements tc.* ---
envelope:
  version: "1.0"
  required: [chain_id, stage, art_type, art_id, source_repo, source_path, status, ts, grade]
  stages: [vibe, intent, moc, prd, adr, epic, issue, impense]
  grades: [D0, D1, D2, D3, D4]
  rules:
    - "champs additionnels namespacés par type ; SCHEMA_VIOLATION sinon"
    - "un événement = une TRANSITION d'état (pas de heartbeat)"
    - "aucun contenu libre de conversation dans l'enveloppe (métadonnées uniquement)"
