# Deadlock Pattern Loop

Pattern de boucle vicieuse (incoherence) entre contraintes mutuellement exclusives.

## Description

Cette boucle documente un cas ou deux capacites imposent des contraintes qui ne peuvent etre satisfaites simultanement sur le materiel cible.

## Proprietes

- `virtuous: false` - boucle interdite par le detecteur.
- `cycle_length: 2` - 2 noeuds dans le cycle.
- `conflict: unsatisfiable` - aucune instanciation ne resout le conflit sans modification des parametres.

## Resolution

Le meta-design doit signaler cette boucle et proposer :
1. L'augmentation d'un des parametres.
2. L'introduction d'un pilier d'arbitrage (ex: Connard Design) pour trancher.

