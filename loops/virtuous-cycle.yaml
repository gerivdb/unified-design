# Virtuous Cycle Loop

Pattern de boucle de retroaction positive sur la performance.

## Description

Cette boucle documente comment l'observation (SDD) alimente l'adaptation (capabilities), qui a son tour declenche l'optimisation (CD), refermant la boucle sur l'observation avec des metriques ameliorees.

## Proprietes

- `virtuous: true` - boucle autorisee par le detecteur.
- `cycle_length: 3` - 3 noeuds dans le cycle.
- Aucun conflit semantique detecte.

## Utilisation

Dans un design instanciant cette boucle :

```yaml
loops:
  - name: virtuous-cycle
    nodes:
      observation: SDD
      adaptation: latency-bound
      optimisation: CD
```

