---
# REGISTRY.yaml - Mapping ONTOLOGY-FILL-SCHEMA
# Phase D : GERICODE KILOCODE ASSIMILATION
# Phase E : REFACTORING VERS L3-CITIZENS
# IntentHash: 0xEPIC_ASSIMILATION_20260801

phase_d:
  status: completed
  migration: L2-PLATFORM -> L3-CITIZENS
  psy_state_machine: deployed
  intent_hash: 0xEPIC_ASSIMILATION_20260801
  move_item: failed_access_denied
  copy_item: core_files_deployed

phase_e:
  status: active
  action: refactoring_gericode_l3_citizens
  intent_hash: 0xEPIC_REFACTOR_GERICODE_20260801
  gericode:
    source: D:/DO/WEB/TOOLS/L2-PLATFORM/GeriCode
    target: D:/DO/WEB/TOOLS/L3-CITIZENS/GeriCode/refactored
    type: full_refactor
    stratum_update: L2_COMPOSITION -> L3_CITIZENS
    modules:
      - bat-family-chat
      - ecos-cli-bridge
      - quality-check-runner
    psy_state_machine_integration: true
    authentication:
      cds:
        enabled: true
        validation: credential_delegation
        target: L3-CITIZENS
      cid:
        enabled: true
        validation: cross_repo_identity
        target: L3-CITIZENS

ontology_fill_schema:
  version: "2.2"
  description: "Mapping entre les concepts ONTOLOGY et les structures de donnees"
  last_updated: "2026-08-01"
  
  sources:
    - name: "psy_state_machine"
      path: "gerivdb/ONTOLOGY/psy_state_machine.yaml"
      type: "ontology_service"
      schema_version: "1.0"
      required: true
      phase_e_integration: true
      
    - name: "citizen_registry"
      path: "gerivdb/BRAIN/citizen_registry.json"
      type: "json_data"
      schema_version: "2.1"
      required: true
      
    - name: "known_repositories"
      path: "gerivdb/GOVERNANCE-HUB/known_repositories.yaml"
      type: "yaml_config"
      schema_version: "1.0"
      required: true

  mappings:
    # Migration L2-PLATFORM -> L3-CITIZENS (Phase D)
    - concept: "stratum_platform"
      source: "L2-PLATFORM"
      target: "L3-CITIZENS"
      type: "directory_rename"
      validation: "git ls-tree --recursive HEAD"
      phase: "D"
      
    - concept: "psy_state_machine"
      source: "ONTOLOGY/psy_state_machine.yaml"
      target: "ONTOLOGY/psy_state_machine.yaml"
      type: "service_deployment"
      validation: "ontology_audit.py"
      phase: "D"
      
    - concept: "citizen_routing"
      source: "citizen_"
      target: "citizen_"
      type: "disambiguation"
      validation: "benchmark-setup.yaml"
      phase: "D"

    # Refactoring GeriCode L3-CITIZENS (Phase E)
    - concept: "gericode_refactor"
      source: "L2-PLATFORM/GeriCode"
      target: "L3-CITIZENS/GeriCode/refactored"
      type: "refactor_move"
      validation: "git status --porcelain"
      phase: "E"
      
    - concept: "gericode_stratum"
      source: "L2_COMPOSITION"
      target: "L3_CITIZENS"
      type: "stratum_update"
      validation: "design.yaml"
      phase: "E"
      
    - concept: "gericode_psy_integration"
      source: "ONTOLOGY/psy_state_machine.yaml"
      target: "L3-CITIZENS/GeriCode/refactored/citizens.yaml"
      type: "service_integration"
      validation: "citizens.yaml"
      phase: "E"
      
    - concept: "gericode_authentication"
      source: "CDS+CID"
      target: "L3-CITIZENS"
      type: "auth_validation"
      validation: "cds_authentication_test.py"
      phase: "E"

  disambiguation_rules:
    - pattern: "psy_state_machine"
      rule: "dynamic_loading"
      source: "ONTOLOGY/psy_state_machine.yaml"
      
    - pattern: "citizen_"
      rule: "prefix_disambiguation"
      source: "citizen_registry.json"
      
    - pattern: "stratum_"
      rule: "stratum_mapping"
      source: "strate-registry.yaml"

  validation:
    strict_mode: true
    character_semantics: true
    behavior_responsiveness:
      - "panic_at_narcissistic_supply"
      - "_config:operation_mode:proactive_work"
      
  bdcp_compliance:
    mode: "BDCP"
    status: "maintained"
    watchdog_timeout: "300s"