---
cross_repo_flow:
  name: ontology -> kg-l
  provider: ONTOLOGY
  consumers:
    - KG-L
  contract:
    interface: file
    format: jsonl
    paths:
      - ONTOLOGY/concepts/*.md
      - KG-L/ontology_anchors.jsonl
    version: "1.0"
  validation:
