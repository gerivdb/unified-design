  status: active
---

# Flow — ONTOLOGY → KG-L

## Rôle
KG-L est le **graphe causal** qui utilise les termes ontologiques d'ONTOLOGY comme ancres sémantiques.

## Contrat
- **Provider** : `ONTOLOGY` expose les concepts canoniques.
- **Consumer** : `KG-L` consomme ces concepts pour :
  - `ontology_anchors.jsonl` : mapping terme → nœud graphe
  - `domain_links.json` : liens sémantiques
- **Boucle** : KG-L peut détecter des termes manquants et proposer leur création dans ONTOLOGY.

## Validation
- `provider_registered` : `ONTOLOGY` est dans `known_repositories.yaml`.
- `consumer_registered` : `KG-L` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `ONTOLOGY ↔ KG-L`.
- `contract_exists` : `ontology_anchors.jsonl` existe.

## Références
- `KG-L/ontology_anchors.jsonl`
- `ONTOLOGY/concepts/`
