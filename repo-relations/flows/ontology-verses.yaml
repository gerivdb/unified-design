---
cross_repo_flow:
  name: ontology -> verses
  provider: ONTOLOGY
  consumers:
    - VERSES
  contract:
    interface: file
    format: json
    paths:
      - ONTOLOGY/concepts/*.md
      - VERSES/ontology_anchors.jsonl
    version: "1.0"
  validation:
