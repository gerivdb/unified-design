  status: active
---

# Flow — ONTOLOGY → VERSES

## Rôle
VERSES est la **mémoire ontologique** qui sync les concepts depuis `ONTOLOGY` vers `KG-L` et inversement.

## Contrat
- **Provider** : `ONTOLOGY` expose les concepts canoniques (`ONTOLOGY/concepts/*.md`).
- **Consumer** : `VERSES` consomme ces concepts pour :
  - `ontology_anchors.jsonl` : points d'ancrage vers KG-L
  - `domain_links.json` : liens sémantiques de domaine
- **Boucle** : VERSES peut proposer de nouveaux concepts à ONTOLOGY via PR.

## Validation
- `provider_registered` : `ONTOLOGY` est dans `known_repositories.yaml`.
- `consumer_registered` : `VERSES` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `ONTOLOGY ↔ VERSES`.
- `contract_exists` : `ontology_anchors.jsonl` existe.

## Références
- `VERSES/ontology_anchors.jsonl`
- `ONTOLOGY/concepts/`
