---
cross_repo_flow:
  name: governance-hub -> topos
  provider: GOVERNANCE-HUB
  consumers:
    - TOPOS
  contract:
    interface: file
    format: json
    paths:
      - TOPOS/registry/repos.json
      - TOPOS/topology.yaml
    version: "1.0"
  validation:
    - provider_registered
    - consumer_registered
    - no_cycle
    - contract_exists
  wal_logging: required
  inherits: [cross-repo-flow]
  priority: P0
  status: active
---

# Flow — GOVERNANCE-HUB → TOPOS

## Rôle
TOPOS est le **registre canonique des lieux d'exécution** (ENV0-5+). Il consomme `known_repositories.yaml` pour aligner la topologie ENV sur la SOT des repos.

## Contrat
- **Provider** : `GOVERNANCE-HUB` expose `known_repositories.yaml`.
- **Consumer** : `TOPOS` lit la SOT pour mettre à jour `TOPOS/registry/repos.json` et `TOPOS/topology.yaml`.
- **Dérivation** : `local_path`, `layer`, `status` dans `known_repositories.yaml` sont la source de vérité pour `TOPOS/registry/repos.json`.

## Validation
- `provider_registered` : `GOVERNANCE-HUB` est dans `known_repositories.yaml`.
- `consumer_registered` : `TOPOS` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `GOVERNANCE-HUB → TOPOS → GOVERNANCE-HUB`.
- `contract_exists` : `TOPOS/registry/repos.json` existe.

## Références
- `TOPOS/registry/repos.json`
- `GOVERNANCE-HUB/known_repositories.yaml`
