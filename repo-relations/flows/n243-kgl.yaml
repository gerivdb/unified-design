---
cross_repo_flow:
  name: n243 -> kg-l
  provider: N243
  consumers:
    - KG-L
  contract:
    interface: api
    format: json
    paths:
      - N243/src/gate/*.py
      - KG-L/wal/*.jsonl
    version: "1.0"
  validation:
    - provider_registered
    - consumer_registered
    - no_cycle
    - contract_exists
  wal_logging: required
  inherits: [cross-repo-flow]
  priority: P1
  status: active
---

# Flow — N243 → KG-L

## Rôle
N243 est le **méta-orchestrateur ternaire** qui valide APPROUVER/SUSPENDRE/REJETER sur les écritures mémoire. KG-L est le graphe causal qui stocke ces écritures.

## Contrat
- **Provider** : `N243` expose le gate d'écriture mémoire.
- **Consumer** : `KG-L` soumet les écritures à N243 pour validation avant commit.
- **Boucle** : N243 retourne la décision à KG-L qui applique ou rollback.

## Validation
- `provider_registered` : `N243` est dans `known_repositories.yaml`.
- `consumer_registered` : `KG-L` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `N243 ↔ KG-L`.
- `contract_exists` : `KG-L/wal/` existe.

## Références
- `N243/`
- `KG-L/`
