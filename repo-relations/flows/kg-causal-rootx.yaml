# Flow — KG-CAUSAL → ROOTX

## Rôle
ROOTX est le **validateur de causalité systémique** (<50ms) pour le pipeline CLM. Il consomme les graphes causaux de KG-CAUSAL pour validation.

## Contrat
- **Provider** : `KG-CAUSAL` expose les graphes causaux à valider.
- **Consumer** : `ROOTX` valide la cohérence causale :
  - Pas de cycles causaux
  - Pas de contradictions
  - Conformité aux règles de causalité
- **Boucle** : ROOTX retourne le résultat de validation à KG-CAUSAL.

## Validation
- `provider_registered` : `KG-CAUSAL` est dans `known_repositories.yaml`.
- `consumer_registered` : `ROOTX` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `KG-CAUSAL ↔ ROOTX`.
- `contract_exists` : `ROOTX/src/` existe.

## Références
- `ROOTX/`
- `KG-CAUSAL/`
