# Flow — GOVERNANCE-HUB → unified-design

## Rôle
Extraction MDU : `unified-design` capture sous forme d'atomes les patterns de gouvernance qui existent informellement dans `GOVERNANCE-HUB`.

## Contrat
- **Provider** : `GOVERNANCE-HUB` expose `known_repositories.yaml`, `multi-repo-governance.yaml`, `BRIDGES.yaml`.
- **Consumer** : `unified-design` lit ces fichiers pour générer les atomes MDU (`atoms/`), les designs (`designs/`) et valider via `gerivdb design validate`.
- **Versionnement** : tout changement de schéma dans les fichiers source doit être tracé dans `unified-design/ADR/`.

## Validation
- `provider_registered` : `GOVERNANCE-HUB` est dans `known_repositories.yaml`.
- `consumer_registered` : `unified-design` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `GOVERNANCE-HUB → unified-design → GOVERNANCE-HUB`.
- `contract_exists` : les fichiers source existent et sont lisibles.

