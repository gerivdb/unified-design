---
cross_repo_flow:
  name: brain -> wazaa
  provider: BRAIN
  consumers:
    - WAZAA
  contract:
    interface: event
    format: json
    paths:
      - BRAIN/message-bus/*
      - WAZAA/protocols/*.yaml
    version: "1.0"
  validation:
