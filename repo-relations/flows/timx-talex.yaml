# Flow — TIMX → TALEX

## Rôle
TALEX est le **moteur narrative** qui consomme les features de TIMX pour la génération de récits.

## Contrat
- **Provider** : `TIMX` expose les features via canal WAZAA.
- **Consumer** : `TALEX` consomme ces features pour :
  - Extraction/structure/narration
  - Intégration KIX/TRIX/KIVA
- **Protocole** : WAZAA channel

## Validation
- `provider_registered` : `TIMX` est dans `known_repositories.yaml`.
- `consumer_registered` : `TALEX` est dans `known_repositories.yaml`.
- `no_cycle` : aucun cycle `TIMX ↔ TALEX`.
- `contract_exists` : `TALEX/src/` existe.

## Références
- `TIMX/design.yaml`
- `TALEX/`
