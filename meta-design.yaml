version: 2.1.0
intent_hash: 0xMDU_SCHEMA_20260731_V2_1_GRAPH_OF_LOOPS
status: active
inherits: []
capabilities:
- port_id: latency-bound
  description: Le design impose une limite de latence
  consumers: []
  profile: STANDARD
  parameters:
    max_latency_ms: 10
- port_id: power-capped
  description: Le design impose une limite de puissance
  consumers: []
  profile: STANDARD
  parameters:
    max_power_w: 150
- port_id: attention-mechanism
  description: Mecanisme d'attention universelle inspire d'UAE
  consumers: []
  profile: STANDARD
  parameters:
    scaling_factor: 1/sqrt(d)
    temperature: 1.0
    num_heads: 8
- port_id: symbol-retrieval
  description: Recuperation symboles via MCP au lieu lecture fichiers complets (L3
    Serena)
  consumers: []
  profile: STANDARD
  parameters:
    max_symbols_per_call: 50
    context_savings_tokens: 16000
- port_id: worktree-isolation
  description: Isolation physique agents via git worktree avec dry-run pre-merge (G2)
  consumers: []
  profile: STANDARD
  parameters:
    dry_run_enabled: true
    abort_on_conflict: true
    max_parallel_worktrees: 8
    cleanup_on_complete: true
- port_id: beads-sql-memory
  description: Memoire SQL versionnee (SQLite+WAL) - graphe insights + compression
    70% (L1 Beads)
  consumers: []
  profile: STANDARD
  parameters:
    compression_ratio: 0.7
    survival_modes:
    - context_reset
    - account_rotation
    query_interface: sql
    schema_version: 1
    index_strategy: btree+fulltext
- port_id: exit-interceptor
  description: Stop hook bloquant exit agent + validation cross-model avant liberation
    (L5)
  consumers: []
  profile: STANDARD
  parameters:
    block_on_exit: true
    validation_artifact: review.md
    require_signed_review: true
    timeout_seconds: 300
    self_review_prevention: true
- port_id: tdd-airain-law
  description: No Test No Code - suppression code prod sans test echoue prealable
    (L4 Superpowers)
  consumers: []
  profile: STANDARD
  parameters:
    enforce_test_first: true
    delete_on_violation: true
    violation_action: delete_and_restart
    test_must_fail_first: true
    coverage_threshold: 0.85
- port_id: trace-replay-proof
  description: Preuve par re-execution trace - capture + replay + assertions SQL (L6
    Workshop)
  consumers: []
  profile: STANDARD
  parameters:
    capture_mode: full_trace
    replay_target: local_daemon
    verification_method: sql_assertions
    trace_storage: sqlite+wal
    comparison_strategy: exact_trace_match
    pass_criteria: all_assertions_pass
design_rules:
- name: no-circular-inheritance
  check: graph_is_acyclic
- name: capability-conflict
  check: no_conflicting_capabilities
- name: symbol-retrieval-mandatory
  check: mcp_symbol_access_required
  description: Toute lecture code doit passer par MCP symbol-retrieval, pas Read/Edit
    direct
- name: worktree-isolation-enforced
  check: agent_worktree_isolation
  description: Chaque agent parallele doit avoir son worktree isole avec dry-run
- name: beads-sql-memory-persistence
  check: sql_memory_survival
  description: Insights doivent survivre reset contexte + rotation compte (compression
    70%)
- name: exit-interceptor-mandatory
  check: cross_model_validation_on_exit
  description: Exit agent bloque tant qu'un second modele n'a pas signe review.md
- name: tdd-airain-law-enforced
  check: test_first_or_delete
  description: Code prod sans test echoue prealable -> suppression immediate
- name: trace-replay-verification
  check: replay_assertions_pass
  description: Replay trace exacte contre code modifie + assertions SQL valident corrections
complexity_gates:
  cognitive_complexity: 15
  max_capabilities_per_design: 8
  max_rules_per_atom: 10
  max_nesting_depth: 3
design_schema:
  required_fields:
  - version
  - name
  - inherits
  - capabilities
  - design_version
  - intent_hash
  optional_fields:
    deprecated_capabilities: []
    priority_resolution: order
    deprecation_period_days: 90
  versioning:
    major: Breaking changes (removed capabilities)
    minor: Added capabilities or new optional fields
    patch: Bug fixes, parameter adjustments
  multiple_inheritance:
    supported: true
    conflict_resolution: priority
    parameter_merge: override
  deprecation_policy:
    warning_days: 30
    error_days: 90
    removal_strategy: soft-delete
industrialization:
  generator:
    template_repo: https://github.com/gerivdb/unified-design-template
    output_dir: ../generated-designs
  validator:
    command: connard-validator --strict
