    parameters:
      scaling_factor: "1/sqrt(d)"
      temperature: 1.0
      num_heads: 8
  
  # --- Nouvelles capacites Graph of Loops (L1-L6) ---
  - port_id: symbol-retrieval
    description: "Recuperation symboles via MCP au lieu lecture fichiers complets (L3 Serena)"
    consumers: []
    profile: STANDARD
    parameters:
      max_symbols_per_call: 50
      context_savings_tokens: 16000
  - port_id: worktree-isolation
    description: "Isolation physique agents via git worktree avec dry-run pre-merge (G2)"
    consumers: []
    profile: STANDARD
    parameters:
      dry_run_enabled: true
      abort_on_conflict: true
      max_parallel_worktrees: 8
      cleanup_on_complete: true
  - port_id: beads-sql-memory
    description: "Memoire SQL versionnee (SQLite+WAL) - graphe insights + compression 70% (L1 Beads)"
    consumers: []
    profile: STANDARD
    parameters:
      compression_ratio: 0.70
      survival_modes:
        - "context_reset"
        - "account_rotation"
      query_interface: "sql"
      schema_version: 1
      index_strategy: "btree+fulltext"
  - port_id: exit-interceptor
    description: "Stop hook bloquant exit agent + validation cross-model avant liberation (L5)"
    consumers: []
    profile: STANDARD
    parameters:
      block_on_exit: true
      validation_artifact: "review.md"
      require_signed_review: true
      timeout_seconds: 300
      self_review_prevention: true
  - port_id: tdd-airain-law
    description: "No Test No Code - suppression code prod sans test echoue prealable (L4 Superpowers)"
    consumers: []
    profile: STANDARD
    parameters:
      enforce_test_first: true
      delete_on_violation: true
      violation_action: "delete_and_restart"
      test_must_fail_first: true
      coverage_threshold: 0.85
  - port_id: trace-replay-proof
    description: "Preuve par re-execution trace - capture + replay + assertions SQL (L6 Workshop)"
    consumers: []
    profile: STANDARD
    parameters:
      capture_mode: "full_trace"
      replay_target: "local_daemon"
      verification_method: "sql_assertions"
      trace_storage: "sqlite+wal"
      comparison_strategy: "exact_trace_match"
      pass_criteria: "all_assertions_pass"

