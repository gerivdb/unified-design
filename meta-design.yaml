# Meta-Design Schema (MDU) v2
# Schema de validation YAML pour l'architecture gerivdb
# Version 2.0 : ajout des capacites, detection de boucles et industrialisation

$schema: "https://json-schema.org/draft/2020-12/schema"
version: "2.0.0"
intent_hash: 0xMDU_SCHEMA_20260715_V2
status: active

$schema: "schemas/meta-design.schema.json"

# Heritage multiple de designs abstraits
inherits: []

# Capacites heritees (mixins)
capabilities:
  - name: latency-bound
    description: "Le design impose une limite de latence"
    parameters:
      max_latency_ms: 10
  - name: power-capped
    description: "Le design impose une limite de puissance"
    parameters:
      max_power_w: 150
  - name: attention-mechanism
    description: "Mecanisme d'attention universelle inspire d'UAE"
    parameters:
      scaling_factor: "1/sqrt(d)"
      temperature: 1.0
      num_heads: 8

# Regles de validation du graphe de dependances
design_rules:
  - name: "no-circular-inheritance"
    check: "graph_is_acyclic"
  - name: "capability-conflict"
    check: "no_conflicting_capabilities"

# Schema etendu pour les fichiers design.yaml generes
design_schema:
  # Champs obligatoires
  required_fields:
    - version
    - name
    - inherits
    - capabilities
    - design_version
    - intent_hash
  
  # Champs optionnels avec valeurs par defaut
  optional_fields:
    deprecated_capabilities: []
    priority_resolution: "order"
    deprecation_period_days: 90
  
  # Versionnage semantique des designs
  versioning:
    major: "Breaking changes (removed capabilities)"
    minor: "Added capabilities or new optional fields"
    patch: "Bug fixes, parameter adjustments"
  
  # Heritage multiple
  multiple_inheritance:
    supported: true
    conflict_resolution: "priority"  # priority = ordre d'heritage
    parameter_merge: "override"    # override = dernier parametre gagne
  
  # Gestion des capacites depreciees
  deprecation_policy:
    warning_days: 30
    error_days: 90
    removal_strategy: "soft-delete"

# Detection de boucles de dependances semantiques

# Industrialisation : generation et validation de designs
industrialization:
  generator:
    template_repo: "https://github.com/gerivdb/unified-design-template"
    output_dir: "../generated-designs"
  validator:
    command: "connard-validator --strict"

# Architecture des quatre piliers
piliers:
  - nom: "Sonar-Driven Design"
    abbr: "SDD"
    role: "Observabilite"
    couleur: "#4CAF50"
    invariants:
      - nom: "Ping/Echo"
        description: "Message minimal avec ID unique + timestamp"
      - nom: "Sonar Map"
        description: "Structure partagee d'etat temps reel"
      - nom: "PRF"
        description: "Pulse Repetition Frequency"
      - nom: "Latence P99"
        valeur: 45
        unite: "ms"
      - nom: "Puissance"
        valeur: 12
        unite: "W"

  - nom: "Triadic Compound Eye"
    abbr: "TCE"
    role: "Orchestration Agents"
    couleur: "#2196F3"
    invariants:
      - nom: "Triade C-E-Obs"
        description: "Communication -> Execution -> Observation"
      - nom: "Swarm Intelligence"
        description: "Agents autonomes evolutifs"
      - nom: "HITL Gate"
        description: "Validation humaine pour modifications critiques"

  - nom: "MorphoHDL Anamorphic Growth"
    abbr: "MAG"
    role: "Optimisation Materielle"
    couleur: "#9C27B0"
    invariants:
      - nom: "Croissance Experimentale"
        description: "Circuits adaptatifs"
      - nom: "Base 243"
        description: "Structure ternaire native 3^5"
      - nom: "RVBA"
        description: "Canaux de couleur semantique"
      - nom: "O(1) Index"
        description: "Acces constant via index ternaire"

  - nom: "Connard Design"
    abbr: "CD"
    role: "Controle Qualite"
    couleur: "#F44336"
    invariants:
      - nom: "Heritage"
        max: 3
        description: "Profondeur d'abstraction"
      - nom: "Latence P99"
        valeur: 45
        unite: "ms"
      - nom: "Puissance"
        valeur: 12
        unite: "W"
      - nom: "Roast Automatique"
        description: "Feedback negatif constructif"

# Regles transversales
regles_transversales:
  - nom: "Composition"
    description: "Profondeur dependance <= 3 niveaux"
    action: "Wall of Shame"
  
  - nom: "Latence"
    description: "P99 <= 45ms pour operations critiques"
    action: "Roast automatique"
  
  - nom: "Puissance"
    description: "<= 12W par inference"
    action: "Optimisation PIANO"
  
  - nom: "Observation"
    description: "Tout systeme critique doit etre observable"
    action: "Ajout de probes Sonar"
  
  - nom: "Validation"
    description: "Toute modification passe par Connard"
    commandes:
      - "gerivdb connard validate <path>"
      - "gerivdb connard roast <path>"
      - "gerivdb connard watch <path>"
      - "gerivdb design validate [--path <path>] [--strict] [--output text|json]"

