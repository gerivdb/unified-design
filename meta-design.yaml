# Validation
validation:
  schema: "meta-design.yaml"
  adr: "ADR-012, ADR-015, ADR-016, ADR-017"
  cli: "gerivdb meta validate"
  hooks:
    pre_commit: true
    pre_push: true

# Politique Git
git_policy:
  default_branch: main
  protected: true
  feature_prefix: "feat/"
  hotfix_prefix: "hotfix/"
  require_pr: true
  require_ci_passing: true
  min_approvals: 1
  disallow_direct_push_to_main: true
  disallow_direct_push_to_master: true

