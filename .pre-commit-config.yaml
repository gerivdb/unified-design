repos:
  - repo: local
    hooks:
      - id: bom-check
        name: UTF-8 BOM Checker
        entry: python tools/check_bom.py
        language: system
        pass_filenames: true
        files: ^(designs|docs|catalog)/.*\.(yaml|yml|md)$
        stages: [pre-commit]
      - id: catalog-check
        name: Catalog ↔ Filesystem Validator
        entry: python tools/check_catalog.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ascii-fixer
        name: ASCII Fixer (auto-correction)
        entry: python tools/ascii_fix.py --fix
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: gate-6
        name: GATE-6 ASCII Validator
        entry: python tools/check_ascii.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      - id: kiva-pipeline-unified-design
        name: KIVA-CLI Pipeline Validator (unified-design)
        entry: cmd /c kiva pipeline run unified-design
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: design-validate
        name: Validate MDU designs (strict)
        entry: python scripts/validate_designs.py --strict
        language: system
        pass_filenames: true
        files: ^designs/.*\.yaml$
        stages: [pre-commit]
      - id: branch-taxonomy-check
        name: Validate branch taxonomy
        entry: python scripts/branch-taxonomy-validator.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
