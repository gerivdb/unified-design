# Graph des dependances critiques (cycles interdits)

## Cycle detecte et resolu
- PIANO <-> LLUX (binding bidirectionnel)
  Resolution: PIANO necessite LLUX au runtime, LLUX ne connait pas PIANO
  
- SPIDX <-> LLUX (embeddings)
  Resolution: SPIDX appelle LLUX, LLUX ne connait pas SPIDX

- GATEWAY-MANAGER <-> TRIX (routing)
  Resolution: GATEWAY route vers TRIX, TRIX expose health, pas de cycle

## Aretes critiques (latence <= 45ms)
1. KiloCode -> GATEWAY-MANAGER -> TRIX -> LLUX
2. PIANO -> LLUX (binding direct)
3. SPIDX -> LLUX (embeddings)
4. RLM-DEPLOY -> TRIX -> LLUX (health checks)

## Aretes de fallback (tolerance panne)
1. GATEWAY-MANAGER -> ollama-env2 (si LLUX down)
2. GATEWAY-MANAGER -> openrouter-nemotron-free (si local down)
3. PIANO -> retry + circuit breaker -> fallback GATEWAY
4. SPIDX -> cache embeddings -> retry LLUX

