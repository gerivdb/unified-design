# Git Zombie Cleaner Atom

Pattern de nettoyage des processus git orphelins sur Windows.

## Role

Éliminer les processus `git.exe` qui survivent a leur parent suite a :
- Un crash du script PowerShell
- Un timeout non gere
- Un `git` blocke sur un prompt ou un lock

## Structure canonique

```powershell
# GUARD - Clean git zombies from previous runs (> 8 min alive)
Get-Process -Name "git" -ErrorAction SilentlyContinue |
    Where-Object { $_.StartTime -and (Get-Date).Subtract($_.StartTime).TotalMinutes -gt 8 } |
    ForEach-Object {
        Write-Output "[CLEAN] Kill git zombie PID $($_.Id) (runtime $([int](Get-Date).Subtract($_.StartTime).TotalMinutes)m)"
        try { $_.Kill() } catch {}
        try { $_.WaitForExit(2000) | Out-Null } catch {}
        try { $_.Dispose() } catch {}
    }
```

## Invariants

- La detection DOIT utiliser `StartTime` pour calculer l'age
- Le threshold DOIT etre configurable (defaut: 8 min)
- Le kill DOIT etre gracieux (`Kill()` puis `WaitForExit`)
- Le `Dispose()` DOIT etre appele meme en cas d'erreur

