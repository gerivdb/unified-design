# Atom : Convention over Configuration (CoC)

## Contexte
Principe de conception : etablissez des conventions logiques par defaut et ne configurez que les cas d'exception.

## Application dans MDU
- **Stratification** : L0-CANON, L1-INFRA, L4-TOOLS, L5-ARCHIVE
- **Atomes** : Nomination standardisee, structure YAML coherente
- **Citizens** : Structure de projet standardisee

## Conventions etablies
1. **Chemins** : `D:\DO\WEB\TOOLS\L{stratification}`
2. **Atomes** : `unified-design/atoms/{nom-slug}.yaml`
3. **IntentHash** : `0x<SLUG_MAJUSCULES>_YYYYMMDD`
4. **Statut** : `proposed`, `accepted`, `deprecated`, `superseded`

## Configuration minimale
```yaml
# Cas standard - conventions par defaut
name: my-atom
type: atom
description: "Mon atome"

# Cas d'exception - configuration explicite
name: custom-atom
type: custom
description: "Mon atome custom"
category: special
```

## Verification
```bash
# Verifier CoC dans un projet
ctulu validate-coc --path ./src/
```

## Avantages
- **Reduction de la configuration** : Moins de fichiers a creer
- **Coherence** : Tous les projets suivent le meme pattern
- **Productivite** : Moins de decision a prendre

## Anti-patterns
- Configuration excessive pour des cas standards
- Decisions de design repetees dans chaque projet
- Nommage incoherent entre modules