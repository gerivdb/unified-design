# Citizen Routing Atom

Pattern de routage des taches vers les citoyens.

## Role

Delegue les taches aux agents specialises via un algorithme de matching :
1. **BDCP Check** : Si `bdcp_mode == true` et acces reseau requis -> STOP
2. **Registry Load** : Chargement de `CITIZENS.yaml`
3. **Match Specificity** : Selection du citoyen avec la plus haute specificite
4. **Fallback** : Si aucun match -> Kilo Agent

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `registry` | string | `CITIZENS.yaml` | Registre des citoyens |
| `fallback` | string | `Kilo Agent` | Agent de fallback |
| `steps` | list | `[bdcp_check, registry_load, match_specificity, fallback]` | Étapes de routage |
| `max_specificity` | int | `3` | Specificite max |

## Invariants

- Le BDCP check EST la premiere etape
- Le registre DOIT etre charge avant matching
- Le fallback EST l'agent principal

## Exemple d'usage

```yaml
capabilities:
  - name: citizen-routing
    parameters:
      registry: CITIZENS.yaml
      fallback: Kilo Agent
      steps: [bdcp_check, registry_load, match_specificity, fallback]
      max_specificity: 3
```

