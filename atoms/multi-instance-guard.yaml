# Multi-Instance Guard Atom

Pattern de garde contre les executions concurrentes sur Windows.

## Role

Prevenir les corruption de donnees et les race conditions lorsque :
- Un script long risque d'etre lance plusieurs fois
- Un processus zombie peut bloquer un mutex abandonne
- Plusieurs agents KiloCode operent sur le meme depot

## Structure canonique

```powershell
# GUARD - Anti-multi-instance (Windows named mutex)
$mutexName = "Global\EcoSyncAudit_Mutex"
$mutex = New-Object System.Threading.Mutex($false, $mutexName)
$ownsMutex = $false
try {
    $ownsMutex = $mutex.WaitOne(0)
} catch {
    # Abandoned mutex from crashed prior run - retry once
    Start-Sleep -Milliseconds 500
    try { $ownsMutex = $mutex.WaitOne(0) } catch { $ownsMutex = $true }
}
if (-not $ownsMutex) {
    Write-Output "[SCRIPT] Une instance est deja en cours. Abandon."
    exit 2
}

trap {
    try { if ($mutex) { $mutex.ReleaseMutex() } } catch {}
    try { if ($mutx) { $mutex.Dispose() } } catch {}
    break
}
```

## Invariants

- Le mutex DOIT etre nomme `Global\` pour etre visible inter-sessions
- Le timeout DOIT etre 0 (non-bloquant) par defaut
- Un mutex abandonne DOIT etre recupere apres 500ms de sleep
- Le cleanup DOIT etre dans un `trap` ou `finally`

