# WAL Compaction Atom

Pattern de journal immuable pour operations cross-repos.

## Role

Garantir la tracabilite et la recuperation des operations multi-repos :
- **Écriture atomique** : une entree = une operation = un fichier/line
- **Compaction** : fusion des entrees anciennes sans perte
- **Replay** : re-jouer les operations pour reconstruire l'etat
- **Validation** : verifier l'integrite avant/apres compactage

## Structure canonique

```
WAL/
  entries/
    20260716-001-ecos-sync.yaml
    20260716-002-pr-merge.yaml
  compacted/
    20260701-20260715.yaml
  manifest.yaml
```

```yaml
# entry format
- timestamp: "2026-07-16T01:45:00Z"
  repo: GOVERNANCE-HUB
  operation: sync
  source: main
  target: feat/foo
  status: completed
  intent_hash: 0xABC123
```

## Invariants

- Une entree WAL NE DOIT JAMAIS etre modifiee apres ecriture
- Le compactage DOIT preserver toutes les entrees (append-only)
- Le replay DOIT etre idempotent
- L'integrite DOIT etre verifiee par hash ou signature

