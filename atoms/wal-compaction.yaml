# WAL Compaction Atom

Pattern de journal immuable pour opérations cross-repos.

## Rôle

Garantir la traçabilité et la récupération des opérations multi-repos :
- **Écriture atomique** : une entrée = une opération = un fichier/line
- **Compaction** : fusion des entrées anciennes sans perte
- **Replay** : re-jouer les opérations pour reconstruire l'état
- **Validation** : vérifier l'intégrité avant/après compactage

## Structure canonique

```
WAL/
  entries/
    20260716-001-ecos-sync.yaml
    20260716-002-pr-merge.yaml
  compacted/
    20260701-20260715.yaml
  manifest.yaml
```

```yaml
# entry format
- timestamp: "2026-07-16T01:45:00Z"
  repo: GOVERNANCE-HUB
  operation: sync
  source: main
  target: feat/foo
  status: completed
  intent_hash: 0xABC123
```

## Invariants

- Une entrée WAL NE DOIT JAMAIS être modifiée après écriture
- Le compactage DOIT préserver toutes les entrées (append-only)
- Le replay DOIT être idempotent
- L'intégrité DOIT être vérifiée par hash ou signature

