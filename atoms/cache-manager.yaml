# Cache Manager Atom

Pattern de cache multi-niveaux avec eviction intelligente.

## Role

Accelerer les accres repetes dans l'ecosysteme :
- **LRU** :Least Recently Used pour memoire bornee
- **TTL** : Time-To-Live pour donnees volatiles
- **Namespaces** : isolation par contexte (repo, couche, citizen)
- **Stats** : hit_rate, miss_rate, evictions
- **Predictive** : prechargement base sur patterns d'acces

## Structure canonique

```python
class CacheManager:
    def __init__(self, namespace: str, max_size: int = 1000, ttl: int = 3600):
        self.namespace = namespace
        self.cache = LRUCache(max_size)
        self.ttl = ttl
        self.stats = {"hits": 0, "misses": 0, "evictions": 0}
    
    def get(self, key: str) -> Any:
        if key in self.cache:
            self.stats["hits"] += 1
            return self.cache[key]
        self.stats["misses"] += 1
        return None
    
    def set(self, key: str, value: Any, ttl: int = None):
        self.cache[key] = value
        if ttl: schedule_expiry(key, ttl)
```

## Invariants

- Les keys DOIVENT etre namespacees (`repo:file:path`)
- Le TTL DOIT etre supporte par entree
- Les stats DOIVENT etre exposees via metriques
- L'eviction DOIT etre deterministe (LRU ou TTL, pas aleatoire)

