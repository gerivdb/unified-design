# Atom : sovereign-vector-memory

## Contexte
Base sur INTENT-005 MEMORY ARCHITECTURE SOVEREIGNTY. Memoire conversationnelle agent avec persistance locale, concue pour eviter les services externes (Qdrant, ChromaDB, Weaviate).

## Architecture
```
+---------------------------------------------+
|                    MEMORY CITIZEN          |
+---------------------------------------------+
|  +-----------------+    +-----------------+ |
|  |   LRU Cache     |--->|   SQLite DB     | |
|  |  (in-memory)    |    | (persistence)   | |
|  +-----------------+    +-----------------+ |
|           |                         |        |
|           v                         v        |
|  +-----------------------------------------+ |
|  |           TF-IDF Vectorizer             | |
|  |  (similarite cosinus, calcul local)     | |
|  +-----------------------------------------+ |
+-------------------------------------------------+
```

## Principes
1. **Souverainete** : Toute la memoire est stockee localement
2. **Gratuite** : Aucun service externe, zero cout
3. **Maitrise** : Le "nerf de la guerre" est la maitrise des outils integres
4. **Precaution** : L'addition de services externes est un piege financier