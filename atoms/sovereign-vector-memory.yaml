# Atom : sovereign-vector-memory

## Contexte
Basé sur INTENT-005 MEMORY ARCHITECTURE SOVEREIGNTY. Mémoire conversationnelle agent avec persistance locale, conçue pour éviter les services externes (Qdrant, ChromaDB, Weaviate).

## Architecture
```
┌─────────────────────────────────────────────┐
│                    MEMORY CITIZEN          │
├─────────────────────────────────────────────┤
│  ┌─────────────────┐    ┌─────────────────┐ │
│  │   LRU Cache     │───▶│   SQLite DB     │ │
│  │  (in-memory)    │    │ (persistence)   │ │
│  └─────────────────┘    └─────────────────┘ │
│           │                         │        │
│           ▼                         ▼        │
│  ┌─────────────────────────────────────────┐ │
│  │           TF-IDF Vectorizer             │ │
│  │  (similarité cosinus, calcul local)     │ │
│  └─────────────────────────────────────────┘ │
└─────────────────────────────────────────────────┘
```

## Principes
1. **Souveraineté** : Toute la mémoire est stockée localement
2. **Gratuité** : Aucun service externe, zéro coût
3. **Maîtrise** : Le "nerf de la guerre" est la maîtrise des outils intégrés
4. **Précaution** : L'addition de services externes est un piège financier