# Scheduled Loop Atom

Capacite de design pour les loops planifiees.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `cron` | string | `null` | Expression cron |
| `timezone` | string | `null` | Fuseau horaire |
| `catchup_on_boot` | bool | `true` | Rattraper les occurrences manquees au boot |

## Invariants

- Un cron invalide => loop non schedulee, erreur loggee.
- Le scheduler est mono-processus ; `addLoop`/`removeLoop` sont serialises.

