# Atom : cognitive-bus

## Contexte
Base sur INTENT-001 WAZAA BUS COGNITIF UNIFIÉ. Architecture consolidee du bus cognitif WAZAA avec WAL, pub/sub, et validation des messages.

## Invariant
- WAZAA est le seul bus cognitif (pas de doublon NEXUS/wazaa_bus/)
- Tous les messages sont journalises dans le WAL
- Les agents se registrent via contracts/

## Architecture
```
WAZAA Bus (evenements critiques)
     bus_runner.py
         |
         v
+---------------------------------------------+
|  +-------------+  +-------------+  +-------+ |
|  |  Pub/Sub    |  |   Filter    |  | Queue | |
|  |   Engine    |  |   Engine    |  | Engine| |
|  +-------------+  +-------------+  +-------+ |
|           |                         |        |
|           v                         v        |
|  +-----------------------------------------+ |
|  |           WAL (Write-Ahead Log)           | |
|  |  Persistance garantie, rollback possible  | |
|  +-----------------------------------------+ |
+-------------------------------------------------+
```

## Évenements bus
```yaml
Emits:
  - bus.message.published
  - bus.message.subscribed
  - bus.message.failed
  - bus.event.compressed
  - bus.backpressure.triggered
```