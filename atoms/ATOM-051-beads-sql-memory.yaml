version: "2.0.0"
name: "ATOM-051-beads-sql-memory"
inherits: ["ATOM-005-memory-curator", "ATOM-006-wal-compaction", "ATOM-007-sovereign-vector-memory"]
capabilities:
  - name: "beads-sql-memory"
    description: "Mémoire SQL versionnée (SQLite+WAL) - graphe insights + compression 70%"
    parameters:
      storage_backend: "sqlite+wal"
      compression_ratio: 0.70
      survival_modes:
        - "context_reset"
        - "account_rotation"
      query_interface: "sql"
      schema_version: 1
      index_strategy: "btree+fulltext"
  - name: "latency-bound"
    parameters:
      max_latency_ms: 20
  - name: "power-capped"
    parameters:
      max_power_w: 8
