# Sandbox Isolation Atom

Pattern d'isolation des environnements neurosymboliques (NeSy).

## Role

Toute execution NeSy doit etre isolee dans un CubeSandbox ephemere :
- **Isolation** : pid, mnt, net, user namespaces
- **Duree de vie** : ephemere (cree/detruit a la demande)
- **Nettoyage** : automatique apres execution

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `engine` | string | `CubeSandbox` | Moteur de sandbox |
| `lifespan` | string | `ephemeral` | Duree de vie |
| `namespaces` | list | `[pid, mnt, net, user]` | Namespaces isoles |
| `cleanup` | string | `automatic` | Nettoyage automatique |

## Invariants

- Toute execution NeSy DOIT etre dans un CubeSandbox
- Les namespaces DOIVENT etre isoles
- Le nettoyage DOIT etre automatique

## Exemple d'usage

```yaml
capabilities:
  - name: sandbox-isolation
    parameters:
      engine: CubeSandbox
      lifespan: ephemeral
      namespaces: [pid, mnt, net, user]
      cleanup: automatic
```

