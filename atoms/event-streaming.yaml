# Atom : event-streaming

## Contexte
Base sur EPIC-1222 REAL-TIME EVENT STREAMING SERVER. Serveur WebSocket pour le streaming temps reel des evenements WAZAA.

## Fonctionnalites
- **Pub/Sub** : Publication et abonnement aux evenements
- **Filtrage** : Filtrage selectif des evenements par type
- **Backpressure** : Gestion du debordement avec file d'attente
- **Compression** : Compression des messages volumineux
- **Heartbeat** : Detection des connexions mortes

## Architecture
```
+---------------------------------------------+
|         EVENT STREAMING SERVER              |
+---------------------------------------------+
|  +-------------+  +-------------+  +-------+ |
|  |  Pub/Sub    |  |   Filter    |  | Queue | |
|  |   Engine    |  |   Engine    |  | Engine| |
|  +-------------+  +-------------+  +-------+ |
|           |                         |        |
|           v                         v        |
|  +-----------------------------------------+ |
|  |           WebSocket Server              | |
|  |  - Connection management                | |
|  |  - Message routing                      | |
|  |  - Compression                          | |
|  +-----------------------------------------+ |
+---------------------------------------------+
```

## Évenements supportes
- `event.stream.started` - Le streaming a demarre
- `event.stream.stopped` - Le streaming s'est arrete
- `event.published` - Un evenement a ete publie
- `event.subscribed` - Un client s'est abonne
- `event.filtered` - Un evenement a ete filtre
- `event.backpressure.triggered` - Le backpressure est declenche