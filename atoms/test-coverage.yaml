# ATOM-049 - Test Coverage & Cycle Detection

## Contexte

ATOM-045 a introduit les relations structurelles, dont le kind `blocks` impose une acyclicité stricte.
Le validateur actuel ne détecte que les doublons exacts, pas les cycles transitifs.

## Objectif

1. Ajouter une détection de cycles `blocks` par DFS dans `piano/inference.py`.
2. Définir un seuil de couverture de tests pour `piano` et `plix`.
3. Référencer ATOM-045 (structural-relations) dans la sortie de validation.

## Règles

- `_detect_blocks_cycles(graph)` retourne la liste des cycles ou `[]` si acyclique.
- `validate_structural` intègre la détection et retourne `False` si un cycle est trouvé.
- Seuil de couverture : 80 % sur `piano/` et `plix/`.
- La CLI `plix validate --structural` affiche les cycles détectés sans lever d'exception.

## Validation

```yaml
structural_relations:
  - kind: blocks
    target: alpha
  - kind: blocks
    target: beta
```

Si `alpha -> beta -> alpha`, la validation échoue et liste le cycle.

