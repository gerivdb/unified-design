# Artifact Synced Loop Atom

Capacite de design pour les loops a artifacts synchronises.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `artifact_kind` | string | `null` | Kind d'artifact (`file`/`html`) |
| `sync_scope` | string | `run` | `run` ou `loop` |

## Invariants

- Les artifacts sont tagges par `loopId` + `runId`.
- Un snapshot de run capture le manifest + blobs pour diff ulterieur.

