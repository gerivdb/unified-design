# Atom — MOX Validation

## Objectif

Garantir que tout artefact de gouvernance passe les probes MOX avant d'être promu.

## Probes

| Probe | Nom | Cible | Critère |
|-------|-----|-------|---------|
| **P-106** | Frontmatter Validator | PRD, ADR, EPIC, INTENT, REPORT, RPT, GUI, RUN | Frontmatter YAML valide et complet |
| **P-107** | Sections Obligatoires Validator | PRD, ADR, EPIC, INTENT, REPORT, RPT, GUI, RUN | Sections obligatoires présentes |

## Application

- **INTENT** : P-106 + P-107 sont obligatoires avant conversion PRD MOC
- **PRD MOC** : P-106 + P-107 sont obligatoires avant merge
- **ADR** : P-106 + P-107 sont obligatoires avant acceptation
- **EPIC** : P-106 + P-107 sont obligatoires avant activation

## Implémentation

- **Validateur** : `MOX/src/engines/probes.py`
- **CLI** : `mox validate-intent <path>` et `mox generate-prd-from-intent <path>`
- **Linter** : `REPO-STANDARDS/scripts/rss_lint.py --check-intent-continuity`

