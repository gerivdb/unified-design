# Governance Gate Script Atom

Pattern de script de validation de conformité écosystémique.

## Rôle

Vérifier qu'un dépôt, un fichier ou un PR respecte les règles de gouvernance :
- Frontmatter YAML valide (type, status, date, intent_hash)
- ADR backing pour décisions transverses
- Chemin conforme à la strate (L0-L5)
- IntentHash unique et référencé

## Structure canonique

```powershell
function Test-Frontmatter {
    param([string]$File)
    $content = Get-Content $File -Raw
    if ($content -notmatch '^---\n.*?\n---') { return $false }
    $yaml = $content -replace '^---\n.*?\n---', ''
    # Validate required fields
    return $yaml -match 'type:' -and $yaml -match 'status:' -and $yaml -match 'intent_hash:'
}

function Test-StratumPath {
    param([string]$Path)
    $strates = @("L0-CANON","L1-INFRA","L2-PLATFORM","L3-CITIZENS","L4-TOOLS","L5-ARCHIVE")
    foreach ($s in $strates) { if ($Path -like "*\$s\*") { return $true } }
    return $false
}
```

## Invariants

- Toute décision transverse NÉCESSITE un ADR accepted
- Le champ `intent_hash` DOIT être unique globalement
- Le chemin DOIT correspondre à la strate déclarée
- Les corrections automatiques DOIVENT être tracées

