# Run Lifecycle Atom

Capacite de design pour le lifecycle d'execution d'une loop.

## États

| État | Transition |
|------|-----------|
| `pending` | initial |
| `running` | declenche par scheduler/cron |
| `done` | succes |
| `error` | echec |

## Invariants

- Une loop CLOSED ne peut etre terminee que par un run EXEC.
- Les runs termines produisent un snapshot manifest + artifact files.

