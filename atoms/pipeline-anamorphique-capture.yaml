# Atom : pipeline-anamorphique-capture

## Contexte
Base sur les conversations capturees dans `CTULU/tools/pipeline-anamorphique/reports/conversations/`. Ce pattern capture les interactions utilisateur-assistant pour l'analyse de design.

## Structure des donnees capturees
```json
{
  "intent_hash": "0x...",
  "source": "kilo_code",
  "session_id": "ses_xxx",
  "timestamp": "2026-06-22T01:24:20.369543+00:00",
  "content": {
    "user": "Implemente le pipeline anamorphique complet",
    "assistant": "Je cree les 10 taches T001-T010 dans CTULU."
  },
  "concepts_detected": ["pipeline", "ctulu"],
  "friction_detected": false,
  "tool_calls": ["read", "write", "edit"],
  "metadata": {
    "repo": "ECOYSTEM",
    "agent": "OWL"
  }
}
```

## Pipeline de traitement
```
+-------------+
|  Capture    |
|  (session)  |
+------+------+
       |
       v
+-------------+
|  Parse      |
|  (JSON)     |
+------+------+
       |
       v
+-------------+
|  Extract    |
|  Concepts   |
+------+------+
       |
       v
+-------------+
|  Detect     |
|  Friction   |
+------+------+
       |
       v
+-------------+
|  Store in   |
|  WAL        |
+------+------+
       |
       v
+-------------+
|  Update     |
|  Ontology   |
+-------------+
```

## Types de conversations
- **implementation** : Demandes d'implementation de code
- **debug** : Problemes techniques a resoudre
- **design** : Questions architecturales
- **review** : Revues de code

## Frictions detectees
- **F001** : Ambiguite de la demande
- **F002** : Incoherence avec l'architecture existante
- **F003** : Probleme de contexte manquant
- **F004** : Conflit de patterns
- **F005** : Violation des regles de gouvernance
- **F006** : Échec de generation (0% succes)
- **F007** : Timeout
- **F008** : Ressources insuffisantes

## Exemple de conversation
```json
{
  "intent_hash": "0x2F35C94A811EC8C7",
  "source": "kilo_code",
  "session_id": "ses_004",
  "timestamp": "2026-06-22T01:24:33.364284+00:00",
  "content": {
    "user": "L'agent a push vers le mauvais repo. Le remote etait incorrect. Force push a ecrase CTULU.",
    "assistant": "Je restaure le working tree. Le git state etait incorrect. Conflit de contexte detecte."
  },
  "concepts_detected": [],
  "friction_detected": false,
  "tool_calls": ["bash", "git", "read"],
  "metadata": {
    "repo": "CTULU",
    "agent": "OWL"
  }
}
```