# Registry-Driven Orchestration Atom

Pattern d'orchestration d'operations sur N cibles via un registre central.

## Role

Éviter la duplication de code pour les operations repetees sur plusieurs depots :
- Definir les cibles dans un tableau de hashtables
- Boucler sur le registre pour appliquer l'operation
- Gerer les erreurs par cible sans arreter tout le pipeline

## Structure canonique

```powershell
$Repos = @(
    @{n="GOVERNANCE-HUB";p="D:\DO\WEB\TOOLS\L0-CANON\GOVERNANCE-HUB";b="main";s="L0"}
    @{n="BRAIN";p="D:\DO\WEB\TOOLS\L0-CANON\BRAIN";b="main";s="L0"}
    @{n="NEXUS";p="D:\DO\WEB\TOOLS\L1-INFRA\NEXUS";b="main";s="L1"}
)

foreach ($repo in $Repos) {
    Write-Host "[$($repo.n)] Processing..."
    try {
        $result = Invoke-Operation -Repo $repo
        Write-Host "[$($repo.n)] OK"
    } catch {
        Write-Host "[$($repo.n)] FAILED: $_"
    }
}
```

## Invariants

- Chaque entree du registre DOIT avoir : `n` (name), `p` (path), `b` (branch), `s` (stratum)
- Le registre DOIT etre triable par strate ou priorite
- Les erreurs DOIVENT etre isolees par cible
- Le script DOIT supporter un mode `-Quiet` pour filtering

## Exemples

| Script | Operations | Nb repos |
|--------|-----------|----------|
| `ecos-sync-audit.ps1` | pull/push/status | 47 |
| `ecos-health.ps1` | health-check | 47 |
| `ecos-registry.ps1` | registry listing | 47 |
| `ecos-classify.ps1` | classification | 47 |

