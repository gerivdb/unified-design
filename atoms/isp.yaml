# Atom : ISP (Interface Segregation Principle)

## Contexte
Principe SOLID : creez des interfaces specifiques aux clients plutot qu'attendus par tous.

## Application dans MDU
- **Interfaces CLI** : Chaque outil a son interface specifique
- **API citizens** : Chaque citizen expose seulement les methodes necessaires
- **Atomes** : Chaque atome a une interface coherente avec son role

## Detection des interfaces "gourmandes"
```bash
# Detecter les interfaces fat
ctulu detect-fat-interface --module src/wazaa_bus_citizens/
```

## Principes
1. **Interface client specifique** : Creez des interfaces pour chaque type de client
2. **Pas de force-dependency** : Les clients ne dependent que des methodes qu'ils utilisent
3. **Separation des responsabilites** : Chaque interface a un domaine fonctionnel

## Exemple
```yaml
# Mauvaise pratique (interface gourmande)
interface Citizen:
  methods: [read_memory, write_memory, route_message, validate_intent, ...]

# Bonne pratique (interfaces fines)
interface MemoryCitizen:
  methods: [read_memory, write_memory]

interface RouterCitizen:
  methods: [route_message]

interface ValidationCitizen:
  methods: [validate_intent]
```