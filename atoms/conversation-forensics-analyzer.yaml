# ATOM-CONVERSATION-FORENSICS-ANALYZER

> **IntentHash** : `0xATOM_CONVERSATION_FORENSICS_ANALYZER_20260920`  
> **Statut** : active  
> **Dépôt** : `gerivdb/unified-design`  
> **Màj requise si** : statut ADR passe à deprecated ou superseded  

---

## Description

Analyse forensique des conversations pour detecter frictions, bugs, ruptures de chaine.

## Intégration Artifact Extraction System

Cet atom intègre désormais le système d'extraction d'artefacts :

1. **Scan des candidats artefacts** : Outre `tool_calls`, `message_chains`, `error_patterns`, le scanner détecte également les `artifact_candidates` (designs, atoms, skills, pipelines, workflows).
2. **Classification** : Chaque artefact candidat est classé selon `ATOM-ARTIFACT-EXTRACTION-STATUS` (`nouveau | mise à jour | fusion | suppression | à confirmer`).
3. **Ancrage** : Chaque artefact est ancré à un passage de la conversation via `ATOM-CONVERSATION-ANCHORING`.
4. **Confiance** : Le niveau de confiance est évalué via `ATOM-CONFIDENCE-THRESHOLD` (certain / probable / hypothèse).
5. **Rapport** : Le rapport de sortie respecte le format `ATOM-EXTRACTION-REPORT-FORMAT`.

## Workflow

1. Scanner la conversation pour détecter les `artifact_candidates`
2. Pour chaque candidat :
   - Classer le statut (ATOM-ARTIFACT-EXTRACTION-STATUS)
   - Vérifier l'ancrage conversationnel (ATOM-CONVERSATION-ANCHORING)
   - Évaluer la confiance (ATOM-CONFIDENCE-THRESHOLD)
3. Produire le rapport standardisé (ATOM-EXTRACTION-REPORT-FORMAT)

