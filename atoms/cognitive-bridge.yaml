# Atom : cognitive-bridge

## Contexte
Base sur INTENT-007 BRAIN-WAZAA BRIDGE. Creation d'une boucle cognitive vivante ou les patterns recurrents alimentent BRAIN, qui publie des `brain.insight` consommables par l'ecosysteme.

## Fonctionnement
1. **Consommation d'evenements** : Abonne aux 6 evenements critiques WAZAA
2. **Stockage** : Chaque evenement stocke dans `BRAIN/cognitive_vectors/`
3. **Detection de pattern** : Si meme event_type > 3 occurrences en 24h
4. **Publication d'insight** : `brain.insight` avec `confidence_score` calcule

## Évenements consumes
```yaml
Consomme:
  - branch.naming.violation
  - branch.orphan.detected
  - branch.ghost.detected
  - scaffold.citizen.generated
  - scaffold.citizen.failed
  - intent.accepted
```

## Évenements publies
```yaml
Emits:
  - brain.insight
    payload: { pattern_type, frequency, repos_affected, suggested_action, confidence_score }
  - brain.pattern.new
    payload: { pattern_id, pattern_name, first_seen, occurrences, vector }
  - brain.alert
    payload: { severity: critical|warning, pattern_id, message }
```

