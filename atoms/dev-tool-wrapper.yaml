# Dev Tool Wrapper Atom

Pattern d'encapsulation d'outils CLI dans un script PowerShell unifie.

## Role

Reduire la friction d'acces aux outils ecosystemiques en fournissant :
- Un point d'entree unique (`ecos.ps1`, `kiva.ps1`, etc.)
- Une aide contextuelle par sous-commande
- Une validation des chemins avant execution
- Une gestion d'erreur coherente (`$ErrorActionPreference = "Stop"`)

## Structure canonique

```powershell
param(
    [Parameter(Position=0)][string]$Command = "help",
    [Parameter(Position=1)][string[]]$CommandArgs = @()
)

$ErrorActionPreference = "Stop"
$DEVTOOLS = "C:\DevTools"
$WEB_ROOT = "D:\DO\WEB"

function Show-Help { ... }
function Test-Paths { ... }
function Invoke-StatusCommand { ... }
# ... autres commandes

switch ($Command) {
    "status" { Invoke-StatusCommand }
    "health" { Invoke-HealthCommand }
    default { Show-Help; exit 1 }
}
```

## Invariants

- Tous les chemins DOIVENT etre absolus
- L'aide DOIT etre la commande par defaut
- Toute erreur DOIT etre trapee et loggee
- Le script NE DOIT PAS avoir d'effet de bord sans confirmation

## Exemples

| Wrapper | Chemin | Usage |
|---------|--------|-------|
| ECOS CLI | `C:\DevTools\bin\ecos.ps1` | `ecos status`, `ecos health` |
| KIVA CLI | `C:\DevTools\bin\kiva.ps1` | `kiva run`, `kiva stop` |
| Clapet | `C:\DevTools\bin\clapet.ps1` | `clapet open`, `clapet close` |

