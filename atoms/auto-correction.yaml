# Auto-Correction Atom

Pattern d'auto-correction intelligente.

## Role

Detecte et corrige automatiquement les incoherences :
- **Detecteur** : `friction_detector.py`
- **Correcteur** : `post_implement_check.py`
- **Auto-fix** : active par defaut
- **Review humaine** : optionnelle

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `detector` | string | `friction_detector` | Detecteur d'incoherences |
| `corrector` | string | `post_implement_check` | Correcteur automatique |
| `auto_fix` | bool | `true` | Correction automatique |
| `human_review_required` | bool | `false` | Review humaine requise |

## Invariants

- Les corrections automatiques DOIVENT etre tracees dans le WAL
- Une review humaine EST requise pour les changements critiques
- Le correcteur NE DOIT PAS introduire de nouvelles incoherences

## Exemple d'usage

```yaml
capabilities:
  - name: auto-correction
    parameters:
      detector: friction_detector
      corrector: post_implement_check
      auto_fix: true
      human_review_required: false
```

