# Fractal Recursion Atom

Pattern de recursion fractale auto-similaire.

## Role

Implemente la recursion fractale pour les requetes TQL :
- **Pattern** : auto-similaire
- **Operateurs** : 12 cognitifs
- **Short-circuit** : NEUTRE (evite l'explosion combinatoire)
- **Complexite** : O(DELTA)

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `pattern` | string | `self-similar` | Pattern de recursion |
| `operators` | int | `12` | Operateurs cognitifs |
| `short_circuit` | string | `NEUTRE` | Mode short-circuit |
| `max_depth` | int | `10` | Profondeur max |
| `complexity` | string | `O(DELTA)` | Complexite theorique |

## Invariants

- Le short-circuit NEUTRE EST obligatoire (ADR-0013)
- La profondeur max DOIT etre respectee
- La complexite DOIT rester O(DELTA)

## Exemple d'usage

```yaml
capabilities:
  - name: fractal-recursion
    parameters:
      pattern: self-similar
      operators: 12
      short_circuit: NEUTRE
      max_depth: 10
      complexity: O(DELTA)
```

