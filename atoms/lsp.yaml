# Atom : LSP (Liskov Substitution Principle)

## Contexte
Principe SOLID : les objets derives doivent etre interchangeables avec leurs objets de base sans alterer le comportement correct du programme.

## Application dans MDU
- **Citoyens** : Les citizens derives remplacent les bases sans rupture
- **Pipelines** : Les pipelines specialises remplacent les generiques
- **Atomes** : Les atomes specialises heritent des bases

## Verification
```bash
# Verifier LSP sur un pipeline
ctulu validate-lsp --pipeline trix-wal-atomic-writer
```

## Contrats comportementaux
- **Pre-conditions** : Les sous-types peuvent affaiblir les pre-conditions
- **Post-conditions** : Les sous-types peuvent renforcer les post-conditions
- **Exceptions** : Les sous-types ne doivent pas lever plus d'exceptions

## Exemple
```yaml
# Pipeline de base
pipeline-orchestrator:
  stages: [validate, execute, report]

# Pipeline specialise (LSP compliant)
trix-wal-atomic-writer:
  inherits: [pipeline-orchestrator]
  stages: [validate, atomic_write, wal_sync, report]  # Ajout sans rupture
```