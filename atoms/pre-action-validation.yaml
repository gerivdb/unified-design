# ATOM-048 -- Pre-Action Validation Protocol

## Contexte
L'IA annonce parfois des actions qu'elle ne peut pas executer faute de prealables valides. Ce protocole impose une sonde active avant toute declaration d'action.

## Regles

1. Ne jamais declarer une action sans avoir verifie sa capacite a l'executer.
2. Toujours sonder l'acces via MCP ou os.access() avant toute action.
3. Toujours utiliser des chemins absolus en bash (bash-cwd-persistence).
4. Toujours verifier le remote avant tout push (git-remote-safety).
5. Toujours verifier l'etat du workspace avant toute modification.

## Verification

La fonction can_execute(action, context) retourne True si et seulement si :
- Le chemin cible est dans allowedDirectories MCP (si lecture/ecriture fichier)
- Le chemin cible est accessible en bash (si execution commande)
- Le remote est configure (si push)
- La branche existe (si checkout/merge)

