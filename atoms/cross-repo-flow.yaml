# Cross-Repo Flow Atom

Pattern de base pour la formalisation des flux inter-depots.

## Role

Fournir un patron reutilisable pour documenter les dependances orientees entre depots :
- **Provider** : depot source du flux
- **Consumers** : depots consommateurs
- **Contrat** : interface et invariants du flux
- **Validation** : verification par le loop engine MDU
- **Cycle detection** : detection des dependances cycliques

## Structure canonique

```yaml
cross_repo_flow:
  name: <flow-name>
  provider: <repo-name>
  consumers: [<repo1>, <repo2>, ...]
  contract:
    interface: <API|file|event>
    format: <json|yaml|binary>
    version: <semver>
  validation:
    - contract_exists
    - no_cycle
    - consumer_registered
```

## Invariants

- Tout flux DOIT avoir un provider unique
- Tout flux DOIT avoir au moins un consumer
- Le contrat DOIT etre versionne et documente
- La detection de cycles DOIT etre obligatoire
- Le WAL DOIT tracer chaque flux

## Cycles interdits

```
PRIMUS -> CTULU -> PRIMUS        # INTERDIT
CITIZENS -> CTULU -> CITIZENS    # INTERDIT
PHOTON -> NEXUS -> PHOTON        # INTERDIT
```

## Validation

Le loop engine MDU DOIT :
1. Verifier que le provider possede l'atome de flux
2. Verifier que chaque consumer possede le contrat correspondant
3. Executer un DFS sur le graphe de flux pour detecter les cycles
4. Logger chaque flux dans le WAL

