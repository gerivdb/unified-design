# Roadmap Vector Atom

Pattern de vecteur de direction strategique par depot.

## Role

Chaque depot possede un fichier `ROADMAPS/vector.yaml` qui definit sa trajectoire strategique :
- horizon : periode couverte (ex: 90d)
- direction : liste des objectifs strategiques
- velocity_observed : velocite observee (0.0 = pas encore mesuree)
- mass : masse strategique (0.0-1.0)
- last_amended : date de derniere modification

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `horizon` | string | "90d" | Horizon temporel du vecteur |
| `direction` | list | `[]` | Objectifs strategiques |
| `velocity_observed` | float | 0.0 | Velocite observee |
| `mass` | float | 0.5 | Masse strategique |
| `last_amended` | datetime | - | Date de derniere modification |

## Invariants

- Tout depot actif DOIT avoir un vector.yaml dans ROADMAPS/
- Le champ `intent_hash` DOIT etre unique par version
- La velocite DOIT etre recalculee apres chaque sprint

## Exemple d'usage

```yaml
type: ROADMAP_VECTOR
version: '1.0'
intent_hash: 0XCANDIDATOR_ROADMAP_V1_20260626
date: '2026-06-26'
repo: gerivdb/CANDIDATOR
strate: L3-CITIZENS
vector:
  horizon: 90d
  direction:
    - 'maintenir role: Gestion candidatures, CV, lettres'
  velocity_observed: 0.0
  mass: 0.5
  last_amended: '2026-06-26T02:08:00.301966'
  _inferred: true
```

