# ATOM-ARTIFACT-EXTRACTION-STATUS

> **IntentHash** : `0xATOM_ARTIFACT_EXTRACTION_STATUS_20260920`  
> **Statut** : proposed  
> **Dépôt** : `gerivdb/unified-design`  
> **Màj requise si** : statut ADR passe à deprecated ou superseded  

---

## Description

Taxonomie de statut pour tout artefact détecté lors d'une extraction conversationnelle ou d'une analyse de design.

## Taxonomie

| Statut | Signification | Action par défaut |
|--------|---------------|-------------------|
| `nouveau` | Artefact inédit, absent du MDU | Créer fiche + valider par HITL |
| `mise à jour` | Artefact existant, à modifier | Ouvrir PR/feat branch |
| `fusion` | Doublon ou redondance à consolider | Fusionner vers artefact canonique |
| `suppression` | Artefact obsolète ou remplacé | Supprimer après vérification contenu |
| `à confirmer` | Détection incertaine | Valider HITL avant action |

## Règles de classification

1. **nouveau** : L'artefact n'a pas d'`intent_hash` existant dans `meta-design.yaml` > `designs` ou `atoms/`.
2. **mise à jour** : L'artefact existe mais ses champs (description, dépendances, bénéfices) doivent être révisés.
3. **fusion** : Deux artefacts couvrent le même concept ; l'un est canonique, l'autre devient alias.
4. **suppression** : L'artefact est obsolète, remplacé par un autre, ou son contenu est déjà absorbé.
5. **à confirmer** : La détection est probabiliste (< 0.6 confiance) ou manque d'ancrage conversationnel.

## Intégration MDU

- Référencé dans `meta-design.yaml` > `governance_atoms`
- Utilisé par `ATOM-CONFIDENCE-THRESHOLD` pour qualifier la confiance
- Couplé à `ATOM-CONVERSATION-ANCHORING` pour valider l'ancrage avant classification

