# Atom : design-principle

## Contexte
Atome parent pour tous les principes de conception logicielle. Les principes sont des lois fondamentales qui transcendent les langages et les paradigmes.

## Categories
- **SOLID** : SRP, OCP, LSP, ISP, DIP
- **DRY** : Don't Repeat Yourself
- **KISS** : Keep It Simple, Stupid
- **YAGNI** : You Aren't Gonna Need It
- **Architectural** : LoD, POLA, CoC

## Heritage
Les atomes principes heritent de `design-principle` :
- `srp`
- `lsp`
- `isp`
- `dip`
- `kiss`
- `yagni`
- `law-of-demeter`
- `principle-of-least-astonishment`
- `convention-over-configuration`

## Utilisation
```yaml
# Un atome peut declarer ses principes
capabilities:
  - name: pipeline-anamorphique
    principles_applied: [SRP, KISS, YAGNI]
```