# Scoped Loop Atom

Capacite de design pour le scope d'execution d'une loop.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `machine_id` | string | `null` | Machine d'execution |
| `team_id` | string | `null` | Team proprietaire |

## Invariants

- `machine_id` requis pour l'execution.
- `team_id` requis pour la propriete et le scope admin.
- Un run requiert un `machine_id` valide et online.

