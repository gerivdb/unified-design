# Atom : cluster-federation

## Contexte
Base sur EPIC-1221 WAZAA Bus Cluster Federation. Permet a plusieurs instances WAZAA Bus de former un cluster resilient avec synchronisation d'etat et basculement automatique.

## Architecture
```
WAZAA Bus (noeud 1) --+
WAZAA Bus (noeud 2) --+-- Gossip Network -- Leader Election
WAZAA Bus (noeud 3) --+
```

## Évenements importants
- `cluster.member.discovered` - Nouveau noeud rejoint
- `cluster.member.healthy` - Noeud en bonne sante
- `cluster.member.failed` - Noeud en panne
- `cluster.splitbrain.detected` - Detection split-brain
- `cluster.leaderelection.started` - Élection en cours
- `cluster.leaderelection.completed` - Élection terminee