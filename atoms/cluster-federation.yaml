# Atom : cluster-federation

## Contexte
Basé sur EPIC-1221 WAZAA Bus Cluster Federation. Permet à plusieurs instances WAZAA Bus de former un cluster résilient avec synchronisation d'état et basculement automatique.

## Architecture
```
WAZAA Bus (nœud 1) ──┐
WAZAA Bus (nœud 2) ──┼── Gossip Network ── Leader Election
WAZAA Bus (nœud 3) ──┘
```

## Événements importants
- `cluster.member.discovered` - Nouveau nœud rejoint
- `cluster.member.healthy` - Nœud en bonne santé
- `cluster.member.failed` - Nœud en panne
- `cluster.splitbrain.detected` - Détection split-brain
- `cluster.leaderelection.started` - Élection en cours
- `cluster.leaderelection.completed` - Élection terminée