# Closed Loop Goal Atom

Capacite de design pour les loops a goal ferme.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `goal` | string | `null` | Goal textuel de la loop |
| `require_completion_stamps` | bool | `true` | Exiger `completedAt` avant fermeture |

## Invariants

- `goal == null` => loop ouverte (OPEN).
- `goal != null` => loop fermee (CLOSED), execution pilotee par le goal.
- Suppression du goal => suppression automatique des stamps de completion.

