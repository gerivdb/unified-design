# Atom : Principle of Least Astonishment (POLA)

## Contexte
Principe de conception : un programmeur qui utilise votre code ne devrait pas etre surpris par son comportement.

## Application dans MDU
- **CLI** : Commandes intuitives et coherentes
- **API** : Comportement previsible
- **Atomes** : Nommage et comportement coherents

## Conventions du domaine
- **KiloCode** : Mode `architect` pour conception, `code` pour implementation
- **Git** : `git push` vs `git push --force`
- **YAML** : Indentation coherente, ordre des cles logique

## Verification
```bash
# Verifier POLA dans une API
ctulu validate-pola --api src/wazaa_bus_citizens/
```

## Principes
1. **Intuitivite** : Les API doivent etre faciles a prevoir
2. **Coherence** : Meme pattern = meme comportement
3. **Convention** : Suivre les conventions etablies

## Exemple
```yaml
# Mauvaise pratique (surprenant)
operations:
  create_repo: "creer un depot"
  delete_repo: "supprimer un depot"
  remove_repo: "effacer un depot"  # Incoherent!

# Bonne pratique (coherent)
operations:
  create_repo: "creer un depot"
  delete_repo: "supprimer un depot"
  remove_repo: "supprimer un depot (alias)"  # Meme sens, alias explicite
```