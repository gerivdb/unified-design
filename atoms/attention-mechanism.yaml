# Attention Mechanism Atom

Atome de design capturant les contraintes generiques d'un moteur d'attention
universelle, inspire du citizen `UAE` (L3-CITIZENS/N3).

## Capacites

| Capacite | Parametres | Description |
|----------|-----------|-------------|
| `universal-attention` | `scaling_factor`, `temperature` | Distribution d'attention sur entites |
| `multi-head` | `num_heads` | Support attention multi-tete |

## Regles de design

- `scaling-rule` : scaling par defaut `1/sqrt(d)`, ajustable.
- `head-independence` : chaque tete est independante et calculee en parallele.

## Contraintes

- Doit pouvoir etre integre dans un pipeline de bout en bout.
- Doit etre compatible avec des representations vectorielles de dimension variable.

