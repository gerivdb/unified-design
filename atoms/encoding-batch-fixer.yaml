# Atom : encoding-batch-fixer

## Contexte
Base sur la session `ses_demo_002` (INTENT-11103FA2F9EC7E92). Incident d'encodage cp1252 dans un fichier PowerShell. Ce pattern automatise la correction de ces problemes.

## Fonctionnalites
- **Detection automatique** : Analyse des fichiers pour identifier les encodages problematiques
- **Correction UTF-8** : Conversion vers UTF-8 sans perte de donnees
- **Gestion BOM** : Ajout/suppression du Byte Order Mark selon configuration
- **Normalisation line endings** : Conversion vers LF (Unix) ou CRLF (Windows)

## Workflow
```
+-------------+
|  Scan       |
|  (fichiers) |
+------+------+
       |
       v
+-------------+
|  Detect     |
|  Encoding   |
+------+------+
       |
       v
+-------------+
|  Validate   |
|  Content    |
+------+------+
       |
       v
+-------------+
|  Convert    |
|  to UTF-8   |
+------+------+
       |
       v
+-------------+
|  Verify     |
|  (checksum) |
+------+------+
       |
       v
+-------------+
|  Report     |
|  + Rollback |
+-------------+
```

## Commandes CLI
```bash
# Scanner les fichiers avec probleme d'encodage
ctulu scan-encodings --path ./src --format json

# Corriger les encodages en batch
ctulu fix-encodings --path ./src --target utf-8 --dry-run

# Appliquer les corrections
ctulu fix-encodings --path ./src --target utf-8 --apply
```

## Incidents traites
- **Incident 2026-06-22** : Fichier PowerShell corrompu `cp1252`
  - Message d'erreur : `UnicodeDecodeError: 'utf-8' codec can't decode byte 0xe9`
  - Solution : Conversion cp1252 -> UTF-8 avec preservation du contenu