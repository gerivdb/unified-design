# Atom : YAGNI (You Aren't Gonna Need It)

## Contexte
Principe de developpement : n'implementez pas de fonctionnalites que les utilisateurs n'ont pas demandees. Évitez l'optimisation prematuree et le code speculatif.

## Application dans MDU
- **Atomes** : Creez les atomes demandes par les besoins reels
- **Citizens** : Implementez les fonctionnalites demandees
- **Pipelines** : Ajoutez les etapes necessaires, pas possibles

## Regles
1. **Demande client** : Fonctionnalite doit etre demandee par un utilisateur
2. **Optimisation** : Ne profilez pas avant d'avoir un probleme
3. **Code speculatif** : Interdit - tout code doit avoir une utilite prouvee

## Verification
```bash
# Verifier YAGNI dans un module
ctulu validate-yagni --module src/wazaa_bus_citizens/
```

## Anti-patterns
- Code commente "pour plus tard"
- Methodes non utilisees
- Optimisations speculatives
- Fonctionnalites "peut-etre utiles"

## Exemple
```yaml
# Mauvaise pratique (code speculatif)
features:
  - name: advanced_search
    description: "Recherche avancee avec filtres complexes"
    status: implemented  # Jamais demande!

# Bonne pratique (reponds a un besoin)
features:
  - name: basic_search
    description: "Recherche par mot-cle"
    status: implemented  # Demande par l'utilisateur
```