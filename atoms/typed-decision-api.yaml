# Atom : typed-decision-api

## Contexte

Pattern d'ingénierie pour services de décision automatisée sur LLM local.
Défini par JEVX (gerivdb/JEVX) comme surcouche souveraine sur upstream LocalJev.

## Architecture

```
+-------------------+     +---------------------+     +-------------------+
|   Client SDK      | --> |  Typed Decision API | --> |  Upstream LLM     |
| (TypeSafe SDK)    |     |  (JEVX / Bun/Py)    |     | (Qwen3-0.6B /     |
+-------------------+     +---------------------+     |  LFM2.5-1.2B /    |
                                   |                   |  DiffusionGemma)  |
                                   v                   +-------------------+
                          +-------------------+
                          | Probability Engine |
                          | - normalize        |
                          | - entropy          |
                          | - confidence       |
                          +-------------------+
```

## Backends souverains (ENV2 / Z600 / WSL1)

| Backend | Modèle | RAM | Latence | WSL1 | Confiance | Usage recommandé |
|---------|--------|-----|---------|------|-----------|------------------|
| **minojev** | 547k params scalaire | < 100 Mo | 13–23 ms | ✅ direct | 90% | Décision minimale, routing, garde-fous |
| **NanoJev** | Qwen3-0.6B + 3 têtes | ~1.2 Go | 50–200 ms | ✅ direct | 85% | Décision standard (noul/choice/score) |
| **jevlike** | Scorer from scratch | < 1 Go | variable | ✅ direct | 80% | Scorer custom, calibration souveraine |
| **jev_local** | LFM2.5-1.2B Q8_0 | ~1.3 Go | 200–500 ms | ⚠️ patch | 70% | API compatible LocalJev, bridge upstream |
| **localjev** | DiffusionGemma 26B | > 16 Go | — | ❌ | 30% | **INCOMPATIBLE Z600** — pattern uniquement |

## Compromis backend

| Critère | minojev | NanoJev | jevlike | jev_local |
|---------|---------|---------|---------|-----------|
| Vitesse | excellente | bonne | variable | moyenne |
| Précision | limitée | bonne | calibrée | bonne |
| RAM | minimale | faible | faible | faible |
| WSL1 | natif | natif | natif | patch requis |
| Souveraineté | totale | totale | totale | totale |
| Calibration | auto | auto | custom | auto |

## Déploiement WSL1

```
Runtimes préférés :
- Python 3.12 + llama.cpp (AVX1, statique) pour backends légers
- Bun 1.2+ optionnel pour compatibilité JEVX upstream

Isolation :
- chroot / proot pour dépendances Python si nécessaire
- llama.cpp compilé avec -mavx (AVX1) sans -mavx2
```

## Principes

1. **Souveraineté** : le wrapper local est le seul point de sortie décisionnel
2. **Wire compatibility** : compatible TypeSafe SDK, mais non-équivalent mathématiquement à OpenJev logit read
3. **Calibration requise** : les probabilités sont auto-rapportées par le modèle ; calibration externe requise
4. **Retry malformed** : toute sortie JSON invalide déclenche une correction contextuelle
5. **Deterministic seed** : SHA256(state + questions) pour reproductibilité
6. **Backend selector** : le choix du backend est configuré par cas d'usage, pas par défaut unique
7. **Security guardrails** : toute décision automatisée sur action risquée nécessite consensus + seuil de confiance + HITL possible

## Types de questions

### noul (yes/no)
```json
{
  "type": "noul",
  "instructions": "Is this a billing issue?",
  "criteria": {
    "true": "Payment or subscription problems",
    "false": "Other types of issues"
  }
}
```
→ Sortie : probabilité scalaire [0, 1]

### choice (classification)
```json
{
  "type": "choice",
  "instructions": "Which team should handle this?",
  "criteria": {
    "billing": "Payment issues",
    "technical": "Bugs or integration",
    "sales": "Pricing questions"
  }
}
```
→ Sortie : vecteur de probabilités [p_billing, p_technical, p_sales] somme = 1

### score (échelle)
```json
{
  "type": "score",
  "instructions": "How frustrated is the customer?",
  "criteria": ["Calm", "Frustrated but civil", "Very angry"]
}
```
→ Sortie : score pondéré + vecteur de probabilités

## Calcul de confiance entropique

```
entropy = -sum(p_i * log(p_i))
confidence = 1 - entropy / log(n)
```

| Confiance | Interprétation |
|-----------|----------------|
| 0.8 - 1.0 | Haute confiance |
| 0.5 - 0.8 | Confiance modérée |
| 0.0 - 0.5 | Faible confiance (distribution uniforme) |

## Contrat de sortie

```json
{
  "answers": {
    "department": {
      "type": "choice",
      "choice": "billing",
      "probabilities": { "billing": 0.92, "technical": 0.06, "sales": 0.02 },
      "confidence": 0.94
    },
    "frustration": {
      "type": "score",
      "score": 1.4,
      "legend": { "0": "Calm", "1": "Frustrated but civil", "2": "Very angry" },
      "probabilities": { "0": 0.15, "1": 0.70, "2": 0.15 },
      "confidence": 0.65
    },
    "urgent": {
      "type": "noul",
      "noul": 0.87
    }
  }
}
```

