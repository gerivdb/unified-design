# Atom : SRP (Single Responsibility Principle)

## Contexte
Principe SOLID fondamental : chaque module, classe ou fonction a une seule responsabilite et une seule raison de changer.

## Application dans MDU
- **Modules** : Chaque citizen a un role unique (memory, routing, validation)
- **Fonctions** : Chaque outil CLI a une seule fonction
- **Designs** : Chaque atome a un domaine fonctionnel clair

## Verification
```bash
# Verifier qu'un module n'a qu'une responsabilite
ctulu validate-srp --module src/wazaa_bus_citizens/memory_citizen.py
```

## Anti-patterns
- Module avec plusieurs responsabilites (ex: memory + routing + validation)
- Fonction qui fait plusieurs choses
- Classe avec plusieurs raisons de changer