# ATOM-045 -- Structural Relations MDU

Le MDU dispose d'une hiérarchie verticale (`inherits`) mais pas de relations horizontales explicites entre noeuds de même niveau. Les concepts `loop-engineering`, `chain-engineering`, `circuit-breaker-pattern` et `conflict-resolver-pattern` forment des paires binaires qui stabilisent l'architecture sans être formalisées.

## Décision

Introduire 7 kinds de relations structurelles optionnelles dans les métadonnées YAML des designs et atomes :

| Kind | Sémantique | Symétrie | Acyclicité |
|------|-----------|----------|----|
| `opposes` | Opposition conceptuelle | Oui | Oui |
| `complements` | Complémentarité fonctionnelle | Oui | Oui |
| `inherits` | Héritage MDU | Non | Oui |
| `requires` | Dépendance sémantique | Non | Oui |
| `blocks` | Blocage structurel | Non | Oui |
| `stabilizes` | Stabilisation asymétrique | Non | Non |
| `supersedes` | Remplacement/dépréciation | Non | Oui |

## Règles

- `opposes` et `complements` sont symétriques par défaut.
- `stabilizes` et `supersedes` sont asymétriques : le validateur rejette la symétrie déclarée.
- Aucun cycle n'est toléré dans `blocks` ni `supersedes`.
- Le champ est optionnel ; absence = pas de relation horizontale déclarée.

## Utilisation

```yaml
structural_relations:
  - kind: opposes
    target: pattern-x
  - kind: complements
    target: pattern-y
  - kind: supersedes
    target: design-old
```

## Validation

Le validateur `plix validate --structural` vérifie :
1. Les kinds déclarés sont dans la liste autorisée.
2. La symétrie de `opposes`/`complements` est respectée.
3. L'asymétrie de `stabilizes`/`supersedes` est respectée.
4. Aucun cycle `blocks`/`supersedes` n'existe dans le graphe.

