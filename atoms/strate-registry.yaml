# Strate Registry Atom

Capacite de design definissant la classification hierarchique des depots.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `strates` | dict | {} | Classification L0-L5 avec regles |
| `global_rules` | list | [] | Regles de gouvernance transverses |

## Invariants

- Chaque depot doit appartenir a exactement une strate
- Les regles de gouvernance sont strictes par strate
- Les modifications de strate necessitent un ADR

## Exemple d'usage

```yaml
capabilities:
  - name: strate-registry
    parameters:
      strates:
        L0_CANON:
          max_repos: 10
        L4_TOOLS:
          max_repos: 50
      global_rules:
        - "TOPOS/topology.yaml est la SOT"
```

