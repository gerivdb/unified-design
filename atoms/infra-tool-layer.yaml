# Infra Tool Layer Atom

Couche infrastructurelle DevTools vers les consommateurs operationnels.

## Role

Documenter et valider le flux d'outils operationnels depuis `gerivdb/DevTools` vers :
- **CTULU** : scheduled tasks, scripts utilitaires
- **ECOS-CLI** : point d'entree CLI unifie (`ecos.ps1`)
- **BRAIN** : integration des managers via scripts

## Structure canonique

```yaml
cross_repo_flow:
  name: infra-tool-layer
  provider: DevTools
  consumers: [CTULU, ECOS-CLI, BRAIN]
  tool_categories:
    - cli_wrapper: ecos.ps1, kiva.ps1, clapet.ps1
    - build_pipeline: Makefile
    - sync_orchestrator: ecos-sync.ps1, ecos-sync-audit.ps1
    - test_runner: cross-repo-test.ps1
    - ci_pipeline: .github/workflows/
    - security_fabric: SecurityManager.ps1
    - mcp_diagnostics: verify-mcp-access.ps1
  jurisdiction_rule: no_primus_dependency
```

## Invariants

- DevTools NE DOIT PAS importer PRIMUS (regle de juridiction)
- DevTools fournit des scripts **operationnels**, pas de la logique metier
- CTULU reference DevTools pour les scheduled tasks
- ECOS-CLI est le point d'entree unique vers tous les outils DevTools
- BRAIN consomme DevTools via les managers synchronises

## Validation

Le loop engine MDU DOIT verifier :
1. `DevTools` possede l'atome `infra-tool-provider`
2. Aucun consommateur ne depend de PRIMUS via DevTools
3. Les chemins des scheduled tasks sont valides

## Exemples

| Outil | Categorie | Consumer | Usage |
|-------|-----------|----------|-------|
| `ecos.ps1` | cli_wrapper | ECOS-CLI | Point d'entree unifie |
| `ecos-sync-audit.ps1` | sync_orchestrator | CTULU | Audit 47 repos |
| `verify-mcp-access.ps1` | mcp_diagnostics | CTULU | Diagnostic MCP |
| `Makefile` | build_pipeline | BRAIN | Build multi-langage |

