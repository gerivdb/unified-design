# Registry Sync Atom

Flux de synchronisation du registre citoyens vers les miroirs.

## Role

Documenter et valider le flux de synchronisation depuis `gerivdb/CITIZENS` vers :
- **CTULU** : miroir `src/citizens/citizens.yaml`
- **TINA** : copie locale `CITIZENS.yaml`
- **BRAIN** : consommation du registre
- **Kilo Agent** : routage des commandes

## Structure canonique

```yaml
cross_repo_flow:
  name: registry-sync
  provider: CITIZENS
  mirrors:
    - repo: CTULU
      path: src/citizens/citizens.yaml
      mode: push
    - repo: TINA
      path: CITIZENS.yaml
      mode: push
    - repo: BRAIN
      path: CITIZENS.yaml
      mode: pull
    - consumer: Kilo Agent
      mode: read
  source_of_truth: CITIZENS.yaml
```

## Invariants

- `CITIZENS.yaml` est la **source de verite** unique
- Les miroirs DOIVENT etre en lecture seule sauf pour le provider
- La synchronisation DOIT etre tracee dans WAL
- Tout ecart entre source et miroir DOIT generer une alerte

## Validation

Le loop engine MDU DOIT verifier :
1. `CITIZENS` possede l'atome `registry-source`
2. Chaque miroir declare possede le contrat de synchronisation
3. Aucun miroir ne peut ecrire dans la source de verite

## Exemples

| Mirror | Path | Mode | Frequence |
|--------|------|------|-----------|
| CTULU | `src/citizens/citizens.yaml` | push | temps reel |
| TINA | `CITIZENS.yaml` | push | temps reel |
| BRAIN | `CITIZENS.yaml` | pull | a la demande |
| Kilo Agent | memoire/routage | read | chaque session |

