# Absolute Rules Enforcement Atom

Pattern de regles absolues avec enforcement automatique.

## Role

Definit des interdictions et obligations categoriques, avec un systeme de tags pour marquer les hypotheses non confirmees.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `forbidden_keywords` | list | `[]` | Mots-cles declenchant un blocage |
| `auto_tags` | list | `[]` | Tags appliques automatiquement (ex: [HYPOTHESE_NON_CONFIRMEE], [DERIVE]) |

## Invariants

- Toute regle absolue est verifiee par un hook pre-commit/pre-push.
- Les derogations doivent etre tracees via un ADR.
- Les donnees non validees sont systematiquement taggees.

## Exemple d'usage

```yaml
inherits:
  - absolute-rules-enforcement
```

