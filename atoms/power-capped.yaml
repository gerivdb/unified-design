# Power Capped Atom

Capacite de design imposant une limite de consommation de puissance.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `max_power_w` | int | `150` | Puissance maximale autorisee (W) |

## Invariants

- Toute inference ou operation materielle doit respecter `max_power_w`.
- En cas de depassement, le design doit inclure un mecanisme de regulation (ex:Dynamic Voltage Scaling, throttling).

## Exemple d'usage

```yaml
capabilities:
  - name: power-capped
    parameters:
      max_power_w: 12
```

