# MCP Fix Diagnostics Atom

Pattern de diagnostic et réparation automatique des serveurs MCP.

## Rôle

Maintenir la connectivité MCP opérationnelle :
- Vérifier la disponibilité de chaque serveur MCP
- Redémarrer les serveurs en échec
- Logger les interventions pour audit
- Watchdog automatique avec seuil de panne

## Structure canonique

```powershell
# verify-mcp-access.ps1
$servers = @("filesystem","github","notion","memory")
foreach ($server in $servers) {
    $status = Test-McpConnection -Server $server
    if (-not $status) {
        Write-Warning "[MCP] $server down, restarting..."
        Restart-McpServer -Server $server
        Log-McpIntervention -Server $server -Action "restart"
    }
}
```

## Invariants

- Toute intervention DOIT être loggée avec timestamp et action
- Le redémarrage DOIT être limité à N tentatives avant escalade
- Le mode `-Fix` DOIT être explicite (pas de auto-fix silencieux)
- Le status DOIT inclure : uptime, last_error, restart_count

