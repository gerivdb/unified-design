# Gated Boot Sequence Atom

Pattern de sequence de boot ordonnee par gates.

## Role

Definit une sequence d'etapes obligatoires pour initialiser un sous-systeme ou une session multi-repo.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `gates` | list | `[]` | Liste ordonnee des gates (ex: BOOT-0, BOOT-1, ..., BOOT-7) |

## États

| État | Description |
|------|-------------|
| `BOOT-0` | Friction Sensor + Stub Detector |
| `BOOT-1` | Sonde ENV (env-capability-probe) |
| `BOOT-2` | Sonde outils (devtools-probe) |
| `BOOT-3` | Audit branches |
| `BOOT-4` | Audit remotes |
| `BOOT-5` | Verification SOT |
| `BOOT-6` | Pre-merge gate |
| `BOOT-7` | Cloture (session-closeout D5) |

## Invariants

- BOOT-1 + BOOT-4 + BOOT-7 sont obligatoires pour toute session.
- BOOT-2/3/5/6 sont optionnels pour les sessions atomiques (< 2 repos).
- Si friction > 0.7 ou stub_count > 0 -> STOP.

## Exemple d'usage

```yaml
inherits:
  - gated-boot-sequence
```

