# GPU Decoder Atom

Decodeur GPU multi-backend pour PLIX Suite.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `wrapper` | string | `nvdec_wrapper` | Backend CUDA/NVDEC |
| `build` | list | [] | Scripts de build |
| `exports` | list | [] | Bibliotheques exportees |
| `runtime` | list | [] | Dependances runtime CUDA |

## Backends supportes

- **NVDEC_DLL** : NVIDIA NVDEC hardware decode (<5ms cible)
- **NVDEC_PYAV** : PyAV/FFmpeg avec CUDA hwaccel (~15ms)
- **OPENCV** : CPU fallback (valide ~15ms)

