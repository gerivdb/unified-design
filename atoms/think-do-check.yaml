# Think-Do-Check Atom

Pattern de paradigme ternaire Think-Do-Check.

## Role

Structure les requetes TQL en 3 phases ternaires :
- **THINK** : diagnostic, vision, recherche
- **DO** : acquis, besoin, strategie
- **CHECK** : ecart, revision, alignement

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `phases` | dict | - | Phases du paradigme |
| `recursion` | bool | `true` | Recursion auto-similaire |
| `max_depth` | int | `10` | Profondeur max |

## Invariants

- Chaque phase DOIT avoir 3 sous-phases
- La recursion EST optionnelle mais recommandee
- La profondeur max DOIT etre respectee

## Exemple d'usage

```yaml
capabilities:
  - name: think-do-check
    parameters:
      phases:
        think: [diagnostic, vision, recherche]
        do: [acquis, besoin, strategie]
        check: [ecart, revision, alignement]
      recursion: true
      max_depth: 10
```

