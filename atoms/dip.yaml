# Atom : DIP (Dependency Inversion Principle)

## Contexte
Principe SOLID : les modules de haut niveau ne dependent pas des modules de bas niveau, mais des abstractions. Les abstractions ne dependent pas des implementations, les implementations dependent des abstractions.

## Application dans MDU
- **Citizens** : Les citizens dependent des interfaces, pas des implementations
- **Pipelines** : Les pipelines orchestrent via abstractions, pas d'implementations concretes
- **Atomes** : Les atomes dependent des abstractions de design

## Architecture en couches
```
+---------------------------------------------+
|              Haut Niveau                   |
|  (orchestrateur, pipeline, agent)          |
+---------------------------------------------+
|              Abstraction                     |
|  (interface, contrat, schema)              |
+---------------------------------------------+
|              Bas Niveau                      |
|  (implementation concrete)                 |
+---------------------------------------------+
```

## Verification
```bash
# Verifier DIP dans un module
ctulu validate-dip --module src/wazaa_bus_citizens/orchestrator.py
```

## Exemple
```yaml
# Mauvaise pratique
class Orchestrator:
    def __init__(self):
        self.memory = MemoryCitizen()  # Dependance concrete
        self.router = RouterCitizen()  # Dependance concrete

# Bonne pratique
class Orchestrator:
    def __init__(self, memory: MemoryInterface, router: RouterInterface):
        self.memory = memory  # Dependance abstraite
        self.router = router  # Dependance abstraite
```