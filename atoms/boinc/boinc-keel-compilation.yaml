# ATOM-BOINC-KEEL-COMPILATION - Compilation IR ternaire distribuee via KEEL-CORE
# Version: 1.0.0
# IntentHash: 0xATOM_BOINC_KEEL_COMPILATION_20260726
# Source: DESIGN-BOINC-001 (BOINC-LLM-P2P Governor F5)

atom:
  id: ATOM-BOINC-KEEL-COMPILATION
  name: "BOINC -> KEEL Compilation"
  category: "compilation/keel"
  status: active
  version: "1.0.0"
  description: |
    Compilation distribuee d'IR ternaire (base-243) via KEEL-CORE.
    Validation phi-CPS automatique, output base243 blob pour execution P2P.
  intent_hash: "0xATOM_BOINC_KEEL_COMPILATION_20260726"
  layer: L2_COMPOSITION
  governance: BOUNC-ADR-0022

parameters:
  - name: payload
    type: object
    required: true
    description: "Payload de compilation (source, target, optimisations)"
  - name: intent_hash
    type: string
    required: true
    description: "IntentHash pour tracabilite KEEL"
  - name: optimization_level
    type: string
    required: false
    default: "O2"
    enum: ["O0", "O1", "O2", "O3", "Os"]
    description: "Niveau d'optimisation KEEL"

returns:
  - name: phi_valid
    type: boolean
    description: "True si phi-CPS >= seuil (4.5 par defaut)"
  - name: base243_blob
    type: string
    description: "Blob binaire base-243 pret pour execution"

dependencies:
  - ATOM-KEEL-CORE
  - ATOM-PHONON-PLIX-CODEC
  - ATOM-BOINC-KIVA-ORCHESTRATION

validation:
  - rule: "phi_valid == true"
    severity: error
    message: "Compilation rejetee: phi-CPS insuffisant"

references:
  - "design.yaml: ATOM-BOINC-KEEL-COMPILATION"
  - "ADR-0022-boinc-llm-p2p.md"
  - "unified-design/atoms/phi-cps-regression-guard.yaml"