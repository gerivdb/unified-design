# Atom : git-remote-safety

## Contexte
Basé sur la session `ses_004` (INTENT-2F35C94A811EC8C7). Incident de force push vers le mauvais repo avec écrasement de CTULU. Ce protocole prévient ce type d'erreur.

## Protocol obligatoire avant chaque push

### Étape 1 — Vérifier le remote
```bash
git remote -v
```
→ Vérifier que le remote correspond au repo attendu
→ Si mismatch → `git remote set-url origin <url_correcte>`

### Étape 2 — Vérifier la branche
```bash
git branch
```
→ Si HEAD détaché → `git checkout -B main HEAD`

### Étape 3 — Vérifier l'historique distant
```bash
git log origin/main --oneline -5
```
→ Vérifier que le distant n'a pas été écrasé

### Étape 4 — Push SANS force
```bash
git push origin main
```
→ Ne JAMAIS utiliser `--force` sans vérification

### Étape 5 — En cas de force push
```bash
# UNIQUEMENT si les étapes 1-3 sont OK ET intentionnel
git push --force origin <commit_sha>:main
```

## Anti-patterns bloquants
- `git push --force` sans vérifier `git remote -v`
- `git push` sans vérifier `git branch`
- Changer de repo sans utiliser `workdir` ou des chemins absolus

## Incidents connus
- **Incident 2026-06-22** : Force push accidentel vers mauvais repo (TRIX→CTULU)
  - Remote incorrect : `origin = git@github.com:gerivdb/TRIX.git` au lieu de `CTULU.git`
  - Résolution : Restauration via WAL et récupération des commits perdus