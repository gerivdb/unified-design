# Atom : git-remote-safety

## Contexte
Base sur la session `ses_004` (INTENT-2F35C94A811EC8C7). Incident de force push vers le mauvais repo avec ecrasement de CTULU. Ce protocole previent ce type d'erreur.

## Protocol obligatoire avant chaque push

### Étape 1 - Verifier le remote
```bash
git remote -v
```
-> Verifier que le remote correspond au repo attendu
-> Si mismatch -> `git remote set-url origin <url_correcte>`

### Étape 2 - Verifier la branche
```bash
git branch
```
-> Si HEAD detache -> `git checkout -B main HEAD`

### Étape 3 - Verifier l'historique distant
```bash
git log origin/main --oneline -5
```
-> Verifier que le distant n'a pas ete ecrase

### Étape 4 - Push SANS force
```bash
git push origin main
```
-> Ne JAMAIS utiliser `--force` sans verification

### Étape 5 - En cas de force push
```bash
# UNIQUEMENT si les etapes 1-3 sont OK ET intentionnel
git push --force origin <commit_sha>:main
```

## Anti-patterns bloquants
- `git push --force` sans verifier `git remote -v`
- `git push` sans verifier `git branch`
- Changer de repo sans utiliser `workdir` ou des chemins absolus

## Incidents connus
- **Incident 2026-06-22** : Force push accidentel vers mauvais repo (TRIX->CTULU)
  - Remote incorrect : `origin = git@github.com:gerivdb/TRIX.git` au lieu de `CTULU.git`
  - Resolution : Restauration via WAL et recuperation des commits perdus