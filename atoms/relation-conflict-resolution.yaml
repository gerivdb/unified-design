    - requires_blocks_cycle: "cycle mixte requires/blocks (ex: A requires B, B requires C, C blocks A)"
    - multiple_relations_same_target: "plusieurs relations différentes (opposes, complements, blocks, requires, stabilizes) d'un même noeud vers une même cible"
    - incompatible_symmetry: "une relation déclarée symétrique alors que le kind est asymétrique (déjà couvert par ATOM-045, mais on le rappelle)"
  resolution_strategies:
    - manual: "L'utilisateur doit corriger les déclarations ; aucune résolution automatique n'est appliquée."
  validation: yaml_frontmatter_only
references:
