# Constitutional SOT Atom

Pattern d'une source de verite constitutionnelle (ex: GOVERNANCE-HUB).

## Role

Definit les regles immuables de l'ecosysteme, maintient une hierarchie de documents et expose un mecanisme de boot canonique.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `boot_gates` | list | `[]` | Sequence ordonnee des gates de boot (ex: GATE-0 -> GATE-1b.9) |
| `required_files` | list | `[]` | Fichiers constitutionnels obligatoires (ex: AGENT_RAM.yaml, known_repositories.yaml) |

## Invariants

- Aucune action sur L3+ ne peut etre entreprise sans L0 charge.
- Les donnees non validees sont taggees `[DERIVE]` ou `[HYPOTHESE_NON_CONFIRMEE]`.
- Le boot sequence est obligatoire avant toute session multi-repo.

## Exemple d'usage

```yaml
inherits:
  - constitutional-sot
```

