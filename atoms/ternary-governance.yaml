# Ternary Governance Atom

Pattern de gouvernance base sur des trits ternaires.

## Role

Structure les decisions via des trits {-1, 0, +1}, definit des organes de vote et des mecanismes d'escalade.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `trits` | list | `[-1, 0, +1]` | Valeurs possibles d'un trit |
| `quorum` | int | `null` | Nombre minimum de votants pour valider une decision |

## Invariants

- Toute decision architecturale est tracee via un ADR.
- Les conflits inter-couches (N+1/N+2/N+3/N+4) sont arbitres par N+4.
- Aucune modification de repo N+1 sans ADR backing.

## Exemple d'usage

```yaml
inherits:
  - ternary-governance
```

