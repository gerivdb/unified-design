# Maxwell Triad Atom

Triade semantique commune audio+video : Entropie, Gradient, Symetrie.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| signal_types | list | [video, audio] | Signaux supportes |
| metric | string | shannon | Metrique entropie |
| diff_order | int | 1 | Ordre derivation |
| invariant | string | energy | Invariant conserve |

## Invariants

- Entropie -> SPIDX
- Gradient -> PIANO-DIFF
- Symetrie -> Fractal kernel
- Conservation energie : E(t) = E(0)

