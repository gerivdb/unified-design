# Photon Pipeline Atom

Pipeline de chunking semantique PHOTON vers les consommateurs.

## Role

Documenter et valider le pipeline de preprocessing semantique :
- **PHOTON** : detection des frontieres semantiques et chunking
- **TRIX** : contenant naturel, sous-module git (`TRIX/tools/photon/`)
- **NEXUS** : indexation des chunks via API REST
- **CTULU** : execution des intents PHOTON

## Structure canonique

```yaml
cross_repo_flow:
  name: photon-pipeline
  provider: PHOTON
  consumers: [TRIX, NEXUS, CTULU]
  stages:
    - detect_semantic_boundary
    - chunk
    - validate_ontology
    - push_nexus
  formats:
    input: markdown|html|code
    output: chunk_json
  integration:
    trix: submodule
    nexus: rest_api_v1
    ctulu: intent_executor
```

## Invariants

- PHOTON DOIT fournir des chunks **semantiquement coherents**
- TRIX DOIT embarquer PHOTON comme sous-module optionnel
- NEXUS DOIT valider le format de chunk avant indexation
- CTULU DOIT executer les intents PHOTON via le pipeline canonique
- Aucun chunk ne DOIT traverser les frontieres de repo sans metadonnees

## Validation

Le loop engine MDU DOIT verifier :
1. `PHOTON` possede l'atome `semantic-chunking-provider`
2. `TRIX` possede l'atome `photon-submodule-consumer`
3. `NEXUS` possede l'atome `chunk-indexing-consumer`
4. Aucune dependance cyclique n'existe

## Exemples

| Stage | Outil | Repo | Format |
|-------|-------|------|--------|
| Detection frontiere | `detect_semantic_boundary.py` | PHOTON | Python |
| Chunking | `photon_triage.py` | PHOTON | JSON |
| Validation | `ontology_validator.py` | PHOTON | YAML |
| Indexation | `nexus_connector.py` | PHOTON | REST API |

