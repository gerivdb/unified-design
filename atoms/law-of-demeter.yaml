# Atom : Law of Demeter (LoD)

## Contexte
Principe de conception : "ne parlez qu'aux amis directs". Un objet ne doit pas connaitre la structure interne d'autres objets.

## Application dans MDU
- **Citizens** : Chaque citizen expose ses methodes directes
- **Atomes** : Les atomes communiquent via des interfaces bien definies
- **Pipelines** : Les etapes communiquent via des donnees, pas par navigation

## Regles
1. **Methode** : Une methode peut appeler :
   - Ses propres methodes
   - Methodes de ses parametres
   - Methodes des attributs immediats
   - Methodes des objets crees localement

2. **Navigation** : Chaine limitee a 3 niveaux max

## Anti-patterns
- `user.getOrder().getItems().get(0).getName()` [KO]
- `config.getDatabase().getConnection().getStats()` [KO]

## Bonnes pratiques
- **Facade** : Creer des methodes delegantes
- **Builder** : Utiliser des builders pour la construction
- **Service** : Inverser la dependance

## Exemple
```python
# Mauvaise pratique (violation LoD)
class OrderProcessor:
    def process(self, user):
        order = user.getProfile().getPreferences().getDefaultOrder()
        items = order.getItems()
        total = 0
        for item in items:
            total += item.getPrice() * item.getQuantity()
        return total

# Bonne pratique (respect LoD)
class OrderProcessor:
    def process(self, user):
        order = self.get_default_order(user)
        return self.calculate_total(order)
    
    def get_default_order(self, user):
        return user.get_default_order()
    
    def calculate_total(self, order):
        return order.get_total()
```