# Test Runner Atom

Pattern d'orchestration de tests multi-framework.

## Role

Uniformiser l'execution des tests across langages :
- **pytest** pour Python (coverage, async, fixtures)
- **Pester** pour PowerShell (mocks, Should assertions)
- **zig test** pour Zig (std.testing)
- **Coverage** consolide (HTML + XML + console)
- **Integration CI** : pipeline `deps -> build -> test -> lint`

## Structure canonique

```powershell
# test-runner.ps1
param(
    [ValidateSet("unit","integration","e2e","performance")][string]$Mode = "unit",
    [switch]$Coverage,
    [switch]$Parallel
)

if ($Mode -eq "unit") {
    pytest tests/ -v --cov=src/ --cov-report=html
    Invoke-Pester -Script tests/unit.tests.ps1
}

if ($Mode -eq "integration") {
    pytest tests/integration/ -v --cov=src/
    zig test src/runner.zig
}
```

## Invariants

- Les tests DOIVENT etre isoles par framework (pas de mix pytest/Pester dans meme process)
- Le coverage DOIT etre exige pour les PRs
- Les tests e2e DOIVENT etre marques et optionnels en CI
- Le timeout DOIT etre par test, pas global

