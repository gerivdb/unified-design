# Stratified Repository Registry Atom

Pattern de registre de depots organise par strates logiques.

## Role

Maintient une cartographie des repos par strates (L0-L9) avec validation d'appartenance et chemins locaux normalises.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `strata` | list | `[]` | Liste des strates valides (ex: L0-CANON, L1-INFRA, L4-TOOLS) |
| `registry_file` | string | `null` | Chemin du fichier registre (ex: known_repositories.yaml) |

## Invariants

- Chaque repo possede un `local_path` conforme a sa strate.
- Aucun clone hors strate n'est autorise (regle `hitl-clone-gate`).
- Le registre est la Source of Truth (SOT) - l'API GitHub n'est utilisee que pour lecture.

## Exemple d'usage

```yaml
inherits:
  - stratified-repository-registry
```

