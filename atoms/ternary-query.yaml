# Ternary Query Atom

Pattern de langage de requete fractal ternaire.

## Role

Langage de requete pour NEXUS base sur le paradigme ternaire :
- **Paradigme** : Think-Do-Check
- **Recursion** : auto-similaire, max_depth=10
- **Short-circuit** : NEUTRE (ADR-0013)
- **Operateurs** : 12 cognitifs

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `paradigm` | string | `Think-Do-Check` | Paradigme de requete |
| `recursion` | bool | `true` | Recursion auto-similaire |
| `max_depth` | int | `10` | Profondeur max de recursion |
| `short_circuit` | string | `NEUTRE` | Mode short-circuit |
| `operators` | int | `12` | Nombre d'operateurs cognitifs |

## Invariants

- La recursion DOIT avoir une profondeur max
- Le short-circuit NEUTRE EST obligatoire (ADR-0013)
- Les operateurs DOIVENT etre couverts par les tests

## Exemple d'usage

```yaml
capabilities:
  - name: ternary-query
    parameters:
      paradigm: Think-Do-Check
      recursion: true
      max_depth: 10
      short_circuit: NEUTRE
      operators: 12
```

