# SPIDX Atom

Index sparse pour les coefficients non-nuls d'un signal Q243.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| max_coefficients | int | 1000000 | Nombre max de coefficients indexes |
| compression_ratio | int | 10 | Ratio de compression attendu |

## Invariants

- Seuls les coefficients non-nuls sont stockes
- L'index est trie par position croissante
- Complexite O(1) par lookup

## References

- PLIX codec
- Q243 quantification
