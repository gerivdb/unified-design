# ADR/PRD/EPICS/INTENTS Atom

Pattern de tracabilite des decisions via artefacts de gouvernance.

## Role

Structure la creation, la validation et la tracabilite des documents decisionnels (ADR, PRD, EPICS, INTENTS).

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `artifact_types` | list | `[]` | Types d'artefacts supportes (ADR, PRD, EPIC, INTENT, REPORT, RPT, GUI, RUN) |
| `frontmatter_required` | list | `[]` | Champs obligatoires dans le frontmatter YAML |

## Invariants

- Tout artefact de gouvernance possede un frontmatter YAML valide (valide par `frontmatter-guardian`).
- Chaque ADR est lie a un intent_hash unique.
- Les PRD/EPICS sont decomposes en INTENTS avant implementation.
- Aucune decision d'impact transverse n'est implementee sans ADR backing.

## Exemple d'usage

```yaml
inherits:
  - adr-prd-epics-intents
```

