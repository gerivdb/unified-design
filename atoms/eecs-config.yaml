# EECS Config Atom

Pattern de configuration EECS par depot.

## Role

Le fichier `.eecs_config.yaml` definit la configuration environnementale d'un depot :
- environment : environnement cible (dev/staging/prod)
- mode : mode d'execution
- constraints : contraintes de deploiement
- dependencies : dependances EECS
- bridges : connexions EECS

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `environment` | string | - | Environnement cible |
| `mode` | string | - | Mode d'execution |
| `constraints` | list | `[]` | Contraintes de deploiement |
| `dependencies` | list | `[]` | Dependances EECS |
| `bridges` | list | `[]` | Connexions EECS |

## Invariants

- Tout depot avec des deploiements automatises DOIT avoir un .eecs_config.yaml
- Le mode DOIT etre coherent avec le pipeline CI/CD
- Les contraintes DOIVENT etre respectees lors du deploiement

## Exemple d'usage

```yaml
environment: production
mode: blue-green
constraints:
  - "BDCP mode must be active"
  - "No direct access to NEXUS"
dependencies:
  - gerivdb/GATEWAY-MANAGER
bridges:
  - type: MCP
    target: gerivdb/ECOS-CLI
```

