# ATOM-050 -- Meta-Design Triad

## Contexte

La triade Primitivisme / Structuralisme / Anamorphisme forme un invariant topologique complet qui structure l'écosystème selon trois dimensions orthogonales, retrouvables à chaque niveau fractal L0-L4.

## Piliers

| Pilier | Concept | Artefact MDU | Runtime |
|--------|---------|--------------|---------|
| Primitivisme | Atomes, Trit, données brutes | ATOM-045, ATOM-047 | TRIX |
| Structuralisme | Graphes, DAG-3, cycles | meta-design.yaml, atoms_registry.yaml | SPIDX |
| Anamorphisme | Projections narratives, tissage | ATOM-048 (gatekeeper), TALEX | PIANO/PLIX |

## Relations

- `anamorphism stabilizes [primitivism, structuralism]`
- `primitivism requires structuralism`
- `structuralism requires primitivism`

## Projections CLI

- `plix inspect --mode primitive` -> atomes
- `plix inspect --mode structural` -> graphes
- `plix inspect --mode anamorphic` -> projections narratives

