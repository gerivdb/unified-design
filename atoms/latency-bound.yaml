# Latency Bound Atom

Capacite de design imposant une limite de latence P99.

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `max_latency_ms` | int | `10` | Latence P99 maximale autorisee (ms) |

## Invariants

- Toute operation critique du design doit respecter `max_latency_ms`.
- En cas de depassement, le design doit inclure un mecanisme de retroaction (ex: backpressure, cache, ou optimisation PIANO).

## Exemple d'usage

```yaml
capabilities:
  - name: latency-bound
    parameters:
      max_latency_ms: 45
```

