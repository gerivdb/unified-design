# KiloCode Modes Registry Atom

Pattern de registre des modes KiloCode par depot.

## Role

Le repertoire `.kilocode/modes/` contient les definitions YAML des modes d'operation de l'agent IA pour un depot specifique. Chaque mode definit :
- mode_id : identifiant unique
- name : nom lisible
- description : description du mode
- tools : outils autorises
- constraints : contraintes specifiques

## Parametres

| Parametre | Type | Defaut | Description |
|-----------|------|--------|-------------|
| `mode_id` | string | - | Identifiant unique du mode |
| `name` | string | - | Nom lisible |
| `description` | string | - | Description du mode |
| `tools` | list | `[]` | Outils autorises |
| `constraints` | list | `[]` | Contraintes specifiques |

## Invariants

- Chaque mode DOIT avoir un mode_id unique
- Les outils listes DOIVENT etre disponibles dans l'environnement
- Les contraintes DOIVENT etre respectees lors de l'activation du mode

## Exemple d'usage

```yaml
mode_id: accessibility-checker
name: Accessibility Checker
description: "Verifie la conformite WCAG du code"
tools:
  - read
  - grep
  - bash
constraints:
  - "Ne pas modifier le code"
  - "Signaler les violations uniquement"
```

