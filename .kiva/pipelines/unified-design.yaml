name: unified-design
description: Pipeline de validation souverain pour unified-design (KIVA-CLI local)

steps:
  - name: Validate meta-design schema
    command: python scripts/validate_meta_design.py --schema schemas/meta-design.schema.json meta-design.yaml

  - name: Validate atoms YAML
    command: python scripts/validate_yaml.py "atoms/*.yaml"

  - name: Validate designs YAML
    command: python scripts/validate_yaml.py "designs/*.yaml"

  - name: Validate ATOM-051 atom
    command: python scripts/validate_yaml.py "atoms/relation-conflict-resolution.yaml"

  - name: CFMI Scan
    command: $env:PYTHONPATH='D:/DO/WEB/TOOLS/L1-INFRA/FLUENCE'; python -c "from plix.governance import scan_gates; from pathlib import Path; print(scan_gates(Path('.')))"
    timeout: 30s
