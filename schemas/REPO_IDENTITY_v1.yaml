schema: repo-identity
version: "1.0.0"
status: active
intent_hash: 0xREPO_IDENTITY_SCHEMA_V1_20260929

fields:
  - name: full_name
    type: string
    required: true
    pattern: "^gerivdb/[A-Za-z0-9._-]+$"
  - name: local_path
    type: string
    required: true
    pattern: "^D:\\\\DO\\\\WEB\\\\TOOLS\\\\(L0-CANON|L0-INFRASTRUCTURE|L1-INFRA|L2-PLATFORM|L3-CITIZENS|L4-TOOLS|L5-ARCHIVE|L6-WORK)\\\\[^\\\\]+$"
  - name: remote
    type: string
    required: true
    pattern: "^https://github\\.com/gerivdb/[A-Za-z0-9._-]+\\.git$"
  - name: status
    type: string
    required: true
    enum: [active, dormant, deprecated, archived]
  - name: do_not_create
    type: boolean
    required: true
  - name: entity_type
    type: string
    required: false
    enum: [REPO, TOOL, PIPELINE, CITIZEN, SKILL]
  - name: strate
    type: string
    required: false
    pattern: "^L[0-6]"
