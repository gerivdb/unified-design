---
type: REPO_IDENTITY_SCHEMA
version: "1.0.0"
date: "2026-09-27"
status: approved
schema: REPO_IDENTITY_v1
description: Schema canonicalique pour la désignation des repos de l'écosystème gerivdb.

# Champs obligatoires
required_fields:
  - type
  - repo
  - local_path
  - remote
  - entity_type
  - status
  - strate
  - layer
  - owner
  - author
  - created
  - updated
  - description

# Champs optionnels
optional_fields:
  - rss_version
  - rss_depth
  - pole_id
  - profil
  - immutable_paths
  - semantic_clusters
  - do_not_create
  - do_not_edit

# Valeurs autorisées
enum_values:
  entity_type:
    - REPO
    - TOOL
    - CITIZEN
    - ENGINE
    - POLE
  status:
    - active
    - dormant
    - deprecated
    - archived
  strate:
    - L0-CANON
    - L0-INFRASTRUCTURE
    - L1-INFRA
    - L2-PLATFORM
    - L3-CITIZENS
    - L4-TOOLS
    - L5-ARCHIVE
    - L6-WORK
  layer:
    - N+1
    - N+2
    - N+3
    - N+4
    - N+3.5
  profil:
    - CRITICAL
    - TOOL
    - MASTER
    - CITIZEN

# Contraintes
constraints:
  repo_format: "gerivdb/<REPO_NAME>"
  local_path_format: "D:\\DO\\WEB\\TOOLS\\<STRATE>\\<REPO_NAME>"
  remote_format: "https://github.com/gerivdb/<REPO_NAME>.git"
  date_format: "YYYY-MM-DD"
  updated_format: "YYYY-MM-DD"
